<!DOCTYPE html>
<html lang="sw" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>VACCINATION SYSTEM</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-gradient: linear-gradient(135deg, #2563eb, #3b82f6, #6366f1);
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --info: #06b6d4;
            --info-light: #cffafe;
            --bg: #f0f4f8;
            --bg-secondary: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
            --shadow-xl: 0 20px 50px rgba(0,0,0,0.15);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            --transition: 0.25s ease;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --banner-bg: #fef3c7;
            --banner-text: #92400e;
            --banner-border: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #0a0f1e;
            --bg-secondary: #111827;
            --surface: #1a2332;
            --surface-hover: #243044;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #2d3a4a;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow: 0 4px 8px rgba(0,0,0,0.4);
            --shadow-md: 0 8px 16px rgba(0,0,0,0.5);
            --shadow-lg: 0 15px 30px rgba(0,0,0,0.6);
            --shadow-xl: 0 25px 50px rgba(0,0,0,0.7);
            --primary-light: #1e3a5f;
            --success-light: #064e3b;
            --warning-light: #78350f;
            --danger-light: #7f1d1d;
            --info-light: #164e63;
            --banner-bg: #78350f;
            --banner-text: #fef3c7;
            --banner-border: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; transition: background 0.3s, color 0.3s; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--text-secondary); border-radius: 10px; }

        /* STATIC BANNER - HAISOGEI KWENYE VIFAA VYOTE */
        .announcement-banner-wrapper {
            background: var(--banner-bg);
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 101;
            height: 44px;
            display: none;
            align-items: center;
            border-bottom: 2px solid var(--banner-border);
            box-shadow: var(--shadow-md);
        }
        .announcement-banner-wrapper.visible { display: flex; }
        .announcement-banner {
            color: var(--banner-text);
            padding: 0 16px;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .banner-scroll-container { overflow: hidden; flex: 1; display: flex; align-items: center; }
        .banner-scroll-text { white-space: nowrap; animation: scrollBanner 15s linear infinite; padding-left: 100%; font-weight: 600; }
        @keyframes scrollBanner { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .banner-scroll-text:hover { animation-play-state: paused; }
        .banner-close {
            cursor: pointer; border: none; background: transparent;
            color: var(--banner-text); font-weight: bold;
            padding: 4px 10px; margin-left: 8px; font-size: 1.1rem;
            border-radius: 4px; transition: var(--transition);
        }
        .banner-close:hover { background: rgba(0,0,0,0.15); }

        .loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .loading-screen.hidden { display: none; }
        .loader-ring { width: 48px; height: 48px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast-container { position: fixed; top: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; max-width: 400px; }
        .toast { padding: 14px 18px; border-radius: 14px; display: flex; align-items: center; gap: 10px; animation: toastIn 0.4s ease; font-weight: 500; font-size: 0.9rem; backdrop-filter: blur(20px); box-shadow: var(--shadow-lg); }
        .toast.success { background: rgba(16,185,129,0.15); color: #065f46; border-left: 4px solid #10b981; }
        .toast.error { background: rgba(239,68,68,0.15); color: #991b1b; border-left: 4px solid #ef4444; }
        .toast.warning { background: rgba(245,158,11,0.15); color: #92400e; border-left: 4px solid #f59e0b; }
        .toast.info { background: rgba(6,182,212,0.15); color: #155e75; border-left: 4px solid #06b6d4; }
        [data-theme="dark"] .toast.success { color: #6ee7b7; } [data-theme="dark"] .toast.error { color: #fca5a5; } [data-theme="dark"] .toast.warning { color: #fcd34d; } [data-theme="dark"] .toast.info { color: #67e8f9; }
        @keyframes toastIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-close { background: none; border: none; cursor: pointer; color: inherit; opacity: 0.5; font-size: 1rem; padding: 4px; }

        /* HEADER - ina margin juu kama banner ipo */
        .app-header {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 0 24px; height: 64px; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0; z-index: 100;
            box-shadow: var(--shadow-sm); margin-top: 0; transition: margin-top 0.3s;
        }
        .app-header.has-banner { top: 44px; }
        .app-logo { display: flex; align-items: center; gap: 12px; font-size: 1.15rem; font-weight: 700; color: var(--primary); }
        .logo-icon { width: 40px; height: 40px; border-radius: var(--radius); background: var(--primary-gradient); display: flex; align-items: center; justify-content: center; color: white; font-size: 1.2rem; }
        .header-actions { display: flex; align-items: center; gap: 10px; }

        .theme-toggle-btn { width: 48px; height: 28px; border-radius: 30px; background: var(--border); border: none; cursor: pointer; position: relative; }
        .toggle-circle { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); transition: var(--transition); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
        [data-theme="dark"] .theme-toggle-btn { background: var(--primary); }
        [data-theme="dark"] .toggle-circle { left: 23px; }

        .btn { padding: 10px 20px; border: none; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: var(--transition); display: inline-flex; align-items: center; gap: 8px; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary-gradient); color: white; box-shadow: 0 4px 15px rgba(37,99,235,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(37,99,235,0.45); }
        .btn-secondary { background: var(--surface); color: var(--text); border: 2px solid var(--border); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; border-radius: 20px; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; color: var(--text-secondary); }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem; background: var(--bg-secondary); color: var(--text); font-family: var(--font); }
        .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37,99,235,0.08); background: var(--surface); }

        .card { background: var(--surface); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--surface); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; align-items: center; gap: 16px; cursor: pointer; transition: var(--transition); }
        .stat-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); border-color: var(--primary); }
        .stat-icon { width: 52px; height: 52px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
        .stat-value { font-size: 2rem; font-weight: 800; }
        .stat-label { font-size: 0.8rem; color: var(--text-secondary); }

        .table-container { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; background: var(--surface); }
        th { background: var(--bg-secondary); padding: 14px 16px; text-align: left; font-weight: 700; font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; border-bottom: 2px solid var(--border); }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        tbody tr:hover { background: var(--bg-secondary); }

        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-success { background: var(--success-light); color: #065f46; }
        .badge-danger { background: var(--danger-light); color: #991b1b; }
        .badge-warning { background: var(--warning-light); color: #92400e; }
        .badge-info { background: var(--info-light); color: #155e75; }
        .badge-primary { background: var(--primary-light); color: var(--primary); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal { background: var(--surface); border-radius: var(--radius-xl); padding: 30px; max-width: 580px; width: 92%; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-xl); animation: modalIn 0.3s ease; }
        @keyframes modalIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
        .modal-header h3 { font-size: 1.3rem; font-weight: 700; }
        .close-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface); cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
        .close-btn:hover { background: var(--danger); color: white; border-color: var(--danger); }

        .tabs { display: flex; gap: 6px; background: var(--bg-secondary); padding: 6px; border-radius: var(--radius); margin-bottom: 20px; border: 1px solid var(--border); }
        .tab { padding: 10px 20px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 0.9rem; background: transparent; color: var(--text-secondary); }
        .tab.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow); }

        .nav-container { display: flex; gap: 4px; flex-wrap: wrap; padding: 8px 0; }
        .nav-link { padding: 10px 18px; border-radius: 30px; text-decoration: none; color: var(--text-secondary); font-weight: 600; font-size: 0.9rem; cursor: pointer; border: 2px solid transparent; }
        .nav-link:hover { background: var(--bg-secondary); color: var(--text); }
        .nav-link.active { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

        .search-box { display: flex; gap: 10px; margin-bottom: 16px; }
        .search-box .form-input { flex: 1; min-width: 200px; border-radius: 30px; }
        .welcome-section { background: var(--primary-gradient); color: white; border-radius: var(--radius-lg); padding: 24px 28px; margin-bottom: 24px; box-shadow: var(--shadow-lg); }
        .welcome-section h2 { font-size: 1.4rem; }
        .page-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 20px; }
        .hidden { display: none !important; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .empty-icon { font-size: 3.5rem; margin-bottom: 12px; }
        .error-box { background: var(--danger-light); color: #991b1b; padding: 14px 18px; border-radius: var(--radius-sm); margin-bottom: 18px; border: 1px solid var(--danger); }
        .success-box { background: var(--success-light); color: #065f46; padding: 14px 18px; border-radius: var(--radius-sm); margin-bottom: 18px; border: 1px solid var(--success); }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .stat-card { padding: 14px; }
            .stat-value { font-size: 1.5rem; }
            .app-header { padding: 0 14px; height: 56px; }
            .app-header.has-banner { top: 38px; }
            .announcement-banner-wrapper { height: 38px; }
            .banner-scroll-text { font-size: 0.78rem; }
        }
        @media (max-width: 480px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="loading-screen" id="loadingScreen"><div style="text-align:center;"><div class="loader-ring"></div><p style="color:var(--text-secondary);">⚡ Inapakia mfumo...</p></div></div>
    <div class="toast-container" id="toastContainer"></div>

    <!-- STATIC BANNER - Inaonekana tu kama kuna tangazo -->
    <div class="announcement-banner-wrapper" id="announcementBannerWrapper">
        <div class="announcement-banner">
            <span style="margin-right:10px;">📢</span>
            <div class="banner-scroll-container"><span class="banner-scroll-text" id="bannerScrollText"></span></div>
            <button class="banner-close" onclick="dismissBanner()">×</button>
        </div>
    </div>

    <div id="appContainer" class="hidden">
        <header class="app-header" id="appHeader">
            <div class="app-logo"><div class="logo-icon">💉</div>VACCINATION SYSTEM</div>
            <div class="header-actions">
                <button class="theme-toggle-btn" onclick="toggleTheme()"><span class="toggle-circle" id="toggleCircle">☀️</span></button>
                <span id="userDisplayName" style="font-weight:600;font-size:0.9rem;"></span>
                <button class="btn btn-sm btn-outline" onclick="logout()">🚪 Toka</button>
            </div>
        </header>

        <div style="padding:12px 24px 0;background:var(--surface);border-bottom:1px solid var(--border);">
            <nav class="nav-container" id="mainNav">
                <a class="nav-link active" data-page="dashboard">📊 Dashboard</a>
                <a class="nav-link" data-page="children">👶 Watoto</a>
                <a class="nav-link" data-page="vaccinations">💉 Chanjo</a>
                <a class="nav-link" data-page="schedule">📅 Ratiba</a>
                <a class="nav-link" data-page="reports">📈 Ripoti</a>
                <a class="nav-link admin-only hidden" data-page="admin">🛡️ Admin</a>
            </nav>
        </div>
        <div style="padding:24px;max-width:1400px;margin:0 auto;" id="pageContent"></div>
    </div>

    <div id="authContainer" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);">
        <div class="card" style="max-width:480px;width:100%;padding:36px 28px;">
            <div id="statusMessage"></div>
            <div id="loginForm">
                <div style="text-align:center;margin-bottom:28px;"><div style="width:64px;height:64px;border-radius:var(--radius);background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 14px;color:white;">💉</div><h2 style="color:var(--text);">VACCINATION SYSTEM</h2><p style="color:var(--text-secondary);font-size:0.9rem;">Mfumo wa Kisasa wa Chanjo</p></div>
                <div class="form-group"><label>📧 Email</label><input type="email" class="form-input" id="loginEmail" placeholder="example@email.com"></div>
                <div class="form-group"><label>🔐 Nywila</label><input type="password" class="form-input" id="loginPassword" placeholder="••••••••"></div>
                <button class="btn btn-primary" style="width:100%;padding:14px;" onclick="login()">🚀 Ingia</button>
                <div style="text-align:center;margin-top:18px;"><p style="color:var(--text-secondary);font-size:0.85rem;">Huna akaunti? <a href="#" onclick="showAuthForm('register')" style="color:var(--primary);font-weight:700;">✨ Sajili hapa</a></p></div>
            </div>
            <div id="registerForm" class="hidden">
                <div style="text-align:center;margin-bottom:24px;"><h2 style="color:var(--primary);">✨ Sajili Akaunti</h2><p style="color:var(--text-secondary);font-size:0.85rem;">Jaza taarifa za kituo cha afya</p></div>
                <div class="form-group"><label>👤 Jina Kamili *</label><input type="text" class="form-input" id="regFullName" placeholder="Jina lako kamili"></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><div class="form-group"><label>⚧ Jinsia *</label><select class="form-select" id="regGender"><option value="">Chagua</option><option>Me</option><option>Ke</option></select></div><div class="form-group"><label>📱 Simu *</label><input type="tel" class="form-input" id="regPhone" placeholder="07XXXXXXXX"></div></div>
                <div class="form-group"><label>📧 Email *</label><input type="email" class="form-input" id="regEmail" placeholder="example@email.com"></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><div class="form-group"><label>📍 Mkoa *</label><input type="text" class="form-input" id="regRegion" placeholder="Mkoa"></div><div class="form-group"><label>📍 Wilaya *</label><input type="text" class="form-input" id="regDistrict" placeholder="Wilaya"></div></div>
                <div class="form-group"><label>🏥 Kituo cha Afya *</label><input type="text" class="form-input" id="regFacility" placeholder="Jina la kituo"></div>
                <div class="form-group"><label>🔐 Nywila * (8+ herufi)</label><input type="password" class="form-input" id="regPassword" placeholder="••••••••"></div>
                <button class="btn btn-primary" style="width:100%;padding:14px;" onclick="register()">✨ Sajili</button>
                <div style="text-align:center;margin-top:18px;"><p style="color:var(--text-secondary);font-size:0.85rem;">Tayari una akaunti? <a href="#" onclick="showAuthForm('login')" style="color:var(--primary);font-weight:700;">🚀 Ingia</a></p></div>
            </div>
        </div>
    </div>

<script>
const APPWRITE_CONFIG = {
    endpoint: 'https://fra.cloud.appwrite.io/v1',
    projectId: '6a21b1440038c361fabb',
    databaseId: '6a21b1f8000e608360bb',
    collections: { users: 'users', children: 'children', vaccinations: 'vaccinations', systemSettings: 'system_settings', announcements: 'announcements' }
};

const { Client, Account, Databases, ID, Query } = Appwrite;
const client = new Client().setEndpoint(APPWRITE_CONFIG.endpoint).setProject(APPWRITE_CONFIG.projectId);
const account = new Account(client);
const databases = new Databases(client);

let currentUser = null, isAdmin = false, activeAnnouncement = null;
const VACCINES = ['BCG','OPV','Pentavalent','PCV','Rotavirus','IPV','Measles','Rubella','Vitamin A'];

function toggleTheme() { const h=document.documentElement; const t=h.getAttribute('data-theme')==='dark'?'light':'dark'; h.setAttribute('data-theme',t); document.getElementById('toggleCircle').textContent=t==='dark'?'🌙':'☀️'; }
function initTheme() { const t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'; document.documentElement.setAttribute('data-theme',t); document.getElementById('toggleCircle').textContent=t==='dark'?'🌙':'☀️'; }

// ==================== BANNER FUNCTIONS ====================
async function loadAnnouncement() {
    try {
        const d = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.announcements, [Query.equal('isActive', true), Query.orderDesc('$createdAt'), Query.limit(1)]);
        if (d.documents.length > 0) {
            activeAnnouncement = d.documents[0];
            showBanner(activeAnnouncement.message);
        } else {
            hideBanner();
        }
    } catch(e) {
        hideBanner();
    }
}

function showBanner(m) {
    const wrapper = document.getElementById('announcementBannerWrapper');
    const textEl = document.getElementById('bannerScrollText');
    const header = document.getElementById('appHeader');
    if (wrapper && textEl && m) {
        textEl.textContent = m;
        wrapper.classList.add('visible');
        if (header) header.classList.add('has-banner');
    }
}

function hideBanner() {
    const wrapper = document.getElementById('announcementBannerWrapper');
    const header = document.getElementById('appHeader');
    if (wrapper) wrapper.classList.remove('visible');
    if (header) header.classList.remove('has-banner');
    activeAnnouncement = null;
}

function dismissBanner() {
    hideBanner();
}

async function saveAnnouncement(msg) {
    try {
        // Deactivate all existing announcements
        try {
            const existingDocs = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.announcements, [Query.equal('isActive', true)]);
            for (const x of existingDocs.documents) {
                await databases.updateDocument(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.announcements, x.$id, { isActive: false });
            }
        } catch(e) {}

        // Create new announcement
        const newDoc = await databases.createDocument(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.announcements, ID.unique(), {
            announcementId: ID.unique(), message: msg, isActive: true,
            createdBy: currentUser.userId, createdAt: new Date().toISOString()
        });
        activeAnnouncement = newDoc;
        showBanner(msg);
        return true;
    } catch(e) {
        return false;
    }
}

function showToast(msg, type) {
    type = type || 'info';
    const icons = { success: '✓', error: '✗', warning: '⚠', info: 'ℹ' };
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.innerHTML = '<span style="font-size:1.3rem;">' + (icons[type] || icons.info) + '</span><span style="flex:1;">' + escapeHtml(msg) + '</span><button class="toast-close" onclick="this.parentElement.remove()">×</button>';
    c.appendChild(t);
    setTimeout(function() { t.style.opacity = '0'; t.style.transform = 'translateX(120%)'; t.style.transition = '0.3s'; setTimeout(function() { t.remove(); }, 300); }, 5000);
}

function showLoading(s) { document.getElementById('loadingScreen').classList.toggle('hidden', !s); }
function escapeHtml(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function formatDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('sw-TZ', { year: 'numeric', month: 'short', day: 'numeric' }); }
function getDaysRemaining(d) { if (!d) return null; return Math.ceil((new Date(d) - new Date()) / (1000 * 60 * 60 * 24)); }
function setStatus(msg, type) {
    type = type || 'error';
    var d = document.getElementById('statusMessage');
    if (msg) d.innerHTML = '<div class="' + (type === 'error' ? 'error-box' : 'success-box') + '">' + msg + '</div>';
    else d.innerHTML = '';
}

function showAuthForm(f) {
    document.getElementById('loginForm').classList.toggle('hidden', f !== 'login');
    document.getElementById('registerForm').classList.toggle('hidden', f !== 'register');
    setStatus('');
    if (f === 'login') document.getElementById('loginPassword').value = '';
    if (f === 'register') {
        document.getElementById('regFullName').value = '';
        document.getElementById('regGender').value = '';
        document.getElementById('regPhone').value = '';
        document.getElementById('regEmail').value = '';
        document.getElementById('regRegion').value = '';
        document.getElementById('regDistrict').value = '';
        document.getElementById('regFacility').value = '';
        document.getElementById('regPassword').value = '';
    }
}

async function register() {
    var fn = document.getElementById('regFullName').value.trim();
    var g = document.getElementById('regGender').value;
    var ph = document.getElementById('regPhone').value.trim();
    var em = document.getElementById('regEmail').value.trim();
    var r = document.getElementById('regRegion').value.trim();
    var d = document.getElementById('regDistrict').value.trim();
    var f = document.getElementById('regFacility').value.trim();
    var pw = document.getElementById('regPassword').value;
    setStatus('');
    if (!fn || !em || !pw || !ph || !r || !d || !f || !g) { setStatus('⚠ Jaza taarifa zote zenye *', 'error'); return; }
    if (pw.length < 8) { setStatus('⚠ Nywila iwe na angalau herufi 8', 'error'); return; }
    setStatus('⏳ Inasajili...', 'success'); showLoading(true);
    try {
        var ua = await account.create(ID.unique(), em, pw, fn);
        await databases.createDocument(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.users, ID.unique(), { userId: ua.$id, fullName: fn, gender: g, phone: ph, email: em, region: r, district: d, facility: f, role: 'health_worker', status: 'active', createdAt: new Date().toISOString() });
        await account.createEmailSession(em, pw);
        document.getElementById('regFullName').value = '';
        document.getElementById('regGender').value = '';
        document.getElementById('regPhone').value = '';
        document.getElementById('regEmail').value = '';
        document.getElementById('regRegion').value = '';
        document.getElementById('regDistrict').value = '';
        document.getElementById('regFacility').value = '';
        document.getElementById('regPassword').value = '';
        await loadUserAndEnter(ua.$id);
        showLoading(false); setStatus(''); showToast('✓ Akaunti imesajiliwa!', 'success');
    } catch(e) { showLoading(false); setStatus(e.message.includes('already exists') ? '⚠ Email hii tayari imesajiliwa!' : '✗ Imeshindwa: ' + escapeHtml(e.message), 'error'); }
}

async function login() {
    var em = document.getElementById('loginEmail').value.trim();
    var pw = document.getElementById('loginPassword').value;
    setStatus('');
    if (!em || !pw) { setStatus('⚠ Jaza email na nywila', 'error'); return; }
    setStatus('⏳ Inakuingiza...', 'success'); showLoading(true);
    try {
        await account.createEmailSession(em, pw);
        var ua = await account.get();
        await loadUserAndEnter(ua.$id);
        showLoading(false); setStatus(''); showToast('✓ Umefanikiwa kuingia!', 'success');
    } catch(e) { showLoading(false); setStatus(e.message.includes('Invalid credentials') ? '✗ Email au Nywila si sahihi!' : '✗ Imeshindwa: ' + escapeHtml(e.message), 'error'); }
}

async function loadUserAndEnter(userId) {
    var role = 'health_worker', userDoc;
    try {
        var ua = await account.get();
        try {
            var ud = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.users, [Query.equal('userId', userId)]);
            if (ud.documents.length > 0) { userDoc = ud.documents[0]; role = userDoc.role || 'health_worker'; }
        } catch(e) {}
        if (!userDoc) {
            userDoc = await databases.createDocument(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.users, ID.unique(), { userId: userId, fullName: ua.name || '', email: ua.email || '', phone: '', gender: '', region: '', district: '', facility: '', role: 'health_worker', status: 'active', createdAt: new Date().toISOString() });
        }
    } catch(e) { return; }
    currentUser = userDoc; isAdmin = (role === 'admin');
    document.getElementById('userDisplayName').textContent = currentUser.fullName || currentUser.email || 'Mtoa Huduma';
    document.getElementById('authContainer').classList.add('hidden');
    document.getElementById('appContainer').classList.remove('hidden');
    if (isAdmin) document.querySelectorAll('.admin-only').forEach(function(el) { el.classList.remove('hidden'); });
    await loadAnnouncement();
    navigateTo('dashboard');
}

async function logout() {
    try { await account.deleteSession('current'); } catch(e) {}
    currentUser = null; isAdmin = false;
    document.getElementById('appContainer').classList.add('hidden');
    document.getElementById('authContainer').classList.remove('hidden');
    document.getElementById('authContainer').style.display = 'flex';
    document.querySelectorAll('.admin-only').forEach(function(el) { el.classList.add('hidden'); });
    hideBanner();
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPassword').value = '';
    setStatus('');
    showAuthForm('login');
    showToast('🚪 Umetoka kwenye mfumo.', 'info');
}

function navigateTo(page) {
    document.querySelectorAll('.nav-link').forEach(function(l) { l.classList.toggle('active', l.dataset.page === page); });
    loadPage(page);
}

async function loadPage(page) {
    var c = document.getElementById('pageContent'); showLoading(true);
    try {
        if (page === 'dashboard') c.innerHTML = await renderDashboard();
        else if (page === 'children') c.innerHTML = await renderChildrenPage();
        else if (page === 'vaccinations') c.innerHTML = await renderVaccinationsPage();
        else if (page === 'schedule') c.innerHTML = await renderSchedulePage();
        else if (page === 'reports') c.innerHTML = await renderReportsPage();
        else if (page === 'admin') c.innerHTML = isAdmin ? await renderAdminPage() : '<div class="card empty-state"><div class="empty-icon">🛡️</div><h3>Hauna Ruhusa</h3></div>';
        document.querySelectorAll('.nav-link').forEach(function(l) { l.onclick = function(e) { e.preventDefault(); navigateTo(l.dataset.page); }; });
    } catch(e) { c.innerHTML = '<div class="card empty-state"><div class="empty-icon">✗</div><h3>Imeshindwa</h3><p>' + escapeHtml(e.message) + '</p><button class="btn btn-primary" onclick="navigateTo(\'dashboard\')">Rudi Dashboard</button></div>'; }
    showLoading(false);
}

async function renderDashboard() {

    var cd = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.children, [Query.equal('createdBy', currentUser.userId)]);
    var cids = cd.documents.map(function(c) { return c.childId; });
    var av = [];
    for (var i = 0; i < cids.length; i++) {
        var v = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.vaccinations, [Query.equal('childId', cids[i]), Query.orderDesc('vaccinationDate')]);

    return '<div class="welcome-section"><h2>👋 Karibu, ' + escapeHtml(currentUser.fullName || currentUser.email) + '!</h2><p>🏥 ' + escapeHtml(currentUser.facility || 'Kituo chako') + ' • ' + (currentUser.role === 'admin' ? '🛡️ Admin' : '👨‍⚕️ Mtoa Huduma') + '</p></div>' +

    '<div class="stats-grid"><div class="stat-card" onclick="navigateTo(\'children\')"><div class="stat-icon" style="background:var(--primary-light);color:var(--primary);">👶</div><div><div class="stat-value">' + cd.total + '</div><div class="stat-label">Watoto</div></div></div><div class="stat-card" onclick="navigateTo(\'vaccinations\')"><div class="stat-icon" style="background:var(--success-light);color:var(--success);">💉</div><div><div class="stat-value">' + av.length + '</div><div class="stat-label">Chanjo</div></div></div><div class="stat-card"><div class="stat-icon" style="background:var(--warning-light);color:var(--warning);">📅</div><div><div class="stat-value">' + tv.length + '</div><div class="stat-label">Leo</div></div></div><div class="stat-card" onclick="navigateTo(\'schedule\')"><div class="stat-icon" style="background:var(--danger-light);color:var(--danger);">⚠</div><div><div class="stat-value">' + od.length + '</div><div class="stat-label">Zimechelewa</div></div></div></div>' +
    (tv.length > 0 ? '<div class="card" style="border-left:4px solid var(--success);"><h3 style="color:var(--success);">✓ Chanjo za Leo (' + tv.length + ')</h3><div class="table-container"><table><thead><tr><th>👶 Mtoto</th><th>💉 Chanjo</th><th>📊 Dozi</th></tr></thead><tbody>' + tv.map(function(v) { var c = cd.documents.find(function(x) { return x.childId === v.childId; }); return '<tr><td><strong>' + escapeHtml(c ? c.fullName : '?') + '</strong></td><td><span class="badge badge-success">' + v.vaccineName + '</span></td><td>' + v.dose + '</td></tr>'; }).join('') + '</tbody></table></div></div>' : '') +
    (od.length > 0 ? '<div class="card" style="border-left:4px solid var(--danger);"><h3 style="color:var(--danger);">⚠ Zilizochelewa (' + od.length + ')</h3><div class="table-container"><table><thead><tr><th>👶 Mtoto</th><th>💉 Chanjo</th><th>📅 Ilitakiwa</th><th>⏰ Siku</th></tr></thead><tbody>' + od.slice(0,5).map(function(v) { var c = cd.documents.find(function(x) { return x.childId === v.childId; }); var days = Math.abs(getDaysRemaining(v.nextVaccinationDate)); return '<tr><td><strong>' + escapeHtml(c ? c.fullName : '?') + '</strong></td><td>' + v.vaccineName + ' D' + v.dose + '</td><td>' + formatDate(v.nextVaccinationDate) + '</td><td><span class="badge badge-danger">' + days + 'siku</span></td></tr>'; }).join('') + '</tbody></table></div></div>' : '') +

async function quickVaccinate() {
    var ci = document.getElementById('quickChild').value;
    var vn = document.getElementById('quickVaccine').value;
    var dt = document.getElementById('quickDate').value;
    var rd = document.getElementById('quickVaxResult');
    if (!ci || !vn || !dt) { rd.innerHTML = '<p style="color:var(--danger);">⚠ Chagua mtoto, chanjo na tarehe.</p>'; return; }
    rd.innerHTML = '<p style="color:var(--primary);">⏳ Inarekodi...</p>';
    try {
        var n = new Date(dt);
        var iv = { BCG: 0, OPV: 28, Pentavalent: 28, PCV: 28, Rotavirus: 28, IPV: 28, Measles: 0, Rubella: 0, 'Vitamin A': 180 };
        n.setDate(n.getDate() + (iv[vn] || 28));
        var nd = iv[vn] === 0 ? '' : n.toISOString().split('T')[0];
        await databases.createDocument(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.vaccinations, ID.unique(), { vaccinationId: ID.unique(), childId: ci, vaccineName: vn, dose: 1, vaccinationDate: dt, nextVaccinationDate: nd, providerId: currentUser.userId, notes: '', createdAt: new Date().toISOString() });
        var ch = window._dashData ? window._dashData.children.find(function(c) { return c.childId === ci; }) : null;
        rd.innerHTML = '<p style="color:var(--success);">✓ Chanjo ya <strong>' + vn + '</strong> imerekodiwa kwa <strong>' + escapeHtml(ch ? ch.fullName : 'Mtoto') + '</strong>!</p>';

        showToast('💉 Chanjo imerekodiwa!', 'success');
    } catch(e) { rd.innerHTML = '<p style="color:var(--danger);">✗ Imeshindwa: ' + escapeHtml(e.message) + '</p>'; }
}

async function renderSchedulePage() {
    var cd = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.children, [Query.equal('createdBy', currentUser.userId)]);
    var cids = cd.documents.map(function(c) { return c.childId; });
    var av = [];
    for (var i = 0; i < cids.length; i++) { var v = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.vaccinations, [Query.equal('childId', cids[i])]); av = av.concat(v.documents); }
    var today = new Date().toISOString().split('T')[0];
    var od = av.filter(function(v) { return v.nextVaccinationDate && v.nextVaccinationDate < today; });
    return '<h2 class="page-title">📅 Ratiba</h2><div class="card"><h3>⚠ Zilizochelewa (' + od.length + ')</h3><div class="table-container"><table><thead><tr><th>👶 Mtoto</th><th>💉 Chanjo</th><th>📅 Ilitakiwa</th><th>⏰ Siku</th></tr></thead><tbody>' + (od.map(function(v) { var c = cd.documents.find(function(x) { return x.childId === v.childId; }); var days = Math.abs(getDaysRemaining(v.nextVaccinationDate)); return '<tr><td><strong>' + escapeHtml(c ? c.fullName : '?') + '</strong></td><td>' + v.vaccineName + ' D' + v.dose + '</td><td>' + formatDate(v.nextVaccinationDate) + '</td><td><span class="badge badge-danger">' + days + 'siku</span></td></tr>'; }).join('') || '<tr><td colspan="4">✓ Hakuna zilizochelewa</td></tr>') + '</tbody></table></div></div>';
}

async function renderReportsPage() {
    var cd = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.children, [Query.equal('createdBy', currentUser.userId)]);
    var cids = cd.documents.map(function(c) { return c.childId; });
    var av = [];
    for (var i = 0; i < cids.length; i++) { var v = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.vaccinations, [Query.equal('childId', cids[i])]); av = av.concat(v.documents); }
    window._reports = { childrenDocs: cd, allVax: av };
    var bv = {};
    av.forEach(function(v) { bv[v.vaccineName] = (bv[v.vaccineName] || 0) + 1; });
    return '<h2 class="page-title">📈 Ripoti</h2><div class="stats-grid"><div class="stat-card"><div class="stat-icon" style="background:var(--primary-light);color:var(--primary);">👶</div><div><div class="stat-value">' + cd.total + '</div><div class="stat-label">Watoto</div></div></div><div class="stat-card"><div class="stat-icon" style="background:var(--success-light);color:var(--success);">💉</div><div><div class="stat-value">' + av.length + '</div><div class="stat-label">Chanjo</div></div></div></div><div class="card"><h4>💉 Chanjo kwa Aina</h4><table><thead><tr><th>Chanjo</th><th>Idadi</th></tr></thead><tbody>' + Object.entries(bv).sort(function(a,b) { return b[1] - a[1]; }).map(function(e) { return '<tr><td><strong>' + e[0] + '</strong></td><td><span class="badge badge-primary">' + e[1] + '</span></td></tr>'; }).join('') + '</tbody></table></div><button class="btn btn-primary" style="margin-top:16px;" onclick="exportCSV()">📥 Pakua CSV</button>';
}

function exportCSV() {
    var d = window._reports;
    var csv = 'Mtoto,Jinsia,Mzazi,Simu,Kituo,Chanjo,Dozi,Tarehe\n';
    d.childrenDocs.documents.forEach(function(c) {
        var cv = d.allVax.filter(function(v) { return v.childId === c.childId; });
        if (cv.length === 0) csv += '"' + c.fullName + '","' + c.gender + '","' + c.parentName + '","' + c.parentPhone + '","' + c.facility + '","—","—","—"\n';
        else cv.forEach(function(v) { csv += '"' + c.fullName + '","' + c.gender + '","' + c.parentName + '","' + c.parentPhone + '","' + c.facility + '","' + v.vaccineName + '","' + v.dose + '","' + v.vaccinationDate + '"\n'; });
    });
    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'vaccination_ripoti.csv'; a.click();
    showToast('✓ Ripoti imepakuliwa!', 'success');
}

// ==================== ADMIN ====================
async function renderAdminPage() {
    if (!isAdmin) return '<div class="card empty-state"><div class="empty-icon">🛡️</div><h3>Hauna Ruhusa</h3></div>';
    var ud = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.users, [Query.orderDesc('$createdAt')]);
    var cd = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.children, [Query.orderDesc('$createdAt')]);
    var vd = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.vaccinations, [Query.orderDesc('vaccinationDate')]);
    var ca = '';
    try { var ad = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.announcements, [Query.equal('isActive', true), Query.limit(1)]); if (ad.documents.length > 0) ca = ad.documents[0].message; } catch(e) {}
    window._admin = { users: ud.documents, children: cd.documents, vax: vd.documents };
    return '<div class="welcome-section"><h2>🛡️ Admin Panel</h2><p>👑 Admin pekee anaweza kusimamia.</p></div>' +
    '<div class="card" style="border:2px solid var(--warning);background:var(--warning-light);margin-bottom:24px;"><h3 style="color:#92400e;margin-bottom:12px;">📢 Tangazo kwa Watoa Huduma</h3><div class="form-group"><label style="color:#92400e;">✏️ Ujumbe</label><textarea class="form-textarea" id="announcementMessage" style="background:var(--surface);" placeholder="Andika tangazo...">' + escapeHtml(ca) + '</textarea></div><div style="display:flex;gap:10px;"><button class="btn btn-primary" onclick="postAnnouncement()" style="background:var(--warning);">📢 Toa Tangazo</button><button class="btn btn-danger" onclick="clearAnnouncement()">🗑️ Futa</button></div><div id="announcementStatus" style="margin-top:10px;"></div></div>' +
    '<div class="stats-grid"><div class="stat-card"><div class="stat-icon" style="background:var(--primary-light);color:var(--primary);">👨‍⚕️</div><div><div class="stat-value">' + ud.total + '</div><div class="stat-label">Watoa Huduma</div></div></div><div class="stat-card"><div class="stat-icon" style="background:var(--success-light);color:var(--success);">👶</div><div><div class="stat-value">' + cd.total + '</div><div class="stat-label">Watoto</div></div></div><div class="stat-card"><div class="stat-icon" style="background:var(--warning-light);color:var(--warning);">💉</div><div><div class="stat-value">' + vd.total + '</div><div class="stat-label">Chanjo</div></div></div></div>' +
    '<div class="tabs"><button class="tab active" onclick="showAdminTab(\'users\',this)">👨‍⚕️ Watoa Huduma</button><button class="tab" onclick="showAdminTab(\'children\',this)">👶 Watoto</button><button class="tab" onclick="showAdminTab(\'vax\',this)">💉 Chanjo</button></div><div id="adminContent">' + renderAdminUsers() + '</div>';
}

async function postAnnouncement() {
    var m = document.getElementById('announcementMessage').value.trim();
    var sd = document.getElementById('announcementStatus');
    if (!m) { sd.innerHTML = '<p style="color:var(--danger);">⚠ Andika ujumbe.</p>'; return; }
    sd.innerHTML = '<p style="color:var(--primary);">⏳ Inatoa...</p>';
    var ok = await saveAnnouncement(m);
    if (ok) { sd.innerHTML = '<p style="color:var(--success);">✓ Tangazo limetolewa!</p>'; showToast('✓ Tangazo limetolewa!', 'success'); }
    else { sd.innerHTML = '<p style="color:var(--danger);">✗ Imeshindwa.</p>'; }
}

async function clearAnnouncement() {
    var sd = document.getElementById('announcementStatus');
    sd.innerHTML = '<p style="color:var(--primary);">⏳ Inafuta...</p>';
    try {
        if (activeAnnouncement) await databases.updateDocument(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.announcements, activeAnnouncement.$id, { isActive: false });
        var d = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.announcements, [Query.equal('isActive', true)]);
        for (var i = 0; i < d.documents.length; i++) { await databases.updateDocument(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.announcements, d.documents[i].$id, { isActive: false }); }
        hideBanner();
        document.getElementById('announcementMessage').value = '';
        sd.innerHTML = '<p style="color:var(--success);">✓ Tangazo limefutwa.</p>';
        showToast('✓ Tangazo limefutwa!', 'success');
    } catch(e) { sd.innerHTML = '<p style="color:var(--danger);">✗ Imeshindwa.</p>'; }
}

function renderAdminUsers() {
    var u = window._admin.users;
    return '<div class="card" style="padding:0;"><div class="table-container"><table><thead><tr><th>👤 Jina</th><th>📧 Email</th><th>📱 Simu</th><th>🏥 Kituo</th><th>🏷️ Role</th><th>📊 Status</th><th>⚡ Vitendo</th></tr></thead><tbody>' + u.map(function(x) { return '<tr><td><strong>' + escapeHtml(x.fullName) + '</strong> ' + (x.role === 'admin' ? '👑' : '') + '</td><td>' + x.email + '</td><td>' + (x.phone || '—') + '</td><td>' + escapeHtml(x.facility || '—') + '</td><td><span class="badge ' + (x.role === 'admin' ? 'badge-warning' : 'badge-info') + '">' + x.role + '</span></td><td><span class="badge ' + (x.status === 'active' ? 'badge-success' : 'badge-danger') + '">' + x.status + '</span></td><td>' + (x.role !== 'admin' ? '<button class="btn btn-sm ' + (x.status === 'active' ? 'btn-danger' : 'btn-success') + '" onclick="toggleUserStatus(\'' + x.userId + '\')">' + (x.status === 'active' ? '🔒 Zima' : '🔓 Wezesha') + '</button>' : '<span class="badge badge-primary">👑 Admin</span>') + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
}

function showAdminTab(type, btn) {
    document.querySelectorAll('.tabs .tab').forEach(function(t) { t.classList.remove('active'); });
    btn.classList.add('active');
    var d = window._admin;
    if (type === 'users') document.getElementById('adminContent').innerHTML = renderAdminUsers();
    else if (type === 'children') document.getElementById('adminContent').innerHTML = '<div class="card" style="padding:0;"><div class="table-container"><table><thead><tr><th>👶 Mtoto</th><th>👤 Mzazi</th><th>📱 Simu</th><th>🏥 Kituo</th></tr></thead><tbody>' + d.children.map(function(c) { return '<tr><td><strong>' + escapeHtml(c.fullName) + '</strong></td><td>' + escapeHtml(c.parentName) + '</td><td>' + c.parentPhone + '</td><td>' + escapeHtml(c.facility) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    else document.getElementById('adminContent').innerHTML = '<div class="card" style="padding:0;"><div class="table-container"><table><thead><tr><th>💉 Chanjo</th><th>📊 Dozi</th><th>📅 Tarehe</th></tr></thead><tbody>' + d.vax.map(function(v) { return '<tr><td><strong>' + v.vaccineName + '</strong></td><td>' + v.dose + '</td><td>' + formatDate(v.vaccinationDate) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
}

async function toggleUserStatus(userId) {
    var d = await databases.listDocuments(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.users, [Query.equal('userId', userId)]);
    if (d.documents.length === 0) return;
    var u = d.documents[0];
    if (u.role === 'admin') return showToast('⚠ Huwezi kumzuia admin!', 'warning');
    await databases.updateDocument(APPWRITE_CONFIG.databaseId, APPWRITE_CONFIG.collections.users, u.$id, { status: u.status === 'active' ? 'disabled' : 'active' });
    navigateTo('admin');
    showToast('✓ Status imebadilishwa!', 'success');
}

// ==================== INIT ====================
async function init() {
    initTheme();
    showLoading(true);
    try { var u = await account.get(); await loadUserAndEnter(u.$id); }
    catch(e) { document.getElementById('authContainer').classList.remove('hidden'); document.getElementById('authContainer').style.display = 'flex'; showAuthForm('login'); }
    showLoading(false);
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
