        function toggleAllCheckboxes() {
            var c = document.querySelectorAll('.bulk-check');
            for (var i = 0; i < c.length; i++) c[i].checked = true;
            updateBulkCount();
        }

        function togglePendingCheckboxes() {
            var c = document.querySelectorAll('.bulk-check');
            for (var i = 0; i < c.length; i++) {
                var parent = c[i].closest('.border');
                var badge = parent ? parent.querySelector('.bst') : null;
                c[i].checked = (badge && badge.textContent.trim() === 'pending');
            }
            updateBulkCount();
        }

        function toggleRejectedCheckboxes() {
            var c = document.querySelectorAll('.bulk-check');
            for (var i = 0; i < c.length; i++) {
                var parent = c[i].closest('.border');
                var badge = parent ? parent.querySelector('.bst') : null;
                c[i].checked = (badge && badge.textContent.trim() === 'rejected');
            }
            updateBulkCount();
        }

        function toggleNoneCheckboxes() {
            var c = document.querySelectorAll('.bulk-check');
            for (var i = 0; i < c.length; i++) c[i].checked = false;
            updateBulkCount();
        }

        function updateBulkCount() {
            var count = document.querySelectorAll('.bulk-check:checked').length;
            document.getElementById('bulkCount').textContent = count + ' selected';
        }

        async function executeBulkDelete() {
            var checked = document.querySelectorAll('.bulk-check:checked');
            if (checked.length === 0) {
                showToast('Select items first', 'warning');
                return;
            }

            var confirm = await Swal.fire({
                title: 'Delete ' + checked.length + ' logbooks?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Delete'
            });

            if (!confirm.isConfirmed) return;

            try {
                showLoading();
                var ids = [];
                for (var i = 0; i < checked.length; i++) {
                    ids.push(checked[i].dataset.id);
                }
                for (var j = 0; j < ids.length; j++) {
                    await db.deleteDocument(D, C.L, ids[j]);
                    notifiedLogIds.delete(ids[j]);
                }
                hideLoading();
                showToast(ids.length + ' deleted successfully!', 'success');
                loadPage('bulk_delete');
            } catch (e) {
                hideLoading();
                Swal.fire({ icon: 'error', text: e.message });
            }
        }

                    '<input id="rps" class="fc mb-2" placeholder="Search by name..." oninput="searchUsersForReset()">' +

            } catch (e) {
                return '<div class="cc">Error loading reset page</div>';

        function searchUsersForReset() {
            var query = document.getElementById('rps').value.trim().toLowerCase();
            var users = window._resetUsers || [];
            var container = document.getElementById('rpr');

            if (!query || query.length < 2) {
                container.innerHTML = '<p class="text-muted text-center small py-3">Type 2+ characters...</p>';
                return;
            }

            var results = users.filter(function(u) {
                return (u.fullName || '').toLowerCase().indexOf(query) > -1;
            });

            if (!results.length) {
                container.innerHTML = '<p class="text-muted text-center py-3">No users found</p>';
                return;
            }

            var html = '';
            for (var i = 0; i < Math.min(results.length, 20); i++) {
                var u = results[i];
                var init = (u.fullName || '?').charAt(0).toUpperCase();
                var roleColor = u.role === 'admin' ? 'danger' : u.role === 'supervisor' ? 'warning' : 'primary';

                html += '<div class="border rounded p-2 mb-1" style="border-radius: 10px;">' +
                    '<div class="d-flex align-items-center gap-2 mb-1">' +
                    '<div style="width: 28px; height: 28px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 0.65rem; flex-shrink: 0;">' +
                    init + '</div>' +
                    '<div style="flex: 1;"><strong style="font-size: 0.72rem;">' + u.fullName + '</strong><br>' +
                    '<small class="text-muted">' + u.email + ' • <span class="badge bg-' + roleColor + ' bst">' + u.role + '</span></small></div>' +
                    '<button class="bsc-outline btn-sm" onclick="resetUserPassword(\'' + u.$id + '\', \'' + u.fullName.replace(/'/g, "\\'") + '\')" style="font-size: 0.6rem;" type="button">' +
                    '<i class="bi bi-key"></i> Reset</button></div></div>';
            }

            container.innerHTML = html;
        }

        async function resetUserPassword(uid, userName) {
            var result = await Swal.fire({
                title: 'Recovery: ' + userName,
                html: '<div class="text-start">' +
                    '<p class="small text-muted mb-2">Set recovery password for <strong>' + userName + '</strong>:</p>' +
                    '<input id="rnp" class="fc mb-2" type="password" placeholder="Recovery Password (min 6)">' +
                    '<input id="rcp" class="fc mb-2" type="password" placeholder="Confirm Password">' +
                    '<div class="alert alert-info small py-2 mt-2">' +
                    '<strong>Tell user:</strong><br>1. Login → <strong>Forgot Password</strong><br>' +
                    '2. Enter: email + regNo + this password<br>3. Set new password</div></div>',
                showCancelButton: true,
                confirmButtonText: 'Set Recovery',
                cancelButtonText: 'Cancel',
                confirmButtonColor: '#f59e0b',
                preConfirm: function() {
                    var np = document.getElementById('rnp').value;
                    var cp = document.getElementById('rcp').value;
                    if (!np || !cp) {
                        Swal.showValidationMessage('All fields required');
                        return false;
                    }
                    if (np.length < 6) {
                        Swal.showValidationMessage('Password must be at least 6 characters');
                        return false;
                    }
                    if (np !== cp) {
                        Swal.showValidationMessage('Passwords do not match');
                        return false;
                    }
                    return np;
                }
            });

            if (!result.value) return;

            try {
                showLoading();
                await db.updateDocument(D, C.U, uid, {
                    recoveryPassword: result.value,
                    needsPasswordReset: true,
                    updatedAt: new Date().toISOString()
                });
                hideLoading();
                await Swal.fire({
                    icon: 'success',
                    title: 'Recovery Set!',
                    html: '<p>Recovery password set for <strong>' + userName + '</strong>.</p>',
                    confirmButtonColor: '#10b981'
                });
            } catch (e) {
                hideLoading();
                Swal.fire({ icon: 'error', text: 'Failed to set recovery password' });
            }
        }

        async function exportAllUsers() {
            try {
                showLoading();
                var users = await db.listDocuments(D, C.U, [Appwrite.Query.limit(500)]);
                var doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
                var y = 10;

                doc.setFontSize(7);
                for (var i = 0; i < users.documents.length; i++) {
                    var u = users.documents[i];
                    if (y > 285) {
                        doc.addPage();
                        y = 10;
                    }
                    doc.text((u.fullName || 'N/A') + ' | ' + (u.email || 'N/A') + ' | ' +
                        (u.role || 'student') + ' | ' + (u.region || 'N/A') + ' | ' +
                        (u.isActive !== false ? 'Active' : 'Inactive'), 10, y);
                    y += 4;
                }

                doc.save('Users_Report.pdf');
                hideLoading();
                showToast('Users PDF exported!', 'success');
            } catch (e) {
                hideLoading();
                Swal.fire({ icon: 'error', text: e.message });
            }
        }

        async function exportAllLogbooks() {
            try {
                showLoading();
                var logs = await db.listDocuments(D, C.L, [Appwrite.Query.limit(500)]);
                var studentIds = logs.documents.map(function(l) { return l.studentId; });
                var namesMap = await getUserNames(studentIds);

                var doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
                var y = 10;
                var allActivities = [];

                for (var i = 0; i < logs.documents.length; i++) {
                    var l = logs.documents[i];
                    var acts = (l.activities || '').split('\n');
                    for (var j = 0; j < acts.length; j++) {
                        if (acts[j].trim()) {
                            allActivities.push((namesMap[l.studentId] || l.studentId) + ' (W' + l.weekNumber + '): ' + acts[j].trim());
                        }
                    }
                }

                doc.setFontSize(7);
                for (var k = 0; k < allActivities.length; k++) {
                    if (y > 285) {
                        doc.addPage();
                        y = 10;
                    }
                    doc.text((k + 1) + '. ' + allActivities[k], 10, y, { maxWidth: 190 });
                    y += 4;
                }

                doc.save('Logbooks_Report.pdf');
                hideLoading();
                showToast('Logbooks PDF exported!', 'success');
            } catch (e) {
                hideLoading();
                Swal.fire({ icon: 'error', text: e.message });
            }
        }

                showLoading();

        function downloadFile(content, filename, mimeType) {
            var blob = new Blob([content], { type: mimeType || 'text/csv' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
