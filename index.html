async function logActivity(userId,activityType,details=''){try{const types={LOGIN:{a:'Logged In',t:'login',i:'🔑'},SUBMIT_LOGBOOK:{a:'Submitted Logbook+PT',t:'logbook',i:'📝'},DELETE_LOGBOOK:{a:'Deleted Logbook',t:'delete',i:'🗑️'},SUBMIT_SUPERVISORS:{a:'Submitted Supervisors',t:'profile',i:'👤'},EXPORT_REPORT:{a:'Exported Report',t:'export',i:'📥'},REVIEW_LOGBOOK:{a:'Reviewed Logbook',t:'review',i:'👁️'},APPROVE_LOGBOOK:{a:'Approved Logbook',t:'approval',i:'✅'},REJECT_LOGBOOK:{a:'Rejected Logbook',t:'rejection',i:'❌'},CREATE_ASSESSMENT:{a:'Created Assessment',t:'assessment',i:'⭐'},EDIT_ASSESSMENT:{a:'Updated Assessment',t:'assessment',i:'📝'},APPROVE_SUPERVISORS:{a:'Approved Supervisors',t:'admin',i:'👍'},ASSIGN_SUPERVISOR:{a:'Assigned Supervisor',t:'assignment',i:'🔗'},DELETE_USER:{a:'Deleted User',t:'delete',i:'🗑️'},BULK_DELETE:{a:'Bulk Deleted',t:'delete',i:'🗑️'},EXPORT_DATA:{a:'Exported Data',t:'export',i:'📥'},SEND_MESSAGE:{a:'Sent Message',t:'chat',i:'💬'}};const cfg=types[activityType];if(!cfg||!userId)return;await databases.createDocument(DATABASE_ID,COL.ACTIVITY,Appwrite.ID.unique(),{activityId:Appwrite.ID.unique(),userId,action:cfg.a,details,type:cfg.t,icon:cfg.i,timestamp:new Date().toISOString(),userRole:currentUser?.role||'unknown'})}catch(e){}}
async function findOrRegisterSupervisor(name,email,password,role,region){if(!name||!email||!password)return null;try{const ex=await databases.listDocuments(DATABASE_ID,COL.USERS,[Appwrite.Query.equal('email',email),Appwrite.Query.equal('role',role)]);if(ex.total>0)return ex.documents[0];try{const uid=Appwrite.ID.unique();await account.create(uid,email,password,name);const u={userId:uid,fullName:name,email,role,region:region||'',phone:'',isActive:!0,createdAt:new Date().toISOString()};await databases.createDocument(DATABASE_ID,COL.USERS,uid,u);return u}catch(e){if(e.code===409){const all=await databases.listDocuments(DATABASE_ID,COL.USERS,[Appwrite.Query.equal('email',email)]);if(all.total>0)return all.documents[0]}throw e}}catch(e){return null}}

async function rvl(lid){try{const logbook=await databases.getDocument(DATABASE_ID,COL.LOGBOOKS,lid);let ptHTML='';try{JSON.parse(logbook.ptActivities||'[]').forEach(p=>{ptHTML+=`<span class="badge bg-success me-1">✅ ${p.activityName}</span>`})}catch(e){}const r=await Swal.fire({title:`Review Week ${logbook.weekNumber}`,html:`<div class="text-start"><div class="unified-review-section"><h6>Activities</h6><pre style="font-size:.7rem;max-height:120px;overflow-y:auto">${logbook.activities||'N/A'}</pre></div><div class="unified-review-section"><h6>PT Checklist</h6>${ptHTML||'None'}</div><div class="unified-review-section"><h6>Summary</h6><p>${logbook.recommendations||'N/A'}</p></div>${logbook.studentSignature?`<p><img src="${logbook.studentSignature}" width="120"></p>`:''}<hr><label>Comment *</label><textarea id="rvc" class="form-control mb-2" rows="3"></textarea><div class="sig-wrapper"><canvas id="scv" class="sp-sm mb-1"></canvas><button type="button" class="sig-clear-btn" onclick="clearReviewSig()">🗑️</button></div></div>`,didOpen:()=>{const cv=document.getElementById('scv');if(cv)window.tsp=new SignaturePad(cv,{penColor:'#1a5276'})},showCancelButton:!0,showDenyButton:!0,confirmButtonText:'Approve',denyButtonText:'Reject',preConfirm:()=>{const cm=document.getElementById('rvc')?.value;if(!cm)return Swal.showValidationMessage('Comment required');return{comment:cm,signature:window.tsp?.toDataURL()||'',decision:'approved'}},preDeny:()=>{const cm=document.getElementById('rvc')?.value;if(!cm)return Swal.showValidationMessage('Comment required');return{comment:cm,signature:window.tsp?.toDataURL()||'',decision:'rejected'}}});if(!r)return;const rd=r.value||r;sl();const ns=rd.decision==='rejected'?'rejected':currentUser.role==='field_supervisor'?'reviewed_by_field':'approved';await databases.createDocument(DATABASE_ID,COL.REVIEWS,Appwrite.ID.unique(),{logbookId:lid,reviewerId:currentUser.userId,reviewerRole:currentUser.role,stage:currentUser.role==='field_supervisor'?'field_revi async function executeBulkDelete(){const sel=Array.from(document.querySelectorAll('.bulk-del:checked')).map(cb=>cb.value);if(!sel.length)return;const r=await Swal.fire({title:`Delete ${sel.length}?`,icon:'warning',showCancelButton:!0,confirmButtonColor:'#e74c3c'});if(!r.isConfirmed)return;sl();let d=0;for(const id of sel){try{await databases.deleteDocument(DATABASE_ID,COL.LOGBOOKS,id);d++}catch(e){}}await logActivity(currentUser.userId,'BULK_DELETE',`${d} logbooks`);hl();st(`${d} deleted!`);lp('bulk_delete')}
async function red(){return`<div class="cc"><h5>Export Data</h5><button class="bsc w-100 mb-2" onclick="exportAllCSV('logbooks')">Logbooks (CSV)</button><button class="bsc w-100 mb-2" onclick="exportAllCSV('users')">Users (CSV)</button><button class="bsc-outline w-100 mb-2" onclick="exportAllCSV('pt')">PT Checklist (CSV)</button><button class="bsc-outline w-100 mb-2" onclick="exportAllCSV('assessments')">Assessments (CSV)</button></div>`}
async function exportAllCSV(type){sl();try{let data=[],fn='export.csv';if(type==='logbooks'){const docs=await databases.listDocuments(DATABASE_ID,COL.LOGBOOKS,[Appwrite.Query.limit(500)]);data=docs.documents.map(d=>({Week:d.weekNumber,Student:d.studentId,Status:d.status}));fn='logbooks.csv'}else if(type==='users'){const docs=await databases.listDocuments(DATABASE_ID,COL.USERS,[Appwrite.Query.limit(500)]);data=docs.documents.map(d=>({Name:d.fullName,Email:d.email,Role:d.role}));fn='users.csv'}else if(type==='pt'){const docs=await databases.listDocuments(DATABASE_ID,COL.PT,[Appwrite.Query.limit(500)]);data=docs.documents.map(d=>({Activity:d.activityName,Category:d.category,Student:d.studentId}));fn='pt.csv'}else if(type==='assessments'){const docs=await databases.listDocuments(DATABASE_ID,COL.FA,[Appwrite.Query.limit(500)]);data=docs.documents.map(d=>({Student:d.studentId,Marks:d.marks}));fn='assessments.csv'}if(!data.length){hl();return st('No data','warning')}let csv=Object.keys(data[0]).join(',')+'\n';data.forEach(r=>{csv+=Object.values(r).map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')+'\n'});const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click();hl();await logActivity(currentUser.userId,'EXPORT_DATA',`${type} - ${data.length} records`);st(`${data.length} exported!`)}catch(e){hl();se(e)}}
async function ral2(){try{const logs=await databases.listDocuments(DATABASE_ID,COL.ACTIVITY,[Appwrite.Query.equal('userId',currentUser.userId),Appwrite.Query.orderDesc('timestamp'),Appwrite.Query.limit(50)]);if(!logs.total)return'<div class="cc text-center"><h5>My Activity</h5><p>No activities</p></div>';let h=`<div class="cc"><h5>My Activity</h5>`;const g={};logs.documents.forEach(log=>{const d=new Date(log.timestamp).toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});if(!g[d])g[d]=[];g[d].push(log)});Object.entries(g).forEach(([date,acts])=>{h+=`<h6 class="text-primary mt-2">📅 ${date}</h6>`;acts.forEach(a=>{h+=`<div class="border rounded p-2 mb-1 small"><span>${a.icon||'📌'}</span> <strong>${a.action}</strong><br><small>${a.details||''}</small><br><small class="text-muted">${new Date(a.timestamp).toLocaleTimeString()}</small></div>`})});return h+'</div>'}catch(e){return'<div class="cc">Error</div>'}}
function rs(){return`<div class="cc"><h5>Search</h5><div class="search-box"><i class="bi bi-search"></i><input id="searchInput" class="fc" placeholder="Search..." onkeyup="if(event.key==='Enter')performSearch()"></div><button class="bsc btn-sm mb-2" onclick="performSearch()">Search</button><div id="searchResults"></div></div>`}
async function performSearch(){const q=document.getElementById('searchInput')?.value?.trim()?.toLowerCase();if(!q||q.length<2)return st('Enter 2+ chars','warning');sl();let results=[];try{const logs=await databases.listDocuments(DATABASE_ID,COL.LOGBOOKS,[Appwrite.Query.limit(200)]);logs.documents.forEach(l=>{if((l.activities||'').toLowerCase().includes(q)||(l.recommendations||'').toLowerCase().includes(q))results.push({t:'Logbook',d:`Week ${l.weekNumber}`,s:l.studentId})});hl();document.getElementById('searchResults').innerHTML=results.length===0?'<p>No results</p>':results.slice(0,20).map(r=>`<div class="border rounded p-2 mb-1"><strong>${r.t}:</strong> ${r.d}<br><small>${r.s}</small></div>`).join('')}catch(e){hl();se(e)}}
async function rvs(){try{const users=await databases.listDocuments(DATABASE_ID,COL.USERS);const sups=users.documents.filter(u=>u.role==='field_supervisor'||u.role==='university_supervisor');if(!sups.length)return'<div class="cc"><h5>No supervisors</h5></div>';let h=`<div class="cc"><h5>Supervisors (${sups.length})</h5><table class="table table-sm">`;sups.forEach(s=>{h+=`<tr><td>${s.fullName}</td><td>${s.role}</td><td>${s.region||'-'}</td><td><button class="bsc btn-sm" onclick="openChatWith('${s.userId}','${s.fullName}')">Chat</button></td></tr>`});return h+'</table></div>'}catch(e){return'<div class="cc">Error</div>'}}

// ====== DOM EVENTS - Instant response buttons ======
document.addEventListener('DOMContentLoaded',()=>{AOS.init({duration:600,once:!0});populateRegions();document.getElementById('lb').addEventListener('click',function(){this.disabled=!0;login().finally(()=>{this.disabled=!1})});document.getElementById('rb').addEventListener('click',function(){this.disabled=!0;reg().finally(()=>{this.disabled=!1})});document.getElementById('srl').addEventListener('click',()=>{clearAllForms();document.getElementById('lf').style.display='none';document.getElementById('rf').style.display='block';populateRegions()});document.getElementById('btl').addEventListener('click',()=>{clearAllForms();document.getElementById('rf').style.display='none';document.getElementById('lf').style.display='block'});document.getElementById('menuLogout').addEventListener('click',logout);document.getElementById('hamburgerBtn').addEventListener('click',toggleSideMenu);document.getElementById('sideMenuOverlay').addEventListener('click',closeSideMenu);document.getElementById('menuDarkMode').addEventListener('click',()=>{document.body.classList.toggle('dark-mode');closeSideMenu()});document.getElementById('menuContact').addEventListener('click',showContact);document.getElementById('menuOpenChat').addEventListener('click',()=>{closeSideMenu();document.getElementById('chatPopup').classList.add('show');loadChatUsers()});document.getElementById('chatCloseBtn').addEventListener('click',()=>document.getElementById('chatPopup').classList.remove('show'));document.getElementById('cancelReply').addEventListener('click',cancelReplyFn);document.getElementById('chatSendBtn').addEventListener('click',sendChat);document.getElementById('chatInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendChat()});document.querySelectorAll('.side-menu-item[data-action]').forEach(item=>{item.addEventListener('click',function(){lp(this.dataset.action)})});document.addEventListener('click',e=>{const p=document.getElementById('notifPopup'),b=document.getElementById('notifBell');if(p&&b&&!p.contains(e.target)&&!b.contains(e.target))p.classList.remove('show')});cs()});
window.lp=lp;window.clb=clb;window.rvl=rvl;window.vl=vl;window.ep=ep;window.caa=caa;window.deleteLogbook=deleteLogbook;window.toggleNotifPopup=toggleNotifPopup;window.openChatWith=openChatWith;window.lcm=lcm;window.sendChat=sendChat;window.cancelReplyFn=cancelReplyFn;window.clearStudentSig=clearStudentSig;window.clearReviewSig=clearReviewSig;window.clearFASig=clearFASig;window.createFA=createFA;window.editFA=editFA;window.editMyProfile=editMyProfile;window.approveSupervisors=approveSupervisors;window.performSearch=performSearch;window.executeBulkDelete=executeBulkDelete;window.updateBulkCount=updateBulkCount;window.exportAllCSV=exportAllCSV;window.exportComprehensivePDF=exportComprehensivePDF;window.updateDistricts=updateDistricts;window.populateRegions=populateRegions;window.rfa=rfa;window.rprofile=rprofile;window.rs=rs;window.rbd=rbd;window.red=red;window.rcr=rcr;window.raction=raction;
</script></body></html>
