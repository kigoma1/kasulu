<!DOCTYPE html>
<html lang="sw" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <title>VACCINATION SYSTEM</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    <style>
        :root {
            --p: #1e40af; --pl: #dbeafe; --s: #059669; --sl: #d1fae5;
            --w: #d97706; --wl: #fef3c7; --d: #dc2626; --dl: #fee2e2;
            --bg: #f8fafc; --sf: #fff; --tx: #1e293b; --ts: #64748b;
            --br: #e2e8f0; --r: 10px; --f: system-ui, sans-serif;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --sf: #1e293b; --tx: #f1f5f9; --ts: #94a3b8; --br: #334155;
            --pl: #1e3a5f; --sl: #064e3b; --wl: #78350f; --dl: #7f1d1d;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--f);background:var(--bg);color:var(--tx);line-height:1.5;min-height:100vh}

        .top-bar{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--sf)}
        
        /* BANNER - MANENO YANATEMBEA KULIA KWENDA KUSHOTO */
        .banner{background:var(--wl);height:40px;display:none;align-items:center;border-bottom:2px solid var(--w);overflow:hidden}
        .banner.on{display:flex}
        .banner-inner{color:#92400e;padding:0 14px;font-weight:600;font-size:.85rem;display:flex;align-items:center;width:100%}
        .banner-icon{flex-shrink:0;margin-right:8px}
        .banner-scroll-wrap{flex:1;overflow:hidden;position:relative;height:100%;display:flex;align-items:center}
        .banner-scroll-text{white-space:nowrap;display:inline-block;animation:marquee 18s linear infinite;padding-left:100%}
        @keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
        .banner-scroll-text:hover{animation-play-state:paused}
        .banner-close{flex-shrink:0;margin-left:8px;cursor:pointer;border:none;background:none;font-weight:700;font-size:1rem;color:#92400e;padding:2px 6px}

        .hdr{background:var(--sf);border-bottom:1px solid var(--br);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between}
        .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;color:var(--p)}
        .logo i{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#1e40af,#3b82f6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem}
        .nav-bar{background:var(--sf);border-bottom:1px solid var(--br);padding:4px 20px}
        .nav{display:flex;gap:4px;flex-wrap:wrap}
        .nav a{padding:7px 14px;border-radius:20px;text-decoration:none;color:var(--ts);font-weight:600;font-size:.82rem;cursor:pointer;border:2px solid transparent;transition:.2s}
        .nav a:hover,.nav a.active{background:var(--pl);color:var(--p);border-color:var(--p)}
        .main{margin-top:96px;min-height:calc(100vh - 96px)}
        .main.banner-on{margin-top:136px}

        .btn{padding:10px 20px;border:none;border-radius:8px;font-weight:600;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s}
        .btn:active{transform:scale(.97)}
        .btn-p{background:var(--p);color:#fff}
        .btn-s{background:var(--sf);color:var(--tx);border:2px solid var(--br)}
        .btn-d{background:var(--d);color:#fff}
        .btn-g{background:var(--s);color:#fff}
        .btn-sm{padding:5px 12px;font-size:.78rem;border-radius:16px}

        .card{background:var(--sf);border-radius:var(--r);padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--br);margin-bottom:18px}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
        .stat{background:var(--sf);border-radius:var(--r);padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--br);display:flex;align-items:center;gap:14px;cursor:pointer;transition:.2s}
        .stat:hover{transform:translateY(-2px);border-color:var(--p)}
        .stat i{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
        .stat b{font-size:1.8rem;font-weight:800;display:block;line-height:1}
        .stat span{font-size:.78rem;color:var(--ts)}

        .tbl{overflow-x:auto;border-radius:var(--r);border:1px solid var(--br)}
        table{width:100%;border-collapse:collapse}
        th{background:var(--bg);padding:12px 14px;text-align:left;font-weight:700;font-size:.75rem;color:var(--ts);text-transform:uppercase;border-bottom:2px solid var(--br)}
        td{padding:10px 14px;border-bottom:1px solid var(--br);font-size:.85rem}
        tr:hover{background:var(--bg)}
        .badge{padding:4px 10px;border-radius:16px;font-size:.7rem;font-weight:600}
        .bg-s{background:var(--sl);color:#065f46}.bg-d{background:var(--dl);color:#991b1b}
        .bg-w{background:var(--wl);color:#92400e}.bg-p{background:var(--pl);color:var(--p)}

        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(3px)}
        .modal{background:var(--sf);border-radius:16px;padding:26px;max-width:540px;width:94%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.2);animation:pop .25s ease}
        @keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
        .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--br)}
        .modal-head h3{font-size:1.2rem;font-weight:700}
        .close-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--br);background:var(--sf);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
        .close-btn:hover{background:var(--d);color:#fff;border-color:var(--d)}

        .tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:var(--r);margin-bottom:18px;border:1px solid var(--br)}
        .tab{padding:9px 18px;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:.85rem;background:none;color:var(--ts)}
        .tab.active{background:var(--sf);color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.06)}

        .inp{width:100%;padding:11px 14px;border:2px solid var(--br);border-radius:8px;font-size:.9rem;background:var(--bg);color:var(--tx);font-family:var(--f)}
        .inp:focus{outline:none;border-color:var(--p)}
        .frm-group{margin-bottom:12px}
        .frm-group label{display:block;margin-bottom:4px;font-weight:600;font-size:.8rem;color:var(--ts)}
        .search-box{display:flex;gap:8px;margin-bottom:14px}
        .search-box .inp{flex:1;border-radius:20px}
        .welcome{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:var(--r);padding:22px 26px;margin-bottom:22px}
        .welcome h2{font-size:1.3rem}
        .page-title{font-size:1.3rem;font-weight:700;margin-bottom:18px}
        .page-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
        .empty{text-align:center;padding:36px 20px;color:var(--ts)}
        .empty-icon{font-size:3rem;margin-bottom:10px}
        .err-box{background:var(--dl);color:#991b1b;padding:12px 16px;border-radius:8px;margin-bottom:16px;border:1px solid var(--d);font-size:.85rem}
        .ok-box{background:var(--sl);color:#065f46;padding:12px 16px;border-radius:8px;margin-bottom:16px;border:1px solid var(--s);font-size:.85rem}

        .toast-ctr{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:380px}
        .toast{padding:12px 16px;border-radius:10px;display:flex;align-items:center;gap:8px;animation:slideIn .35s ease;font-weight:500;font-size:.85rem;background:var(--sf);box-shadow:0 8px 24px rgba(0,0,0,.12);border:1px solid var(--br)}
        .toast.s{border-left:3px solid var(--s)}.toast.e{border-left:3px solid var(--d)}
        .toast.w{border-left:3px solid var(--w)}.toast.i{border-left:3px solid var(--p)}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        .load{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
        .load.hide{display:none}
        .spinner{width:40px;height:40px;border:3px solid var(--br);border-top-color:var(--p);border-radius:50%;animation:spin .6s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .hidden{display:none!important}

        .theme-btn{width:42px;height:24px;border-radius:20px;background:var(--br);border:none;cursor:pointer;position:relative}
        .theme-dot{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--sf);transition:.2s;display:flex;align-items:center;justify-content:center;font-size:.65rem}
        [data-theme="dark"] .theme-btn{background:var(--p)}
        [data-theme="dark"] .theme-dot{left:20px}
        .text-s{font-size:.85rem;color:var(--ts)}

        @media(max-width:768px){.stats{grid-template-columns:1fr 1fr}.stat{padding:14px}.stat b{font-size:1.4rem}.hdr{padding:0 12px;height:50px}.nav-bar{padding:4px 12px}.nav a{padding:6px 10px;font-size:.75rem}.main{margin-top:86px}.main.banner-on{margin-top:126px}.banner{height:36px}}
        @media(max-width:480px){.stats{grid-template-columns:1fr}}
    </style>
</head>
<body>

<div class="load" id="loadScreen"><div class="spinner"></div></div>
<div class="toast-ctr" id="toastContainer"></div>

<!-- APP -->
<div id="app" style="display:none">
    <div class="top-bar">
        <!-- BANNER - MANENO PEKEE YANATEMBEA KULIA KWENDA KUSHOTO -->
        <div class="banner" id="banner">
            <div class="banner-inner">
                <span class="banner-icon">📢</span>
                <div class="banner-scroll-wrap">
                    <span class="banner-scroll-text" id="bannerText">Hakuna matangazo kwa sasa.</span>
                </div>
                <button class="banner-close" onclick="dismissBanner()">×</button>
            </div>
        </div>
        <header class="hdr">
            <div class="logo"><i>💉</i>VACCINATION SYSTEM</div>
            <div style="display:flex;align-items:center;gap:10px">
                <button class="theme-btn" onclick="toggleTheme()"><span class="theme-dot" id="themeDot">☀️</span></button>
                <span id="userName" style="font-weight:600;font-size:.85rem"></span>
                <button class="btn btn-s btn-sm" onclick="logout()">🚪 Toka</button>
            </div>
        </header>
        <div class="nav-bar"><nav class="nav" id="mainNav"></nav></div>
    </div>
    <div class="main" id="mainContent"><div style="padding:20px;max-width:1400px;margin:0 auto" id="pageContent"></div></div>
</div>

<!-- AUTH -->
<div id="auth" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)">
    <div class="card" style="max-width:440px;width:100%;padding:32px 24px">
        <div id="statusMsg"></div>
        <div id="loginFrm">
            <div style="text-align:center;margin-bottom:24px"><div style="width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,#1e40af,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 12px;color:#fff">💉</div><h2 style="color:var(--tx)">VACCINATION SYSTEM</h2></div>
            <div class="frm-group"><label>📧 Email</label><input type="email" class="inp" id="lemail" placeholder="example@email.com"></div>
            <div class="frm-group"><label>🔐 Nywila</label><input type="password" class="inp" id="lpass" placeholder="••••••••"></div>
            <button class="btn btn-p" style="width:100%;padding:13px" onclick="login()">🚀 Ingia</button>
            <div style="text-align:center;margin-top:16px"><span class="text-s">Huna akaunti? <a href="#" onclick="showAuth('reg')" style="color:var(--p);font-weight:700">✨ Sajili hapa</a></span></div>
        </div>
        <div id="regFrm" style="display:none">
            <div style="text-align:center;margin-bottom:20px"><h2 style="color:var(--p)">✨ Sajili Akaunti</h2></div>
            <div class="frm-group"><label>👤 Jina Kamili *</label><input type="text" class="inp" id="rname" placeholder="Jina lako kamili"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="frm-group"><label>⚧ Jinsia *</label><select class="inp" id="rgen"><option value="">Chagua</option><option>Me</option><option>Ke</option></select></div><div class="frm-group"><label>📱 Simu *</label><input type="tel" class="inp" id="rphone" placeholder="07XXXXXXXX"></div></div>
            <div class="frm-group"><label>📧 Email *</label><input type="email" class="inp" id="remail" placeholder="example@email.com"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="frm-group"><label>📍 Mkoa *</label><input type="text" class="inp" id="rregion" placeholder="Mkoa"></div><div class="frm-group"><label>📍 Wilaya *</label><input type="text" class="inp" id="rdist" placeholder="Wilaya"></div></div>
            <div class="frm-group"><label>🏥 Kituo cha Afya *</label><input type="text" class="inp" id="rfac" placeholder="Jina la kituo"></div>
            <div class="frm-group"><label>🔐 Nywila * (8+ herufi)</label><input type="password" class="inp" id="rpass" placeholder="••••••••"></div>
            <button class="btn btn-p" style="width:100%;padding:13px" onclick="register()">✨ Sajili</button>
            <div style="text-align:center;margin-top:16px"><span class="text-s">Tayari una akaunti? <a href="#" onclick="showAuth('login')" style="color:var(--p);font-weight:700">🚀 Ingia</a></span></div>
        </div>
    </div>
</div>

<script>
const C={endpoint:'https://fra.cloud.appwrite.io/v1',projectId:'6a21b1440038c361fabb',databaseId:'6a21b1f8000e608360bb',collections:{users:'users',children:'children',vaccinations:'vaccinations',systemSettings:'system_settings',announcements:'announcements'}};
const {Client,Account,Databases,ID,Query}=Appwrite;
const client=new Client().setEndpoint(C.endpoint).setProject(C.projectId);
const account=new Account(client),db=new Databases(client);
let U=null,isA=false,ann=null;
const VAX=['BCG','OPV','Pentavalent','PCV','Rotavirus','IPV','Measles','Rubella','Vitamin A'];

function toggleTheme(){const h=document.documentElement,t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);document.getElementById('themeDot').textContent=t==='dark'?'🌙':'☀️'}
function initTheme(){const t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.getElementById('themeDot').textContent=t==='dark'?'🌙':'☀️'}

async function loadAnn(){try{const d=await db.listDocuments(C.databaseId,C.collections.announcements,[Query.equal('isActive',true),Query.orderDesc('$createdAt'),Query.limit(1)]);if(d.documents.length>0){ann=d.documents[0];showBanner(ann.message)}else{hideBanner()}}catch(e){hideBanner()}}
function showBanner(m){const b=document.getElementById('banner'),t=document.getElementById('bannerText'),mc=document.getElementById('mainContent');if(b&&t&&m){t.textContent=m;b.classList.add('on');if(mc)mc.classList.add('banner-on')}}
function hideBanner(){const b=document.getElementById('banner'),mc=document.getElementById('mainContent');if(b)b.classList.remove('on');if(mc)mc.classList.remove('banner-on');ann=null}
function dismissBanner(){hideBanner()}
async function saveAnn(msg){try{try{const d=await db.listDocuments(C.databaseId,C.collections.announcements,[Query.equal('isActive',true)]);for(const x of d.documents)await db.updateDocument(C.databaseId,C.collections.announcements,x.$id,{isActive:false})}catch(e){}const n=await db.createDocument(C.databaseId,C.collections.announcements,ID.unique(),{announcementId:ID.unique(),message:msg,isActive:true,createdBy:U.userId,createdAt:new Date().toISOString()});ann=n;showBanner(msg);return true}catch(e){return false}}

function toast(msg,type){type=type||'i';const icons={s:'✓',e:'✗',w:'⚠',i:'ℹ'};const c=document.getElementById('toastContainer'),t=document.createElement('div');t.className='toast '+type;t.innerHTML='<span>'+icons[type]+'</span>'+esc(msg);c.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(100%)';t.style.transition='.3s';setTimeout(()=>t.remove(),300)},4000)}
function load(s){document.getElementById('loadScreen').classList.toggle('hide',!s)}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('sw-TZ',{year:'numeric',month:'short',day:'numeric'})}
function daysLeft(d){if(!d)return null;return Math.ceil((new Date(d)-new Date())/(1000*60*60*24))}
function setStatus(msg,type){type=type||'e';const d=document.getElementById('statusMsg');if(msg)d.innerHTML='<div class="'+(type==='e'?'err-box':'ok-box')+'">'+msg+'</div>';else d.innerHTML=''}
function showAuth(f){document.getElementById('loginFrm').style.display=f==='login'?'block':'none';document.getElementById('regFrm').style.display=f==='reg'?'block':'none';setStatus('');if(f==='login')document.getElementById('lpass').value='';if(f==='reg'){['rname','rgen','rphone','remail','rregion','rdist','rfac','rpass'].forEach(id=>document.getElementById(id).value='')}}

async function register(){const fn=document.getElementById('rname').value.trim(),g=document.getElementById('rgen').value,ph=document.getElementById('rphone').value.trim(),em=document.getElementById('remail').value.trim(),r=document.getElementById('rregion').value.trim(),d=document.getElementById('rdist').value.trim(),f=document.getElementById('rfac').value.trim(),pw=document.getElementById('rpass').value;if(!fn||!em||!pw||!ph||!r||!d||!f||!g){setStatus('⚠ Jaza taarifa zote zenye *','e');return}if(pw.length<8){setStatus('⚠ Nywila iwe na angalau herufi 8','e');return}setStatus('⏳ Inasajili...','s');load(true);try{const ua=await account.create(ID.unique(),em,pw,fn);await db.createDocument(C.databaseId,C.collections.users,ID.unique(),{userId:ua.$id,fullName:fn,gender:g,phone:ph,email:em,region:r,district:d,facility:f,role:'health_worker',status:'active',createdAt:new Date().toISOString()});await account.createEmailSession(em,pw);['rname','rgen','rphone','remail','rregion','rdist','rfac','rpass'].forEach(id=>document.getElementById(id).value='');await enter(ua.$id);load(false);setStatus('');toast('✓ Akaunti imesajiliwa!','s')}catch(e){load(false);setStatus(e.message.includes('already exists')?'⚠ Email hii tayari imesajiliwa!':'✗ Imeshindwa','e')}}
async function login(){const em=document.getElementById('lemail').value.trim(),pw=document.getElementById('lpass').value;if(!em||!pw){setStatus('⚠ Jaza email na nywila','e');return}setStatus('⏳ Inakuingiza...','s');load(true);try{await account.createEmailSession(em,pw);const ua=await account.get();await enter(ua.$id);load(false);setStatus('');toast('✓ Umefanikiwa kuingia!','s')}catch(e){load(false);setStatus(e.message.includes('Invalid credentials')?'✗ Email au Nywila si sahihi!':'✗ Imeshindwa','e')}}
async function enter(userId){let role='health_worker',userDoc;try{const ua=await account.get();try{const ud=await db.listDocuments(C.databaseId,C.collections.users,[Query.equal('userId',userId)]);if(ud.documents.length>0){userDoc=ud.documents[0];role=userDoc.role||'health_worker'}}catch(e){}if(!userDoc){userDoc=await db.createDocument(C.databaseId,C.collections.users,ID.unique(),{userId,fullName:ua.name||'',email:ua.email||'',phone:'',gender:'',region:'',district:'',facility:'',role:'health_worker',status:'active',createdAt:new Date().toISOString()})}}catch(e){return}U=userDoc;isA=(role==='admin');document.getElementById('userName').textContent=U.fullName||U.email||'Mtoa Huduma';document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';buildNav();await loadAnn();if(isA)navigateTo('admin');else navigateTo('dashboard')}
function buildNav(){const n=document.getElementById('mainNav');if(isA){n.innerHTML='<a class="nav-link active" data-page="admin">🛡️ Admin Panel</a>'}else{n.innerHTML='<a class="nav-link active" data-page="dashboard">📊 Dashboard</a><a class="nav-link" data-page="children">👶 Watoto</a><a class="nav-link" data-page="vaccinations">💉 Chanjo</a><a class="nav-link" data-page="schedule">📅 Ratiba</a><a class="nav-link" data-page="reports">📈 Ripoti</a>'}document.querySelectorAll('.nav-link').forEach(l=>{l.onclick=function(e){e.preventDefault();navigateTo(this.dataset.page)}})}
async function logout(){try{await account.deleteSession('current')}catch(e){}U=null;isA=false;document.getElementById('app').style.display='none';document.getElementById('auth').style.display='flex';hideBanner();document.getElementById('lemail').value='';document.getElementById('lpass').value='';setStatus('');showAuth('login');toast('🚪 Umetoka kwenye mfumo.','i')}
function navigateTo(page){document.querySelectorAll('.nav-link').forEach(l=>l.classList.toggle('active',l.dataset.page===page));loadPage(page)}
async function loadPage(page){const c=document.getElementById('pageContent');load(true);try{if(page==='dashboard')c.innerHTML=await renderDashboard();else if(page==='children')c.innerHTML=await renderChildren();else if(page==='vaccinations')c.innerHTML=await renderVax();else if(page==='schedule')c.innerHTML=await renderSchedule();else if(page==='reports')c.innerHTML=await renderReports();else if(page==='admin')c.innerHTML=await renderAdmin()}catch(e){c.innerHTML='<div class="card empty"><div class="empty-icon">✗</div><h3>Imeshindwa</h3><p>'+esc(e.message)+'</p></div>'}load(false)}

async function renderDashboard(){const cd=await db.listDocuments(C.databaseId,C.collections.children,[Query.equal('createdBy',U.userId)]),cids=cd.documents.map(c=>c.childId);let av=[];for(const ci of cids){const v=await db.listDocuments(C.databaseId,C.collections.vaccinations,[Query.equal('childId',ci),Query.orderDesc('vaccinationDate')]);av=av.concat(v.documents)}const today=new Date().toISOString().split('T')[0],tv=av.filter(v=>v.vaccinationDate===today),up=av.filter(v=>v.nextVaccinationDate&&v.nextVaccinationDate>today),od=av.filter(v=>v.nextVaccinationDate&&v.nextVaccinationDate<today);window._d={children:cd.documents,allVax:av};let h='<div class="welcome"><h2>👋 Karibu, '+esc(U.fullName||U.email)+'!</h2><p style="opacity:.9;font-size:.9rem">🏥 '+esc(U.facility||'Kituo chako')+'</p></div>';h+='<div class="card" style="border:2px solid var(--p);background:var(--pl)"><h3 style="color:var(--p);margin-bottom:10px">⚡ Rekodi Chanjo kwa Haraka</h3><div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px"><select class="inp" id="qc"><option value="">— Chagua Mtoto —</option>'+cd.documents.map(c=>'<option value="'+c.childId+'">'+esc(c.fullName)+'</option>').join('')+'</select><select class="inp" id="qv"><option value="">— Chagua Chanjo —</option>'+VAX.map(v=>'<option>'+v+'</option>').join('')+'</select><input type="date" class="inp" id="qd" value="'+today+'"><button class="btn btn-p" onclick="quickVax()">⚡ Rekodi</button></div><div id="qr" style="margin-top:8px"></div></div>';h+='<div class="stats"><div class="stat" onclick="navigateTo(\'children\')"><i style="background:var(--pl);color:var(--p)">👶</i><div><b>'+cd.total+'</b><span>Watoto</span></div></div><div class="stat" onclick="navigateTo(\'vaccinations\')"><i style="background:var(--sl);color:var(--s)">💉</i><div><b>'+av.length+'</b><span>Chanjo</span></div></div><div class="stat"><i style="background:var(--wl);color:var(--w)">📅</i><div><b>'+tv.length+'</b><span>Leo</span></div></div><div class="stat" onclick="navigateTo(\'schedule\')"><i style="background:var(--dl);color:var(--d)">⚠</i><div><b>'+od.length+'</b><span>Zimechelewa</span></div></div></div>';if(tv.length){h+='<div class="card" style="border-left:3px solid var(--s)"><h3 style="color:var(--s)">✓ Chanjo za Leo ('+tv.length+')</h3><div class="tbl"><table><thead><tr><th>👶 Mtoto</th><th>💉 Chanjo</th><th>📊 Dozi</th></tr></thead><tbody>'+tv.map(v=>{const c=cd.documents.find(x=>x.childId===v.childId);return'<tr><td><strong>'+esc(c?.fullName||'?')+'</strong></td><td><span class="badge bg-s">'+v.vaccineName+'</span></td><td>'+v.dose+'</td></tr>'}).join('')+'</tbody></table></div></div>'}if(od.length){h+='<div class="card" style="border-left:3px solid var(--d)"><h3 style="color:var(--d)">⚠ Zilizochelewa ('+od.length+')</h3><div class="tbl"><table><thead><tr><th>👶 Mtoto</th><th>💉 Chanjo</th><th>📅 Ilitakiwa</th><th>⏰ Siku</th></tr></thead><tbody>'+od.slice(0,5).map(v=>{const c=cd.documents.find(x=>x.childId===v.childId),days=Math.abs(daysLeft(v.nextVaccinationDate));return'<tr><td><strong>'+esc(c?.fullName||'?')+'</strong></td><td>'+v.vaccineName+' D'+v.dose+'</td><td>'+fmtDate(v.nextVaccinationDate)+'</td><td><span class="badge bg-d">'+days+'siku</span></td></tr>'}).join('')+'</tbody></table></div></div>'}h+='<div class="card"><h3>📅 Chanjo Zinazofuata</h3><div class="tbl"><table><thead><tr><th>👶 Mtoto</th><th>💉 Chanjo</th><th>📅 Tarehe</th><th>⏰ Siku</th></tr></thead><tbody>';up.sort((a,b)=>(a.nextVaccinationDate||'').localeCompare(b.nextVaccinationDate||''));const su=up.slice(0,10);if(su.length){su.forEach(v=>{const c=cd.documents.find(x=>x.childId===v.childId),days=daysLeft(v.nextVaccinationDate);h+='<tr><td><strong>'+esc(c?.fullName||'?')+'</strong></td><td>'+v.vaccineName+' D'+v.dose+'</td><td>'+fmtDate(v.nextVaccinationDate)+'</td><td><span class="badge '+(days<7?'bg-w':'bg-p')+'">'+days+'siku</span></td></tr>'})}else{h+='<tr><td colspan="4"><div class="empty"><div class="empty-icon">✓</div><p>Hakuna chanjo zinazofuata</p></div></td></tr>'}h+='</tbody></table></div></div><div id="modalCtn"></div>';return h}
async function quickVax(){const ci=document.getElementById('qc').value,vn=document.getElementById('qv').value,dt=document.getElementById('qd').value,rd=document.getElementById('qr');if(!ci||!vn||!dt){rd.innerHTML='<span style="color:var(--d)">⚠ Chagua zote</span>';return}rd.innerHTML='<span style="color:var(--p)">⏳...</span>';try{const n=new Date(dt),iv={BCG:0,OPV:28,Pentavalent:28,PCV:28,Rotavirus:28,IPV:28,Measles:0,Rubella:0,'Vitamin A':180};n.setDate(n.getDate()+(iv[vn]||28));const nd=iv[vn]===0?'':n.toISOString().split('T')[0];await db.createDocument(C.databaseId,C.collections.vaccinations,ID.unique(),{vaccinationId:ID.unique(),childId:ci,vaccineName:vn,dose:1,vaccinationDate:dt,nextVaccinationDate:nd,providerId:U.userId,notes:'',createdAt:new Date().toISOString()});rd.innerHTML='<span style="color:var(--s)">✓ Imerekodiwa!</span>';setTimeout(()=>navigateTo('dashboard'),800);toast('💉 Chanjo imerekodiwa!','s')}catch(e){rd.innerHTML='<span style="color:var(--d)">✗ '+esc(e.message)+'</span>'}}
async function renderChildren(){const d=await db.listDocuments(C.databaseId,C.collections.children,[Query.equal('createdBy',U.userId),Query.orderDesc('$createdAt')]);window._ch=d.documents;let h='<div class="page-head"><h2 class="page-title">👶 Watoto ('+d.total+')</h2><button class="btn btn-p" onclick="openChildModal()">+ Sajili Mtoto</button></div><div class="search-box"><input type="text" class="inp" id="chSearch" placeholder="🔍 Tafuta..." oninput="filterCh()"></div><div class="tbl card" style="padding:0"><table><thead><tr><th>👶 Jina</th><th>⚧ Jinsia</th><th>👤 Mzazi</th><th>📱 Simu</th><th>🏥 Kituo</th><th>⚡ Vitendo</th></tr></thead><tbody id="chTbody">';if(d.documents.length){d.documents.forEach(c=>{h+='<tr><td><strong>'+esc(c.fullName)+'</strong></td><td>'+(c.gender==='Me'?'👦 Me':'👧 Ke')+'</td><td>'+esc(c.parentName)+'</td><td>'+esc(c.parentPhone)+'</td><td>'+esc(c.facility)+'</td><td><button class="btn btn-p btn-sm" onclick="vaccinateChild(\''+c.childId+'\')">💉 Chanjo</button></td></tr>'})}else{h+='<tr><td colspan="6"><div class="empty"><div class="empty-icon">📭</div><h3>Hakuna Watoto</h3></div></td></tr>'}h+='</tbody></table></div><div id="modalCtn"></div>';return h}
async function filterCh(){const s=(document.getElementById('chSearch')?.value||'').toLowerCase(),f=window._ch.filter(c=>c.fullName.toLowerCase().includes(s)||c.parentPhone.includes(s));let h='';if(f.length){f.forEach(c=>{h+='<tr><td><strong>'+esc(c.fullName)+'</strong></td><td>'+(c.gender==='Me'?'👦 Me':'👧 Ke')+'</td><td>'+esc(c.parentName)+'</td><td>'+esc(c.parentPhone)+'</td><td>'+esc(c.facility)+'</td><td><button class="btn btn-p btn-sm" onclick="vaccinateChild(\''+c.childId+'\')">💉 Chanjo</button></td></tr>'})}else{h+='<tr><td colspan="6"><div class="empty"><h3>🔍 Hakuna matokeo</h3></div></td></tr>'}document.getElementById('chTbody').innerHTML=h}
function openChildModal(){document.getElementById('modalCtn').innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>+ Sajili Mtoto</h3><button class="close-btn" onclick="closeModal()">×</button></div><div class="frm-group"><label>👶 Jina Kamili *</label><input type="text" class="inp" id="cfn" placeholder="Jina la mtoto"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="frm-group"><label>📅 Tarehe ya Kuzaliwa *</label><input type="date" class="inp" id="cdob"></div><div class="frm-group"><label>⚧ Jinsia *</label><select class="inp" id="cgen"><option>Me</option><option>Ke</option></select></div></div><div class="frm-group"><label>👤 Mzazi/Mlezi *</label><input type="text" class="inp" id="cpn" placeholder="Jina la mzazi"></div><div class="frm-group"><label>📱 Simu *</label><input type="tel" class="inp" id="cph" placeholder="07XXXXXXXX"></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div class="frm-group"><label>📍 Mkoa</label><input type="text" class="inp" id="creg" value="'+esc(U.region||'')+'"></div><div class="frm-group"><label>📍 Wilaya</label><input type="text" class="inp" id="cdis" value="'+esc(U.district||'')+'"></div><div class="frm-group"><label>🏥 Kituo</label><input type="text" class="inp" id="cfac" value="'+esc(U.facility||'')+'"></div></div><button class="btn btn-p" style="width:100%;padding:12px" onclick="saveChild()">💾 Hifadhi</button></div></div>'}
function closeModal(){document.getElementById('modalCtn').innerHTML=''}
async function saveChild(){const fn=document.getElementById('cfn').value.trim(),dob=document.getElementById('cdob').value,gen=document.getElementById('cgen').value,pn=document.getElementById('cpn').value.trim(),ph=document.getElementById('cph').value.trim();if(!fn||!dob||!pn||!ph)return toast('⚠ Jaza taarifa zenye *','w');try{await db.createDocument(C.databaseId,C.collections.children,ID.unique(),{childId:ID.unique(),fullName:fn,gender:gen,birthDate:dob,parentName:pn,parentPhone:ph,region:document.getElementById('creg').value.trim(),district:document.getElementById('cdis').value.trim(),facility:document.getElementById('cfac').value.trim(),address:'',notes:'',createdBy:U.userId,createdAt:new Date().toISOString()});closeModal();navigateTo('children');toast('✓ Mtoto amesajiliwa!','s')}catch(e){toast('✗ '+e.message,'e')}}
function vaccinateChild(childId){let o='';VAX.forEach(v=>o+='<option>'+v+'</option>');document.getElementById('modalCtn').innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>💉 Rekodi Chanjo</h3><button class="close-btn" onclick="closeModal()">×</button></div><div class="frm-group"><label>💉 Chanjo *</label><select class="inp" id="vxn">'+o+'</select></div><div class="frm-group"><label>📊 Dozi *</label><input type="number" class="inp" id="vxd" value="1" min="1" max="10"></div><div class="frm-group"><label>📅 Tarehe *</label><input type="date" class="inp" id="vxdt" value="'+new Date().toISOString().split('T')[0]+'"></div><div class="frm-group"><label>📝 Maelezo</label><textarea class="inp" id="vxnotes" placeholder="Maelezo..." style="min-height:60px"></textarea></div><button class="btn btn-p" style="width:100%;padding:12px" onclick="saveVax(\''+childId+'\')">💾 Hifadhi</button></div></div>'}
async function saveVax(childId){const vn=document.getElementById('vxn').value,dose=parseInt(document.getElementById('vxd').value),dt=document.getElementById('vxdt').value,notes=document.getElementById('vxnotes')?.value.trim()||'';if(!vn||!dose||!dt)return toast('⚠ Jaza taarifa zenye *','w');const n=new Date(dt),iv={BCG:0,OPV:28,Pentavalent:28,PCV:28,Rotavirus:28,IPV:28,Measles:0,Rubella:0,'Vitamin A':180};n.setDate(n.getDate()+(iv[vn]||28));const nd=iv[vn]===0?'':n.toISOString().split('T')[0];try{await db.createDocument(C.databaseId,C.collections.vaccinations,ID.unique(),{vaccinationId:ID.unique(),childId,vaccineName:vn,dose,vaccinationDate:dt,nextVaccinationDate:nd,providerId:U.userId,notes,createdAt:new Date().toISOString()});closeModal();navigateTo('vaccinations');toast('✓ Chanjo imerekodiwa!','s')}catch(e){toast('✗ '+e.message,'e')}}
async function renderVax(){const cd=await db.listDocuments(C.databaseId,C.collections.children,[Query.equal('createdBy',U.userId)]),cids=cd.documents.map(c=>c.childId);let av=[];for(const ci of cids){const v=await db.listDocuments(C.databaseId,C.collections.vaccinations,[Query.equal('childId',ci),Query.orderDesc('vaccinationDate')]);av=av.concat(v.documents)}let h='<h2 class="page-title">💉 Kumbukumbu za Chanjo ('+av.length+')</h2><div class="tbl card" style="padding:0"><table><thead><tr><th>👶 Mtoto</th><th>💉 Chanjo</th><th>📊 Dozi</th><th>📅 Tarehe</th><th>⏰ Inayofuata</th></tr></thead><tbody>';if(av.length){av.forEach(v=>{const c=cd.documents.find(x=>x.childId===v.childId);h+='<tr><td><strong>'+esc(c?.fullName||'?')+'</strong></td><td><span class="badge bg-p">'+v.vaccineName+'</span></td><td>'+v.dose+'</td><td>'+fmtDate(v.vaccinationDate)+'</td><td>'+(v.nextVaccinationDate?fmtDate(v.nextVaccinationDate):'<span class="badge bg-s">✓ Kamili</span>')+'</td></tr>'})}else{h+='<tr><td colspan="5"><div class="empty"><div class="empty-icon">📭</div><p>Hakuna chanjo bado</p></div></td></tr>'}h+='</tbody></table></div>';return h}
async function renderSchedule(){const cd=await db.listDocuments(C.databaseId,C.collections.children,[Query.equal('createdBy',U.userId)]),cids=cd.documents.map(c=>c.childId);let av=[];for(const ci of cids){const v=await db.listDocuments(C.databaseId,C.collections.vaccinations,[Query.equal('childId',ci)]);av=av.concat(v.documents)}const today=new Date().toISOString().split('T')[0],od=av.filter(v=>v.nextVaccinationDate&&v.nextVaccinationDate<today);let h='<h2 class="page-title">📅 Ratiba</h2><div class="card"><h3>⚠ Zilizochelewa ('+od.length+')</h3><div class="tbl"><table><thead><tr><th>👶 Mtoto</th><th>💉 Chanjo</th><th>📅 Ilitakiwa</th><th>⏰ Siku</th></tr></thead><tbody>';if(od.length){od.forEach(v=>{const c=cd.documents.find(x=>x.childId===v.childId),days=Math.abs(daysLeft(v.nextVaccinationDate));h+='<tr><td><strong>'+esc(c?.fullName||'?')+'</strong></td><td>'+v.vaccineName+' D'+v.dose+'</td><td>'+fmtDate(v.nextVaccinationDate)+'</td><td><span class="badge bg-d">'+days+'siku</span></td></tr>'})}else{h+='<tr><td colspan="4">✓ Hakuna zilizochelewa</td></tr>'}h+='</tbody></table></div></div>';return h}
async function renderReports(){const cd=await db.listDocuments(C.databaseId,C.collections.children,[Query.equal('createdBy',U.userId)]),cids=cd.documents.map(c=>c.childId);let av=[];for(const ci of cids){const v=await db.listDocuments(C.databaseId,C.collections.vaccinations,[Query.equal('childId',ci)]);av=av.concat(v.documents)}window._rp={childrenDocs:cd,allVax:av};const bv={};av.forEach(v=>{bv[v.vaccineName]=(bv[v.vaccineName]||0)+1});let h='<h2 class="page-title">📈 Ripoti</h2><div class="stats"><div class="stat"><i style="background:var(--pl);color:var(--p)">👶</i><div><b>'+cd.total+'</b><span>Watoto</span></div></div><div class="stat"><i style="background:var(--sl);color:var(--s)">💉</i><div><b>'+av.length+'</b><span>Chanjo</span></div></div></div><div class="card"><h4>💉 Chanjo kwa Aina</h4><table><thead><tr><th>Chanjo</th><th>Idadi</th></tr></thead><tbody>';Object.keys(bv).sort((a,b)=>bv[b]-bv[a]).forEach(k=>{h+='<tr><td><strong>'+k+'</strong></td><td><span class="badge bg-p">'+bv[k]+'</span></td></tr>'});h+='</tbody></table></div><button class="btn btn-p" style="margin-top:14px" onclick="exportCSV()">📥 Pakua CSV</button>';return h}
function exportCSV(){const d=window._rp;let csv='Mtoto,Jinsia,Mzazi,Simu,Kituo,Chanjo,Dozi,Tarehe\n';d.childrenDocs.documents.forEach(c=>{const cv=d.allVax.filter(v=>v.childId===c.childId);if(cv.length===0)csv+='"'+c.fullName+'","'+c.gender+'","'+c.parentName+'","'+c.parentPhone+'","'+c.facility+'","—","—","—"\n';else cv.forEach(v=>csv+='"'+c.fullName+'","'+c.gender+'","'+c.parentName+'","'+c.parentPhone+'","'+c.facility+'","'+v.vaccineName+'","'+v.dose+'","'+v.vaccinationDate+'"\n')});const blob=new Blob(['\uFEFF'+csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vaccination_ripoti.csv';a.click();toast('✓ Ripoti imepakuliwa!','s')}

async function renderAdmin(){if(!isA)return'<div class="card empty"><div class="empty-icon">🛡️</div><h3>Hauna Ruhusa</h3></div>';const ud=await db.listDocuments(C.databaseId,C.collections.users,[Query.orderDesc('$createdAt')]),cd=await db.listDocuments(C.databaseId,C.collections.children,[Query.orderDesc('$createdAt')]),vd=await db.listDocuments(C.databaseId,C.collections.vaccinations,[Query.orderDesc('vaccinationDate')]);let ca='';try{const ad=await db.listDocuments(C.databaseId,C.collections.announcements,[Query.equal('isActive',true),Query.limit(1)]);if(ad.documents.length>0)ca=ad.documents[0].message}catch(e){}window._ad={users:ud.documents,children:cd.documents,vax:vd.documents};const today=new Date().toISOString().split('T')[0],tv=vd.documents.filter(v=>v.vaccinationDate===today),facilities=[...new Set(ud.documents.map(u=>u.facility).filter(Boolean))];let h='<div class="welcome"><h2>🛡️ Admin Panel</h2></div>';h+='<div class="card" style="border:2px solid var(--w);background:var(--wl)"><h3 style="color:#92400e">📢 Tangazo kwa Watoa Huduma</h3><div class="frm-group"><textarea class="inp" id="annMsg" style="background:var(--sf);min-height:70px" placeholder="Andika tangazo...">'+esc(ca)+'</textarea></div><div style="display:flex;gap:8px"><button class="btn btn-p" onclick="postAnn()" style="background:var(--w)">📢 Toa Tangazo</button><button class="btn btn-d" onclick="clearAnn()">🗑️ Futa</button></div><div id="annStatus" style="margin-top:8px"></div></div>';h+='<div class="stats"><div class="stat"><i style="background:var(--pl);color:var(--p)">👨‍⚕️</i><div><b>'+ud.total+'</b><span>Watoa Huduma</span></div></div><div class="stat"><i style="background:var(--sl);color:var(--s)">👶</i><div><b>'+cd.total+'</b><span>Watoto Wote</span></div></div><div class="stat"><i style="background:var(--wl);color:var(--w)">💉</i><div><b>'+vd.total+'</b><span>Chanjo Zote</span></div></div><div class="stat"><i style="background:var(--dl);color:var(--d)">📅</i><div><b>'+tv.length+'</b><span>Chanjo za Leo</span></div></div><div class="stat"><i style="background:var(--pl);color:var(--p)">🏥</i><div><b>'+facilities.length+'</b><span>Vituo vya Afya</span></div></div></div>';h+='<div class="tabs"><button class="tab active" onclick="showATab(\'users\',this)">👨‍⚕️ Watoa Huduma ('+ud.total+')</button><button class="tab" onclick="showATab(\'children\',this)">👶 Watoto Wote ('+cd.total+')</button><button class="tab" onclick="showATab(\'vax\',this)">💉 Chanjo Zote ('+vd.total+')</button></div><div id="adminContent">'+renderAUsers()+'</div>';return h}
async function postAnn(){const m=document.getElementById('annMsg').value.trim(),sd=document.getElementById('annStatus');if(!m){sd.innerHTML='<span style="color:var(--d)">⚠ Andika ujumbe</span>';return}sd.innerHTML='<span style="color:var(--p)">⏳...</span>';const ok=await saveAnn(m);if(ok){sd.innerHTML='<span style="color:var(--s)">✓ Tangazo limetolewa!</span>';toast('✓ Tangazo limetolewa!','s')}else{sd.innerHTML='<span style="color:var(--d)">✗ Imeshindwa</span>'}}
async function clearAnn(){const sd=document.getElementById('annStatus');sd.innerHTML='<span style="color:var(--p)">⏳...</span>';try{if(ann)await db.updateDocument(C.databaseId,C.collections.announcements,ann.$id,{isActive:false});const d=await db.listDocuments(C.databaseId,C.collections.announcements,[Query.equal('isActive',true)]);for(const x of d.documents)await db.updateDocument(C.databaseId,C.collections.announcements,x.$id,{isActive:false});hideBanner();document.getElementById('annMsg').value='';sd.innerHTML='<span style="color:var(--s)">✓ Tangazo limefutwa</span>';toast('✓ Tangazo limefutwa!','s')}catch(e){sd.innerHTML='<span style="color:var(--d)">✗ Imeshindwa</span>'}}
function renderAUsers(){const u=window._ad.users;let h='<div class="card" style="padding:0"><div class="tbl"><table><thead><tr><th>👤 Jina</th><th>📧 Email</th><th>📱 Simu</th><th>🏥 Kituo</th><th>Role</th><th>Status</th><th>📅 Usajili</th><th>⚡</th></tr></thead><tbody>';u.forEach(x=>{h+='<tr><td><strong>'+esc(x.fullName)+'</strong> '+(x.role==='admin'?'👑':'')+'</td><td>'+x.email+'</td><td>'+(x.phone||'—')+'</td><td>'+esc(x.facility||'—')+'</td><td><span class="badge '+(x.role==='admin'?'bg-w':'bg-p')+'">'+x.role+'</span></td><td><span class="badge '+(x.status==='active'?'bg-s':'bg-d')+'">'+x.status+'</span></td><td>'+fmtDate(x.createdAt)+'</td><td>'+(x.role!=='admin'?'<button class="btn btn-sm '+(x.status==='active'?'btn-d':'btn-g')+'" onclick="toggleUser(\''+x.userId+'\')">'+(x.status==='active'?'🔒 Zima':'🔓 Wezesha')+'</button>':'<span class="badge bg-p">👑 Admin</span>')+'</td></tr>'});h+='</tbody></table></div></div>';return h}
function showATab(type,btn){document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');const d=window._ad;if(type==='users')document.getElementById('adminContent').innerHTML=renderAUsers();else if(type==='children'){let h='<div class="card" style="padding:0"><div class="tbl"><table><thead><tr><th>👶 Mtoto</th><th>⚧</th><th>👤 Mzazi</th><th>📱 Simu</th><th>🏥 Kituo</th><th>👨‍⚕️ Alisajiliwa</th></tr></thead><tbody>';d.children.forEach(c=>{const cr=d.users.find(u=>u.userId===c.createdBy);h+='<tr><td><strong>'+esc(c.fullName)+'</strong></td><td>'+c.gender+'</td><td>'+esc(c.parentName)+'</td><td>'+c.parentPhone+'</td><td>'+esc(c.facility||'—')+'</td><td>'+esc(cr?.fullName||'—')+'</td></tr>'});h+='</tbody></table></div></div>';document.getElementById('adminContent').innerHTML=h}else{let h='<div class="card" style="padding:0"><div class="tbl"><table><thead><tr><th>💉 Chanjo</th><th>📊 Dozi</th><th>📅 Tarehe</th><th>⏰ Inayofuata</th><th>👨‍⚕️ Alitoa</th></tr></thead><tbody>';d.vax.forEach(v=>{const pv=d.users.find(u=>u.userId===v.providerId);h+='<tr><td><strong>'+v.vaccineName+'</strong></td><td>'+v.dose+'</td><td>'+fmtDate(v.vaccinationDate)+'</td><td>'+(v.nextVaccinationDate?fmtDate(v.nextVaccinationDate):'<span class="badge bg-s">✓ Kamili</span>')+'</td><td>'+esc(pv?.fullName||'—')+'</td></tr>'});h+='</tbody></table></div></div>';document.getElementById('adminContent').innerHTML=h}}
async function toggleUser(userId){const d=await db.listDocuments(C.databaseId,C.collections.users,[Query.equal('userId',userId)]);if(d.documents.length===0)return;const u=d.documents[0];if(u.role==='admin')return toast('⚠ Huwezi kumzuia admin!','w');await db.updateDocument(C.databaseId,C.collections.users,u.$id,{status:u.status==='active'?'disabled':'active'});navigateTo('admin');toast('✓ Status imebadilishwa!','s')}

async function init(){initTheme();load(true);try{const u=await account.get();await enter(u.$id)}catch(e){document.getElementById('app').style.display='none';document.getElementById('auth').style.display='flex';showAuth('login')}load(false)}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
