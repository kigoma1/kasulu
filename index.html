async function pop(){
    if(!U||U.role!=='supervisor'||isNotifShowing)return;
    try{
        const asgn=await db.listDocuments(D,C.A,[Appwrite.Query.equal('supervisorId',U.userId)]);
        const sids=asgn.documents.map(a=>a.studentId);
        const logs=await db.listDocuments(D,C.L,[Appwrite.Query.equal('status','pending'),Appwrite.Query.limit(100)]);
        const my=logs.documents.filter(l=>sids.includes(l.studentId));
        const newLogs=my.filter(l=>!notifiedLogIds.has(l.$id));
        const total=my.length;
        const badge=document.getElementById('actBadge');
        if(badge){badge.style.display=total>0?'inline-flex':'none';badge.textContent=total>99?'99+':total}
        if(newLogs.length===0)return;
        isNotifShowing=!0;newLogs.forEach(l=>notifiedLogIds.add(l.$id));
        const names=[];
        for(const l of newLogs.slice(0,5)){try{const su=await db.getDocument(D,C.U,l.studentId);names.push({name:su.fullName,week:l.weekNumber,id:l.$id})}catch(e){}}
        const nameList=names.map(n=>`<div class="border rounded p-2 mb-1 d-flex justify-content-between align-items-center" style="cursor:pointer;font-size:0.75rem" onclick="Swal.clickConfirm();Swal.getPopup().__sel='${n.id}'"><span>📝 <strong>${n.name}</strong> - W${n.week}</span><i class="bi bi-chevron-right text-muted"></i></div>`).join('');
        const r=await Swal.fire({title:`📬 ${newLogs.length} New`,html:`<div class="text-start small">${nameList}${newLogs.length>5?`<p class="text-muted text-center">+${newLogs.length-5} more</p>`:''}</div>`,icon:'info',confirmButtonText:'📋 Review',showCancelButton:!0,cancelButtonText:'Later',confirmButtonColor:'#1a5276',cancelButtonColor:'#6b7280'});
        isNotifShowing=!1;
        if(r.isConfirmed){const sel=Swal.getPopup().__sel;if(sel){await rvL(sel)}else{lp('action_reviews')}}
    }catch(e){isNotifShowing=!1}
}

async function rSup(n,em,pw,rg){if(!n||!em||!pw)return null;try{const ex=await db.listDocuments(D,C.U,[Appwrite.Query.equal('email',em),Appwrite.Query.equal('role','supervisor')]);if(ex.total>0)return ex.documents[0];const now=new Date().toISOString();let uid=Appwrite.ID.unique();try{await ac.create(uid,em,pw,n)}catch(e){if(e.message.includes('409')||e.message.includes('already exists')){uid=Appwrite.ID.unique()}else throw e}return await db.createDocument(D,C.U,uid,{userId:uid,fullName:n,email:em,role:'supervisor',region:rg||'',phone:'',isActive:!1,createdAt:now,updatedAt:now})}catch(e){return null}}

async function reg(){
    const d={fn:document.getElementById('rfn')?.value?.trim(),em:document.getElementById('re')?.value?.trim(),ph:document.getElementById('rp')?.value?.trim(),rn:document.getElementById('rrn')?.value?.trim()||'',ins:document.getElementById('ri')?.value?.trim()||'',dep:document.getElementById('rd')?.value?.trim()||'',rg:document.getElementById('regR')?.value,ds:document.getElementById('regD')?.value,pw:document.getElementById('rpw')?.value};
    if(!d.fn||!d.em||!d.ph||!d.rg||!d.pw)return st('Fill all required fields','warning');
    if(d.pw.length<8)return st('Password min 8 chars','warning');
    const btn=document.getElementById('rb');btn.disabled=!0;
    try{sl();const uid=Appwrite.ID.unique(),now=new Date().toISOString();await ac.create(uid,d.em,d.pw,d.fn);await db.createDocument(D,C.U,uid,{userId:uid,fullName:d.fn,email:d.em,regNum:d.rn,institution:d.ins,department:d.dep,role:'student',phone:d.ph,region:d.rg,district:d.ds||'',supStatus:ST.NS,isActive:!0,createdAt:now,updatedAt:now});hl();st('Account created! 🎉');cF();document.getElementById('rf').style.display='none';document.getElementById('lf').style.display='block'}catch(e){hl();Swal.fire({icon:'error',title:'Registration Failed',text:e.message})}
    btn.disabled=!1;
}

async function login(){
    const em=document.getElementById('le')?.value?.trim(),pw=document.getElementById('lp')?.value;
    if(!em||!pw)return st('Enter email & password','warning');
    const btn=document.getElementById('lb');btn.disabled=!0;
    try{sl();try{await ac.deleteSession('current')}catch(x){}await ac.createEmailPasswordSession(em,pw);const acc=await ac.get();let ud;try{ud=await db.listDocuments(D,C.U,[Appwrite.Query.equal('userId',acc.$id)])}catch(x){ud={total:0,documents:[]}}if(ud.total>0)U=ud.documents[0];else{const now=new Date().toISOString();U={userId:acc.$id,fullName:acc.name||em,email:acc.email||em,role:'student',supStatus:ST.NS};try{await db.createDocument(D,C.U,acc.$id,{...U,createdAt:now,updatedAt:now})}catch(x){}}hl();
    if(U.role==='supervisor'&&U.isActive===!1){try{await ac.deleteSession('current')}catch(e){}U=null;Swal.fire({icon:'info',title:'⏳ Pending Approval',text:'Your account is pending admin approval.'});btn.disabled=!1;return}
    if(U.role==='supervisor'&&!U.pwChanged){const changed=await fPw();if(!changed){try{await ac.deleteSession('current')}catch(e){}U=null;btn.disabled=!1;return}try{await db.updateDocument(D,C.U,U.userId,{pwChanged:new Date().toISOString(),updatedAt:new Date().toISOString()})}catch(e){}}
    cF();st(`Welcome, ${U.fullName}! 👋`);sD()}catch(e){hl();Swal.fire({icon:'error',title:'Login Failed',text:'Invalid email or password'})}
    btn.disabled=!1;
}

async function fPw(){
    const{value}=await Swal.fire({title:'🔒 Change Password Required',html:`<div class="text-start"><div class="alert alert-warning small mb-3"><strong>Security Alert!</strong><br>The student who registered you knows your password.</div><input id="op" class="form-control form-control-sm mb-2" type="password" placeholder="Current Password *"><input id="np" class="form-control form-control-sm mb-2" type="password" placeholder="New Password (min 8) *"><input id="cp" class="form-control form-control-sm mb-2" type="password" placeholder="Confirm New Password *"></div>`,showCancelButton:!1,allowOutsideClick:!1,allowEscapeKey:!1,confirmButtonText:'Change Password',confirmButtonColor:'#1a5276',preConfirm:()=>{const op=document.getElementById('op').value,np=document.getElementById('np').value,cp=document.getElementById('cp').value;if(!op||!np||!cp)return Swal.showValidationMessage('All fields required');if(np.length<8)return Swal.showValidationMessage('Min 8 characters');if(np!==cp)return Swal.showValidationMessage('Passwords do not match');if(op===np)return Swal.showValidationMessage('Must be different');return{op,np}}});
    if(!value)return!1;
    try{sl();await ac.updatePassword(value.np,value.op);hl();await Swal.fire({icon:'success',title:'✅ Password Changed!',confirmButtonColor:'#10b981'});return!0}catch(e){hl();if(e.message.includes('Invalid credentials')){await Swal.fire({icon:'error',title:'Wrong Password'});return await fPw()}Swal.fire({icon:'error',text:e.message});return!1}
}

    const{value:fd}=await Swal.fire({title:'🔒 Change Password',html:`<div class="text-start"><div class="alert alert-info small py-2 mb-3"><i class="bi bi-info-circle"></i> Change your account password</div><div class="mb-3"><label class="small fw-semibold text-muted mb-1">Current Password *</label><input id="cpop" class="fc" type="password" placeholder="Enter current password"></div><div class="mb-3"><label class="small fw-semibold text-muted mb-1">New Password *</label><input id="cpnp" class="fc" type="password" placeholder="Min 8 characters"></div><div class="mb-3"><label class="small fw-semibold text-muted mb-1">Confirm New Password *</label><input id="cpcp" class="fc" type="password" placeholder="Re-enter new password"></div></div>`,showCancelButton:!0,confirmButtonText:'<i class="bi bi-check-circle"></i> Change',cancelButtonText:'Cancel',confirmButtonColor:'#1a5276',preConfirm:()=>{const op=document.getElementById('cpop')?.value,np=document.getElementById('cpnp')?.value,cp=document.getElementById('cpcp')?.value;if(!op||!np||!cp){Swal.showValidationMessage('All fields required');return!1}if(np.length<8){Swal.showValidationMessage('Min 8 characters');return!1}if(np!==cp){Swal.showValidationMessage('Passwords do not match');return!1}if(op===np){Swal.showValidationMessage('Must be different');return!1}return{op,np}}});
    if(!fd)return;
    try{sl();await ac.updatePassword(fd.np,fd.op);try{await db.updateDocument(D,C.U,U.userId,{pwChanged:new Date().toISOString(),updatedAt:new Date().toISOString()})}catch(e){}U.pwChanged=new Date().toISOString();hl();await Swal.fire({icon:'success',title:'✅ Password Changed!',confirmButtonColor:'#10b981'});st('Password changed! 🔒')}catch(e){hl();Swal.fire({icon:'error',title:'Error',text:e.message||'Failed'})}
}

async function rd(){
    if(U.role==='student'){

    }

    if(U.role==='admin'){try{const[u,s]=await Promise.all([db.listDocuments(D,C.U),db.listDocuments(D,C.U,[Appwrite.Query.equal('role','supervisor'),Appwrite.Query.equal('isActive',!1)])]);return`<div class="sg"><div class="sc" onclick="lp('users')"><h2 style="color:#3b82f6">${u.documents.filter(x=>x.role==='student').length}</h2><p>Students</p></div><div class="sc" onclick="lp('users')"><h2 style="color:#10b981">${u.documents.filter(x=>x.role==='supervisor').length}</h2><p>Supervisors</p></div><div class="sc" onclick="lp('pending_approvals')"><h2 style="color:#f59e0b">${s.total}</h2><p>Pending</p></div></div>`}catch(e){return'<div class="cc">Error</div>'}}

async function rml(){
    try{
        const logs=await db.listDocuments(D,C.L,[Appwrite.Query.equal('studentId',U.userId),Appwrite.Query.orderDesc('$createdAt'),Appwrite.Query.limit(52)]);
        const sd=U.fieldStartDate?new Date(U.fieldStartDate):null;
        
        // Count rejected logbooks
        const rejectedCount=logs.documents.filter(l=>l.status==='rejected').length;
        
        let h=`<div class="cc"><div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"><div><h5 class="fw-bold mb-0" style="font-size:0.9rem">📝 My Logbooks</h5>${sd?`<small class="text-muted">Since: ${sd.toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'})}</small>`:''}</div><button class="bsc" onclick="cLB()"><i class="bi bi-plus-lg"></i> New</button></div>`;
        
        // Delete All Rejected Button
        if(rejectedCount>0){
            h+=`<div class="mb-3"><button class="delete-rejected-btn" onclick="deleteAllRejected()"><i class="bi bi-trash"></i> Delete All Rejected (${rejectedCount})</button></div>`;
        }
        
        if(logs.total===0)return h+`<div class="empty-state"><i class="bi bi-journal-x" style="font-size:2rem"></i><h5 class="mt-2">No Logbooks</h5><button class="bsc mt-2" onclick="cLB()">Create</button></div>`;
        const sc={pending:'warning',approved:'success',rejected:'danger'};
        logs.documents.forEach(log=>{
            const ws=sd?new Date(sd.getTime()+((log.weekNumber-1)*7*24*60*60*1000)):null;
            const we=ws?new Date(ws.getTime()+(6*24*60*60*1000)):null;
            const canDelete=(log.status==='pending'||log.status==='rejected');
            h+=`<div class="act-card" onclick="vL('${log.$id}')">
                <div style="flex:1;min-width:0">
                    <div class="d-flex justify-content-between align-items-start">
                        <strong style="font-size:0.72rem">📅 Week ${log.weekNumber}</strong>
                        <span class="badge bg-${sc[log.status]||'secondary'} bst">${log.status}</span>
                    </div>
                    <div class="act-card-preview">${(log.activities||'').substring(0,100)}</div>
                </div>
                <div class="act-card-actions">
                    <button class="bsc btn-sm" onclick="event.stopPropagation();vL('${log.$id}')" title="View" style="padding:0.25rem 0.5rem;font-size:0.65rem"><i class="bi bi-eye"></i></button>
                    <button class="bxsw btn-sm" onclick="event.stopPropagation();eP('${log.$id}')" title="PDF" style="padding:0.25rem 0.5rem;font-size:0.65rem"><i class="bi bi-file-pdf"></i></button>
                    ${canDelete?`<button class="bxsd btn-sm" onclick="event.stopPropagation();dL('${log.$id}')" title="Delete" style="padding:0.25rem 0.5rem;font-size:0.65rem"><i class="bi bi-trash"></i></button>`:''}
                </div>
            </div>`;
        });
        return h+'</div>';
    }catch(e){return'<div class="cc">Error loading</div>'}
}

// ============ DELETE ALL REJECTED FUNCTION ============
async function deleteAllRejected(){
    try{
        const logs=await db.listDocuments(D,C.L,[Appwrite.Query.equal('studentId',U.userId),Appwrite.Query.equal('status','rejected'),Appwrite.Query.limit(100)]);
        if(logs.total===0)return st('No rejected logbooks','warning');
        
        const r=await Swal.fire({
            title:`Delete All Rejected?`,
            html:`<div class="text-start"><p>You are about to delete <strong>${logs.total} rejected</strong> logbook(s).</p><p class="text-danger small">This cannot be undone. You can resubmit new entries afterwards.</p></div>`,
            icon:'warning',
            showCancelButton:!0,
            confirmButtonColor:'#ef4444',
            confirmButtonText:`Delete ${logs.total} Rejected`,
            cancelButtonText:'Cancel'
        });
        
        if(!r.isConfirmed)return;
        
        sl();
        const ids=logs.documents.map(l=>l.$id);
        // Delete all rejected logbooks in parallel
        await Promise.all(ids.map(id=>db.deleteDocument(D,C.L,id)));
        // Remove from notified set
        ids.forEach(id=>notifiedLogIds.delete(id));
        hl();
        st(`${ids.length} rejected logbooks deleted! 🗑️`);
        lp('my_logbooks');
    }catch(e){
        hl();
        Swal.fire({icon:'error',title:'Error',text:e.message||'Failed to delete rejected logbooks'});
    }
}

function eP(lid){
    db.getDocument(D,C.L,lid).then(log=>{
        const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
        let y=15;
        doc.setFontSize(14);doc.text('BEHSIT FIELD SYSTEM - Logbook',20,y);y+=8;
        doc.setFontSize(10);doc.text(`Student: ${U.fullName} | Date: ${new Date().toLocaleDateString()}`,20,y);y+=8;
        doc.setFontSize(8);

        doc.save(`Week_${log.weekNumber}.pdf`);st('PDF exported! 📄')
    }).catch(e=>Swal.fire({icon:'error',text:e.message}))
}

async function ract(){
    if(U.role!=='supervisor')return'<div class="cc">Access denied</div>';
    try{
        const asgn=await db.listDocuments(D,C.A,[Appwrite.Query.equal('supervisorId',U.userId)]);
        const sids=asgn.documents.map(a=>a.studentId);
        const logs=await db.listDocuments(D,C.L,[Appwrite.Query.equal('status','pending'),Appwrite.Query.limit(100)]);
        const fl=logs.documents.filter(l=>sids.includes(l.studentId));
        let h=`<div class="cc"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="fw-bold mb-0" style="font-size:0.9rem">📋 Action Required</h5><span class="badge bg-warning bst">${fl.length} pending</span></div>`;
        if(!fl.length)return h+'<div class="empty-state"><i class="bi bi-check-circle" style="color:#10b981;font-size:2rem"></i><p>All clear! 🎉</p></div></div>';
        const sg={};

        const logs=await db.listDocuments(D,C.L,[Appwrite.Query.limit(200)]);
        let h=`<div class="cc"><h5 class="fw-bold mb-3">🗑️ Bulk Delete</h5><div class="mb-2"><button class="bsc-outline btn-sm me-1" onclick="toggleAll()">Select All</button><button class="bsc-outline btn-sm me-1" onclick="togglePending()">Pending Only</button><button class="bsc-outline btn-sm me-1" onclick="toggleRejected()">Rejected Only</button><button class="bsc-outline btn-sm" onclick="toggleNone()">None</button></div><div style="max-height:400px;overflow-y:auto" id="bulkList">`;
        for(const l of logs.documents){let sn=l.studentId;try{const su=await db.getDocument(D,C.U,l.studentId);sn=su.fullName}catch(e){}h+=`<div class="border rounded p-2 mb-1 small d-flex align-items-center gap-2"><input type="checkbox" class="bulk-check" data-id="${l.$id}" onchange="updateBulkCount()"><span>W${l.weekNumber} | ${sn} | <span class="badge bg-${l.status==='approved'?'success':l.status==='pending'?'warning':'danger'} bst">${l.status}</span></span></div>`}
        h+=`</div><div class="mt-2 d-flex justify-content-between align-items-center"><span class="small" id="bulkCount">0 selected</span><button class="bxsd" onclick="bulkDelete()"><i class="bi bi-trash"></i> Delete Selected</button></div></div>`;
        return h;
    }catch(e){return'<div class="cc">Error</div>'}
}

function toggleAll(){document.querySelectorAll('.bulk-check').forEach(c=>c.checked=!0);updateBulkCount()}
function togglePending(){document.querySelectorAll('.bulk-check').forEach(c=>{const row=c.closest('.border');const badge=row?.querySelector('.bst');c.checked=(badge&&badge.textContent.trim()==='pending')});updateBulkCount()}
function toggleRejected(){document.querySelectorAll('.bulk-check').forEach(c=>{const row=c.closest('.border');const badge=row?.querySelector('.bst');c.checked=(badge&&badge.textContent.trim()==='rejected')});updateBulkCount()}
function toggleNone(){document.querySelectorAll('.bulk-check').forEach(c=>c.checked=!1);updateBulkCount()}
function updateBulkCount(){const cnt=document.querySelectorAll('.bulk-check:checked').length;document.getElementById('bulkCount').textContent=`${cnt} selected`}

async function bulkDelete(){
    const checked=document.querySelectorAll('.bulk-check:checked');
    if(checked.length===0)return st('Select logbooks first','warning');
    const r=await Swal.fire({title:`Delete ${checked.length} logbook(s)?`,text:'This cannot be undone.',icon:'warning',showCancelButton:!0,confirmButtonColor:'#ef4444',confirmButtonText:'Delete All'});
    if(!r.isConfirmed)return;
    try{sl();const ids=Array.from(checked).map(c=>c.dataset.id);await Promise.all(ids.map(id=>db.deleteDocument(D,C.L,id)));ids.forEach(id=>notifiedLogIds.delete(id));hl();st(`${ids.length} deleted!`);lp('bulk_delete')}catch(e){hl();Swal.fire({icon:'error',text:e.message})}
}

async function red(){
    return`<div class="cc"><h5 class="fw-bold mb-3">📥 Export Data</h5><div class="d-grid gap-2"><button class="bsc" onclick="exportAllUsers()"><i class="bi bi-people"></i> Export Users (CSV)</button><button class="bsc" onclick="exportAllLogbooks()"><i class="bi bi-journals"></i> Export Logbooks (CSV)</button><button class="bsc-outline" onclick="exportAllJSON()"><i class="bi bi-file-code"></i> Export All Data (JSON)</button></div></div>`
}

async function exportAllUsers(){try{sl();const users=await db.listDocuments(D,C.U,[Appwrite.Query.limit(500)]);let csv='Name,Email,Role,Region,Phone,Institution,Status\n';users.documents.forEach(u=>{csv+=`"${u.fullName}","${u.email}","${u.role}","${u.region||''}","${u.phone||''}","${u.institution||''}","${u.isActive!==!1?'Active':'Inactive'}"\n`});hl();downloadFile(csv,'users.csv','text/csv');st('Users exported! 📥')}catch(e){hl();Swal.fire({icon:'error',text:e.message})}}
async function exportAllLogbooks(){try{sl();const logs=await db.listDocuments(D,C.L,[Appwrite.Query.limit(500)]);let csv='Week,StudentID,Status,Submitted,Activities\n';for(const l of logs.documents){let sn=l.studentId;try{const su=await db.getDocument(D,C.U,l.studentId);sn=su.fullName}catch(e){}csv+=`${l.weekNumber},"${sn}","${l.status}","${l.submittedAt||''}","${(l.activities||'').replace(/"/g,'""').substring(0,200)}"\n`}hl();downloadFile(csv,'logbooks.csv','text/csv');st('Logbooks exported! 📥')}catch(e){hl();Swal.fire({icon:'error',text:e.message})}}
async function exportAllJSON(){try{sl();const[u,l]=await Promise.all([db.listDocuments(D,C.U,[Appwrite.Query.limit(500)]),db.listDocuments(D,C.L,[Appwrite.Query.limit(500)])]);const data={users:u.documents,logbooks:l.documents,exportedAt:new Date().toISOString()};hl();downloadFile(JSON.stringify(data,null,2),'behsit_data.json','application/json');st('Data exported! 📥')}catch(e){hl();Swal.fire({icon:'error',text:e.message})}}

function downloadFile(content,filename,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url)}
