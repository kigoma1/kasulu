-2">Signature *</label><div class="sig-wrapper"><canvas id="studentSigCanvas" class="sp-sm mb-1"></canvas><button type="button" class="sig-clear-btn" onclick="clearStudentSig()"><i class="bi bi-eraser"></i></button></div></div>`,didOpen:()=>{const cv=document.getElementById('studentSigCanvas');if(cv)studentSigPad=new SignaturePad(cv,{penColor:'#1a5276'})},confirmButtonText:canAddSummary?'Submit Week':'Send Work',showCancelButton:!0,width:'700px',preConfirm:()=>{const w=document.getElementById('sw').value;let acts='',hasAct=!1;if(canAddSummary){days.forEach(d=>{const v=document.getElementById('day_'+d.en)?.value||'';if(v.trim()){hasAct=!0;acts+=`${d.sw} (${wd[d.en]}):\n${v}\n\n`}})}else{const tn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][today];const v=document.getElementById('day_'+tn)?.value||'';if(v.trim()){hasAct=!0;acts=`${tn} (${new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}):\n${v}\n`}}const sig=studentSigPad?.toDataURL()||'';const sum=canAddSummary?(document.getElementById('sr')?.value||''):'';const fileInput=document.getElementById('logbookFile');let fileData=null;if(fileInput&&fileInput.files&&fileInput.files[0]){fileData={name:fileInput.files[0].name,size:fileInput.files[0].size,type:fileInput.files[0].type}}if(!w||!hasAct)return Swal.showValidationMessage('Week number and activities required');if(studentSigPad?.isEmpty())return Swal.showValidationMessage('Signature required');return{weekNumber:parseInt(w),activities:acts,summary:sum,studentSignature:sig,canAddSummary,file:fileData}}});if(!form)return;try{sl();const did=Appwrite.ID.unique();const now=new Date().toISOString();let fileUrl='';if(form.file){try{fileUrl=`${BUCKET_ID}/${did}`}catch(e){}}await databases.createDocument(DATABASE_ID,COL.LOGBOOKS,did,{logbookId:did,studentId:currentUser.userId,weekNumber:form.weekNumber,activities:form.activities,recommendations:form.summary,studentSignature:form.studentSignature||'',attachments:form.file?JSON.stringify(form.file):'',fileUrl:fileUrl,status:'submitted_to_field',submittedAt:now,createdAt:now,updatedAt:now});try{const asgn=await databases.listDocuments(DATABASE_ID,COL.ASSIGNMENTS,[Appwrite.Query.equal('studentId',currentUser.userId),Appwrite.Query.equal('status','active'),Appwrite.Query.limit(1)]);if(asgn.total>0){const a=asgn.documents[0];const msg=`${currentUser.fullName} submitted Week ${form.weekNumber}. Please review.`;if(a.fieldSupervisorId)await cn(a.fieldSupervisorId,'📝 New Submission',msg);if(a.universitySupervisorId)await cn(a.universitySupervisorId,'📝 New Submission',msg);st('Submitted! Sent to supervisors ✉️')}}catch(e){}studentSigPad=null;hl();lp('my_logbooks')}catch(e){se(e,'Failed')}}
async function vl(lid){try{const log=await databases.getDocument(DATABASE_ID,COL.LOGBOOKS,lid);let rh='';try{const rvs=await databases.listDocuments(DATABASE_ID,COL.REVIEWS,[Appwrite.Query.equal('logbookId',lid)]);for(const rev of rvs.documents){let nm=rev.reviewerRole;try{const ru=await databases.getDocument(DATABASE_ID,COL.USERS,rev.reviewerId);nm=ru.fullName}catch(e){}rh+=`<div class="border rounded p-2 mb-1 small"><strong>${nm}:</strong> ${rev.comment}</div>`}}catch(e){}let attHTML='';try{if(log.attachments){const a=JSON.parse(log.attachments);attHTML=`<div class="border rounded p-2 mb-1 small"><strong>📎 Attachment:</strong> <a href="${log.fileUrl?'https://fra.cloud.appwrite.io/v1/storage/buckets/'+log.fileUrl+'/view?project=6a21b1440038c361fabb':'#'}" target="_blank" class="text-primary">${a.name}</a> (${(a.size/1024).toFixed(1)} KB)</div>`}}catch(e){}await Swal.fire({title:`Week ${log.weekNumber}`,html:`<div class="text-start">${log.studentSignature?`<p><img src="${log.studentSignature}" width="120"></p>`:''}${attHTML}<h6>Activities</h6><pre style="font-size:.78rem;background:#f8fafc;padding:.8rem;border-radius:6px">${log.activities||'N/A'}</pre>${log.recommendations?`<h6>Summary</h6><p style="background:#f0fdf4;padding:.8rem;border-radius:6px">${log.recommendations}</p>`:''}${rh?`<h6>Reviews</h6>${rh}`:''}</div>`,width:'750px'})}catch(e){se(e,'Failed')}}

async function raction(){if(currentUser.role!=='field_supervisor'&&currentUser.role!=='university_supervisor')return'<div class="cc">Access denied</div>';try{const asgn=await databases.listDocuments(DATABASE_ID,COL.ASSIGNMENTS,[currentUser.role==='field_supervisor'?Appwrite.Query.equal('fieldSupervisorId',currentUser.userId):Appwrite.Query.equal('universitySupervisorId',currentUser.userId)]);const sids=asgn.documents.map(a=>a.studentId);const sf=currentUser.role==='field_supervisor'?'submitted_to_field':'reviewed_by_field';const logs=await databases.listDocuments(DATABASE_ID,COL.LOGBOOKS,[Appwrite.Query.equal('status',sf),Appwrite.Query.limit(100)]);const fl=logs.documents.filter(l=>sids.includes(l.studentId));const rl=currentUser.role==='field_supervisor'?'Field Supervisor Review':'University Supervisor - Final Approval';let h=`<div class="cc"><h5>Action Required - ${rl}</h5><p class="small text-muted">${fl.length} logbook(s) pending</p>`;if(!fl.length)return h+'<div class="text-center py-4"><p class="text-muted">No pending reviews 🎉</p></div></div>';for(const log of fl){let sname=log.studentId;try{const su=await databases.getDocument(DATABASE_ID,COL.USERS,log.studentId);sname=su.fullName}catch(e){}let att='';try{if(log.attachments){const a=JSON.parse(log.attachments);att=`<br><small class="text-primary">📎 <a href="${log.fileUrl?'https://fra.cloud.appwrite.io/v1/storage/buckets/'+log.fileUrl+'/view?project=6a21b1440038c361fabb':'#'}" target="_blank">${a.name}</a></small>`}}catch(e){}const sl=log.status==='submitted_to_field'?'⏳ Pending Field Review':'👁️ Pending Final Approval';h+=`<div class="action-card"><div style="flex:1"><strong>📝 Week ${log.weekNumber}</strong><br><small class="text-muted">${sname} | ${sl}</small>${att}${log.recommendations?`<br><small class="text-success">Summary: ${log.recommendations.substring(0,50)}...</small>`:''}</div><button class="bsc" onclick="rvl('${log.$id}')">Review</button></div>`}return h+'</div>'}catch(e){return'<div class="cc">Error</div>'}}
async function rvl(lid){try{const logbook=await databases.getDocument(DATABASE_ID,COL.LOGBOOKS,lid);let attHTML='';try{if(logbook.attachments){const a=JSON.parse(logbook.attachments);attHTML=`<div style="border:1.5px solid #e2e8f0;border-radius:8px;padding:.8rem;margin-bottom:.8rem"><h6>📎 Attachment</h6><p class="small mb-0"><a href="${logbook.fileUrl?'https://fra.cloud.appwrite.io/v1/storage/buckets/'+logbook.fileUrl+'/view?project=6a21b1440038c361fabb':'#'}" target="_blank" class="text-primary">${a.name}</a> (${(a.size/1024).toFixed(1)} KB)</p></div>`}}catch(e){}const r=await Swal.fire({title:`Review Week ${logbook.weekNumber}`,html:`<div class="text-start">${attHTML}<div style="border:1.5px solid #e2e8f0;border-radius:8px;padding:.8rem;margin-bottom:.8rem"><h6>Activities</h6><pre style="font-size:.75rem;max-height:140px;overflow-y:auto">${logbook.activities||'N/A'}</pre></div>${logbook.recommendations?`<div style="border:1.5px solid #e2e8f0;border-radius:8px;padding:.8rem;margin-bottom:.8rem"><h6>Summary</h6><p>${logbook.recommendations}</p></div>`:''}${logbook.studentSignature?`<p><img src="${logbook.studentSignature}" width="100"></p>`:''}<hr><label>Comment *</label><textarea id="rvc" class="form-control form-control-sm mb-2" rows="3"></textarea><div class="sig-wrapper"><canvas id="scv" class="sp-sm mb-1"></canvas><button type="button" class="sig-clear-btn" onclick="clearReviewSig()"><i class="bi bi-eraser"></i></button></div></div>`,didOpen:()=>{const cv=document.getElementById('scv');if(cv)window.tsp=new SignaturePad(cv,{penColor:'#1a5276'})},showCancelButton:!0,showDenyButton:!0,confirmButtonText:'✓ Approve',denyButtonText:'✕ Reject',confirmButtonColor:'#10b981',denyButtonColor:'#ef4444',preConfirm:()=>{const cm=document.getElementById('rvc')?.value;if(!cm)return Swal.showValidationMessage('Comment required');return{comment:cm,signature:window.tsp?.toDataURL()||'',decision:'approved'}},preDeny:()=>{const cm=document.getElementById('rvc')?.value;if(!cm)return Swal.showValidationMessage('Comment required');return{comment:cm,signature:window.tsp?.toDataURL()||'',decision:'rejected'}}});if(!r)return;const rd=r.value||r;sl();const now=new Date().toISOString();const isFs=currentUser.role==='field_supervisor';const ns=rd.decision==='rejected'?'rejected':isFs?'reviewed_by_field':'approved';await databases.createDocument(DATABASE_ID,COL.REVIEWS,Appwrite.ID.unique(),{logbookId:lid,reviewerId:currentUser.userId,reviewerRole:currentUser.role,stage:isFs?'field_review':'university_review',comment:rd.comment,decision:rd.decision,signatureUrl:rd.signature||'',reviewedAt:now,createdAt:now,updatedAt:now});await databases.updateDocument(DATABASE_ID,COL.LOGBOOKS,lid,{status:ns,updatedAt:now});const stu=await databases.getDocument(DATABASE_ID,COL.USERS,logbook.studentId);if(rd.decision==='rejected'){await cn(logbook.studentId,'❌ Rejected',`Week ${logbook.weekNumber}: ${rd.comment}`)}else if(isFs){try{const asgn=await databases.listDocuments(DATABASE_ID,COL.ASSIGNMENTS,[Appwrite.Query.equal('studentId',logbook.studentId),Appwrite.Query.equal('status','active'),Appwrite.Query.limit(1)]);if(asgn.total>0&&asgn.documents[0].universitySupervisorId){await cn(asgn.documents[0].universitySupervisorId,'📝 Final Approval Required',`${stu.fullName}'s Week ${logbook.weekNumber} needs final approval.`);}}catch(e){}await cn(logbook.studentId,'✅ Forwarded',`Week ${logbook.weekNumber}: Forwarded for final approval.`)}else{await cn(logbook.studentId,'🎉 Approved!',`Week ${logbook.weekNumber}: FINALLY APPROVED!`)}try{const newCount=Math.max(0,(currentUser.lastSeenActionCount||0)-1);await setLastSeenActionCount(newCount)}catch(e){}hl();Toastify({text:`✓ ${rd.decision==='rejected'?'Rejected':'Approved'}!`,duration:1500,gravity:'top',position:'right',style:{background:rd.decision==='rejected'?'#ef4444':'#10b981',color:'#fff',borderRadius:'6px',padding:'8px 16px',fontSize:'13px'}}).showToast();lp('action_reviews');updateActionBadge()}catch(e){se(e,'Failed')}}
async function rpt(){let h=`<div class="cc"><h5>PT Checklist - Guide</h5><p class="text-muted small">📌 Reference guide for fieldwork activities.</p>`;for(const[cat,acts]of Object.entries(PT_CATEGORIES)){h+=`<div class="pt-cat-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">${cat} <span class="badge bg-primary">${acts.length}</span></div><div style="display:none">${acts.map(a=>`<div class="pt-item"><span>• ${a}</span></div>`).join('')}</div>`}return h+'</div>'}
async function rfa(){if(currentUser.role==='student'){try{const d=await databases.listDocuments(DATABASE_ID,COL.FA,[Appwrite.Query.equal('studentId',currentUser.userId),Appwrite.Query.limit(1)]);if(d.total===0)return'<div class="cc"><h5>No assessment yet</h5></div>';const fa=d.documents[0];if(fa.status==='pending_uni_approval')return`<div class="cc"><h5>Final Assessment</h5><p class="text-warning">⏳ Pending University Supervisor approval</p></div>`;return`<div class="cc"><h5>Final Assessment</h5><p>Marks: ${fa.marks}/100</p><p>${fa.comments||''}</p></div>`}catch(e){return'<div class="cc">Error</div>'}}if(currentUser.role==='field_supervisor'){try{const asgn=await databases.listDocuments(DATABASE_ID,COL.ASSIGNMENTS,[Appwrite.Query.equal('fieldSupervisorId',currentUser.userId)]);let h=`<div class="cc"><h5>Final Assessment</h5>`;for(const a of asgn.documents){let sn=a.studentId;try{const su=await databases.getDocument(DATABASE_ID,COL.USERS,a.studentId);sn=su.fullName}catch(e){}const ex=await databases.listDocuments(DATABASE_ID,COL.FA,[Appwrite.Query.equal('studentId',a.studentId),Appwrite.Query.limit(1)]);const has=ex.total>0;const statusLabel=has?(ex.documents[0].status==='pending_uni_approval'?'⏳ Pending Uni Approval':ex.documents[0].status==='submitted'?'✅ Approved':'📝 Submitted'):'Not assessed';h+=`<div class="border rounded p-2 mb-2"><strong>${sn}</strong> ${has?`Marks: ${ex.documents[0].marks}/100 (${statusLabel})`:'Pending'}<br>${has?`<button class="bxsw btn-sm" onclick="editFA('${ex.documents[0].$id}')">Edit</button>`:`<button class="bsc btn-sm" onclick="createFA('${a.studentId}')">Assess</button>`}</div>`}return h+'</div>'}catch(e){return'<div class="cc">Error</div>'}}if(currentUser.role==='university_supervisor'){try{const asgn=await databases.listDocuments(DATABASE_ID,COL.ASSIGNMENTS,[Appwrite.Query.equal('universitySupervisorId',currentUser.userId)]);let h=`<div class="cc"><h5>Assessments - Pending Approval</h5>`;let found=!1;for(const a of asgn.documents){const faDocs=await databases.listDocuments(DATABASE_ID,COL.FA,[Appwrite.Query.equal('studentId',a.studentId),Appwrite.Query.equal('status','pending_uni_approval'),Appwrite.Query.limit(1)]);if(faDocs.total>0){found=!0;const fa=faDocs.documents[0];let sn=a.studentId;try{const su=await databases.getDocument(DATABASE_ID,COL.USERS,a.studentId);sn=su.fullName}catch(e){}h+=`<div class="border rounded p-2 mb-2"><strong>${sn}</strong><br>Marks: ${fa.marks}/100<br>${fa.comments?`Comments: ${fa.comments}<br>`:''}<button class="bsc btn-sm" onclick="approveAssessment('${fa.$id}')">✅ Approve</button></div>`}}if(!found)h+='<p class="text-muted">No pending assessments</p>';return h+'</div>'}catch(e){return'<div class="cc">Error</div>'}}return'<div class="cc">Access denied</div>'}
async function createFA(sid){const r=await Swal.fire({title:'Final Assessment',html:`<input id="faMarks" class="form-control form-control-sm mb-2" type="number" min="0" max="100" placeholder="Marks"><textarea id="faComments" class="form-control form-control-sm mb-2" rows="3" placeholder="Comments"></textarea>`,showCancelButton:!0,confirmButtonText:'Submit',preConfirm:()=>{const m=document.getElementById('faMarks')?.value;if(!m||m<0||m>100)return Swal.showValidationMessage('Marks required');return{marks:parseInt(m),comments:document.getElementById('faComments')?.value||''}}});if(!r)return;try{const now=new Date().toISOString();await databases.createDocument(DATABASE_ID,COL.FA,Appwrite.ID.unique(),{studentId:sid,fieldSupervisorId:currentUser.userId,marks:r.value.marks,comments:r.value.comments,status:'pending_uni_approval',createdAt:now,updatedAt:now});try{const asgn=await databases.listDocuments(DATABASE_ID,COL.ASSIGNMENTS,[Appwrite.Query.equal('studentId',sid),Appwrite.Query.equal('status','active'),Appwrite.Query.limit(1)]);if(asgn.total>0&&asgn.documents[0].universitySupervisorId){const stu=await databases.getDocument(DATABASE_ID,COL.USERS,sid);await cn(asgn.documents[0].universitySupervisorId,'📝 Assessment Pending',`Field Supervisor assessed ${stu.fullName}: ${r.value.marks}/100`)}}catch(e){}st('Assessment submitted! Sent to University Supervisor');lp('final_assessment')}catch(e){se(e)}}
async function editFA(fid){const fa=await databases.getDocument(DATABASE_ID,COL.FA,fid);const r=await Swal.fire({title:'Edit',html:`<input id="faMarks" class="form-control form-control-sm mb-2" type="number" value="${fa.marks}"><textarea id="faComments" class="form-control form-control-sm mb-2" rows="3">${fa.comments||''}</textarea>`,showCancelButton:!0,confirmButtonText:'Update',preConfirm:()=>{const m=document.getElementById('faMarks')?.value;if(!m||m<0||m>100)return Swal.showValidationMessage('Marks required');return{marks:parseInt(m),comments:document.getElementById('faComments')?.value||''}}});if(!r)return;try{const now=new Date().toISOString();await databases.updateDocument(DATABASE_ID,COL.FA,fid,{marks:r.value.marks,comments:r.value.comments,status:'pending_uni_approval',updatedAt:now});st('Updated!');lp('final_assessment')}catch(e){se(e)}}
async function approveAssessment(fid){const r=await Swal.fire({title:'Approve Assessment?',text:'Student will see this',icon:'question',showCancelButton:!0,confirmButtonColor:'#10b981',confirmButtonText:'Approve'});if(!r.isConfirmed)return;try{const now=new Date().toISOString();await databases.updateDocument(DATABASE_ID,COL.FA,fid,{status:'submitted',universitySupervisorId:currentUser.userId,updatedAt:now});const fa=await databases.getDocument(DATABASE_ID,COL.FA,fid);await cn(fa.studentId,'🎉 Assessment Approved!',`Your final assessment: ${fa.marks}/100`);st('Approved! Student can now see it');lp('final_assessment')}catch(e){se(e)}}
async function rcr(){try{const logs=await databases.listDocuments(DATABASE_ID,COL.LOGBOOKS,[Appwrite.Query.equal('studentId',currentUser.userId),Appwrite.Query.orderAsc('weekNumber'),Appwrite.Query.limit(52)]);const faDocs=await databases.listDocuments(DATABASE_ID,COL.FA,[Appwrite.Query.equal('studentId',currentUser.userId),Appwrite.Query.limit(1)]);const tw=logs.total,aw=logs.documents.filter(l=>l.status==='approved').length,pw=logs.documents.filter(l=>l.status==='submitted_to_field'||l.status==='reviewed_by_field').length,rw=logs.documents.filter(l=>l.status==='rejected').length;const marks=faDocs.total>0?faDocs.documents[0].marks:'N/A';const aStatus=faDocs.total>0?faDocs.documents[0].status:'none';let h=`<div class="cc"><h5>📊 Comprehensive Report</h5><div class="sg"><div class="sc"><h2>${tw}</h2><p>Total Weeks</p></div><div class="sc"><h2 style="color:#10b981">${aw}</h2><p>Approved</p></div><div class="sc"><h2 style="color:#f59e0b">${pw}</h2><p>Pending</p></div><div class="sc"><h2 style="color:#ef4444">${rw}</h2><p>Rejected</p></div></div><div class="sg"><div class="sc"><h2 style="color:#f59e0b">${marks}</h2><p>Marks/100</p></div><div class="sc"><h2 style="color:#6366f1">${aStatus==='submitted'?'✅':'⏳'}</h2><p>Assessment</p></div></div><h6 class="mt-3">📅 Weekly Activities</h6>`;if(logs.total===0){h+=`<p class="text-muted small">No logbooks submitted yet</p>`}else{logs.documents.forEach(log=>{const sc={submitted_to_field:'warning',reviewed_by_field:'info',approved:'success',rejected:'danger'};let att='';try{if(log.attachments){const a=JSON.parse(log.attachments);att=`<br><small class="text-primary">📎 <a href="${log.fileUrl?'https://fra.cloud.appwrite.io/v1/storage/buckets/'+log.fileUrl+'/view?project=6a21b1440038c361fabb':'#'}" target="_blank">${a.name}</a></small>`}}catch(e){}h+=`<div class="border rounded p-3 mb-2" style="border-left:3px solid ${log.status==='approved'?'#10b981':log.status==='rejected'?'#ef4444':'#f59e0b'}"><div class="d-flex justify-content-between"><strong>Week ${log.weekNumber}</strong><span class="badge bg-${sc[log.status]||'secondary'} bst">${log.status}</span></div>${att}${log.recommendations?`<p class="small mt-2 mb-0"><strong>📝 Summary:</strong> ${log.recommendations}</p>`:''}<details class="mt-2"><summary class="small text-muted cursor-pointer">📋 View Daily Activities</summary><pre style="font-size:.75rem;background:#f8fafc;padding:.5rem;border-radius:4px;margin-top:.3rem;white-space:pre-wrap">${log.activities||'No activities'}</pre></details><small class="text-muted">Submitted: ${log.submittedAt?new Date(log.submittedAt).toLocaleDateString():'N/A'}</small></div>`})}if(faDocs.total>0){const fa=faDocs.documents[0];h+=`<h6 class="mt-3">⭐ Final Assessment</h6><div class="border rounded p-3 mb-2" style="border-left:3px solid #8b5cf6"><strong>Marks: ${fa.marks}/100</strong><p class="small mb-0">${fa.comments||'No comments'}</p><small class="text-muted">Status: ${fa.status==='submitted'?'Approved':'Pending Approval'}</small></div>`}h+=`<button class="bsc mt-2" onclick="exportComprehensivePDF()"><i class="bi bi-file-pdf"></i> Export PDF</button><button class="bsc-outline mt-2" onclick="exportComprehensiveCSV()"><i class="bi bi-file-spreadsheet"></i> Export CSV</button></div>`;return h}catch(e){return'<div class="cc">Error</div>'}}
async function exportComprehensivePDF(){try{const logs=await databases.listDocuments(DATABASE_ID,COL.LOGBOOKS,[Appwrite.Query.equal('studentId',currentUser.userId),Appwrite.Query.orderAsc('weekNumber'),Appwrite.Query.limit(52)]);const faDocs=await databases.listDocuments(DATABASE_ID,COL.FA,[Appwrite.Query.equal('studentId',currentUser.userId),Appwrite.Query.limit(1)]);const{jsPDF}=window.jspdf;const doc=new jsPDF();let y=15;doc.setFontSize(16);doc.text('BEHSIT FIELD SYSTEM',20,y);y+=8;doc.setFontSize(12);doc.text('Comprehensive Report',20,y);y+=10;doc.setFontSize(9);doc.text(`Student: ${currentUser.fullName}`,20,y);y+=5;doc.text(`Email: ${currentUser.email}`,20,y);y+=5;if(currentUser.institution)doc.text(`Institution: ${currentUser.institution}`,20,y);y+=5;doc.text(`Date: ${new Date().toLocaleDateString()}`,20,y);y+=8;doc.setFontSize(11);doc.text('WEEKLY ACTIVITIES',20,y);y+=7;logs.documents.forEach(log=>{if(y>260){doc.addPage();y=15}doc.setFontSize(9);doc.text(`Week ${log.weekNumber} - ${log.status}`,22,y);y+=5;if(log.recommendations){doc.setFontSize(8);doc.text(`Summary: ${log.recommendations.substring(0,100)}`,24,y);y+=4}doc.setFontSize(7);const acts=(log.activities||'').split('\n').slice(0,5).join(' | ');doc.text(`Activities: ${acts.substring(0,120)}`,24,y);y+=6});if(faDocs.total>0){y+=3;const fa=faDocs.documents[0];doc.setFontSize(11);doc.text(`FINAL MARKS: ${fa.marks}/100`,20,y);y+=6;doc.setFontSize(9);doc.text(`Comments: ${fa.comments||'N/A'}`,22,y)}doc.save(`${currentUser.fullName}_Full_Report.pdf`);st('Full report exported!')}catch(e){se(e)}}
async function exportComprehensiveCSV(){try{const logs=await databases.listDocuments(DATABASE_ID,COL.LOGBOOKS,[Appwrite.Query.equal('studentId',currentUser.userId),Appwrite.Query.orderAsc('weekNumber'),Appwrite.Query.limit(52)]);let csv='Week,Status,Summary,Activities,Submitted Date\n';logs.documents.forEach(log=>{csv+=`${log.weekNumber},${log.status},"${(log.recommendations||'').replace(/"/g,'""').substring(0,100)}","${(log.activities||'').replace(/"/g,'""').substring(0,100)}",${log.submittedAt||''}\n`});const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${currentUser.fullName}_Full_Report.csv`;a.click();st('CSV exported!')}catch(e){se(e)}}
function rs(){return`<div class="cc"><h5>Search</h5><div class="search-box"><i class="bi bi-search"></i><input id="searchInput" class="fc" placeholder="Search..." onkeyup="if(event.key==='Enter')performSearch()"></div><select id="searchType" class="fc mb-2" style="width:auto"><option value="all">All</option><option value="logbooks">Logbooks</option><option value="pt">PT Checklist</option><option value="students">People</option></select><button class="bsc btn-sm" onclick="performSearch()">Search</button><div id="searchResults"></div></div>`}
async function performSearch(){const q=document.getElementById('searchInput')?.value?.trim()?.toLowerCase();const type=document.getElementById('searchType')?.value||'all';if(!q||q.length<2)return st('Enter 2+ chars','warning');sl();let results=[];try{if(type==='all'||type==='logbooks'){const logs=await databases.listDocuments(DATABASE_ID,COL.LOGBOOKS,[Appwrite.Query.limit(200)]);for(const l of logs.documents){if((l.activities||'').toLowerCase().includes(q)||(l.recommendations||'').toLowerCase().includes(q)){let sn=l.studentId;try{const su=await databases.getDocument(DATABASE_ID,COL.USERS,l.studentId);sn=su.fullName}catch(e){}results.push({type:'📝 Logbook',title:`Week ${l.weekNumber} - ${sn}`,detail:(l.activities||'').substring(0,80)})}}}if(type==='all'||type==='pt'){const pts=await databases.listDocuments(DATABASE_ID,COL.PT,[Appwrite.Query.limit(200)]);for(const p of pts.documents){if((p.activityName||'').toLowerCase().includes(q)){let sn=p.studentId;try{const su=await databases.getDocument(DATABASE_ID,COL.USERS,p.studentId);sn=su.fullName}catch(e){}results.push({type:'✓ PT',title:p.activityName,detail:`Student: ${sn}`})}}}if(type==='all'||type==='students'){const users=await databases.listDocuments(DATABASE_ID,COL.USERS,[Appwrite.Query.limit(100)]);for(const u of users.documents){if((u.fullName||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q))results.push({type:'👤 Person',title:u.fullName,detail:`${u.email} | ${u.role}`})}}hl();let html=results.length===0?'<p class="text-muted text-center py-3">No results</p>':`<p class="small">Found: ${results.slice(0,30).length}</p>`+results.slice(0,30).map(r=>`<div class="border rounded p-2 mb-1 small"><strong>${r.type}:</strong> ${r.title}<br><span class="text-muted">${r.detail||''}</span></div>`).join('');document.getElementById('searchResults').innerHTML=html}catch(e){hl();se(e)}}
async function ru(){try{const users=await databases.listDocuments(DATABASE_ID,COL.USERS,[Appwrite.Query.limit(200)]);let h=`<div class="cc"><h5>Users (${users.total})</h5><div class="table-responsive"><table class="table table-sm small"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Region</th><th>Actions</th></tr></thead><tbody>`;for(const u of users.documents){h+=`<tr><td>${u.fullName}</td><td>${u.email}</td><td>${u.role}</td><td>${u.region||'-'}</td><td><div class="d-flex gap-1">${u.supervisorsStatus==='pending'?`<button class="bsc btn-sm" onclick="approveSupervisors('${u.$id}')">Approve</button>`:''}<button class="bxsw btn-sm" onclick="editUser('${u.$id}')"><i class="bi bi-pencil"></i></button><button class="bxsd btn-sm" onclick="deleteUser('${u.$id}')"><i class="bi bi-trash"></i></button></div></td></tr>`}return h+'</tbody></table></div></div>'}catch(e){return'<div class="cc">Error</div>'}}
async function approveSupervisors(uid){const r=await Swal.fire({title:'Approve?',icon:'question',showCancelButton:!0,confirmButtonColor:'#10b981'});if(!r.isConfirmed)return;try{sl();const now=new Date().toISOString();await databases.updateDocument(DATABASE_ID,COL.USERS,uid,{supervisorsStatus:APPROVAL_STATUS.APPROVED,updatedAt:now});const result=await activateAssignmentAfterApproval(uid);if(result.success)await cn(uid,'✅ Active','Supervisors approved!');hl();st('Approved!');lp('users')}catch(e){se(e)}}
async function editUser(uid){try{const user=await databases.getDocument(DATABASE_ID,COL.USERS,uid);let rOpts='<option value="">Select</option>';Object.keys(TZ_REGIONS).sort().forEach(r=>{rOpts+=`<option value="${r}" ${user.region===r?'selected':''}>${r}</option>`});const{value}=await Swal.fire({title:'Edit User',html:`<input id="euName" class="form-control form-control-sm mb-2" value="${user.fullName||''}" placeholder="Name"><input id="euEmail" class="form-control form-control-sm mb-2" value="${user.email||''}" placeholder="Email"><select id="euRole" class="form-control form-control-sm mb-2"><option value="student" ${user.role==='student'?'selected':''}>Student</option><option value="field_supervisor" ${user.role==='field_supervisor'?'selected':''}>Field Sup</option><option value="university_supervisor" ${user.role==='university_supervisor'?'selected':''}>Uni Sup</option><option value="admin" ${user.role==='admin'?'selected':''}>Admin</option></select><select id="euRegion" class="form-control form-control-sm mb-2">${rOpts}</select>`,showCancelButton:!0,confirmButtonText:'Update',preConfirm:()=>({fullName:document.getElementById('euName').value,email:document.getElementById('euEmail').value,role:document.getElementById('euRole').value,region:document.getElementById('euRegion').value})});if(!value)return;try{sl();const now=new Date().toISOString();await databases.updateDocument(DATABASE_ID,COL.USERS,uid,{...value,updatedAt:now});hl();st('Updated!');lp('users')}catch(e){se(e)}}catch(e){se(e)}}
async function deleteUser(uid){try{const user=await databases.getDocument(DATABASE_ID,COL.USERS,uid);const r=await Swal.fire({title:`Delete ${user.fullName}?`,text:'All data deleted!',icon:'warning',showCancelButton:!0,confirmButtonColor:'#ef4444'});if(!r.isConfirmed)return;sl();try{const lbs=await databases.listDocuments(DATABASE_ID,COL.LOGBOOKS,[Appwrite.Query.equal('studentId',uid),Appwrite.Query.limit(200)]);for(const l of lbs.documents)try{await databases.deleteDocument(DATABASE_ID,COL.LOGBOOKS,l.$id)}catch(e){}const pts=await databases.listDocuments(DATABASE_ID,COL.PT,[Appwrite.Query.equal('studentId',uid),Appwrite.Query.limit(200)]);for(const p of pts.documents)try{await databases.deleteDocument(DATABASE_ID,COL.PT,p.$id)}catch(e){}const fas=await databases.listDocuments(DATABASE_ID,COL.FA,[Appwrite.Query.equal('studentId',uid),Appwrite.Query.limit(10)]);for(const f of fas.documents)try{await databases.deleteDocument(DATABASE_ID,COL.FA,f.$id)}catch(e){}await databases.deleteDocument(DATABASE_ID,COL.USERS,uid)}catch(e){}hl();st('User deleted!');lp('users')}catch(e){se(e)}}
async function ral(){try{const logs=await databases.listDocuments(DATABASE_ID,COL.LOGBOOKS,[Appwrite.Query.limit(50)]);let h=`<div class="cc"><h5>All Logbooks</h5>`;for(const l of logs.documents){let sn=l.studentId;try{const su=await databases.getDocument(DATABASE_ID,COL.USERS,l.studentId);sn=su.fullName}catch(e){}h+=`<div class="border rounded p-2 mb-1 small">Week ${l.weekNumber} | ${sn} | ${l.status}</div>`}return h+'</div>'}catch(e){return'<div class="cc">Error</div>'}}
async function ra(){try{const as=await databases.listDocuments(DATABASE_ID,COL.ASSIGNMENTS,[Appwrite.Query.limit(100)]);let h=`<div class="cc"><h5>Assignments</h5><button class="bsc btn-sm mb-2" onclick="caa()">New</button>`;for(const a of as.documents){let sn=a.studentId;try{const su=await databases.getDocument(DATABASE_ID,COL.USERS,a.studentId);sn=su.fullName}catch(e){}h+=`<div class="border rounded p-2 mb-1 small">${sn} | ${a.status}</div>`}return h+'</div>'}catch(e){return'<div class="cc">Error</div>'}}
async function caa(){try{const users=await databases.listDocuments(DATABASE_ID,COL.USERS,[Appwrite.Query.limit(200)]);const sts=users.documents.filter(u=>u.role==='student'),fss=users.documents.filter(u=>u.role==='field_supervisor'),uss=users.documents.filter(u=>u.role==='university_supervisor');const{value}=await Swal.fire({title:'New Assignment',html:`<select id="as" class="form-control form-control-sm mb-2">${sts.map(s=>`<option value="${s.userId}">${s.fullName}</option>`).join('')}</select><select id="afs" class="form-control form-control-sm mb-2">${fss.map(s=>`<option value="${s.userId}">${s.fullName}</option>`).join('')}</select><select id="aus" class="form-control form-control-sm mb-2">${uss.map(s=>`<option value="${s.userId}">${s.fullName}</option>`).join('')}</select>`,showCancelButton:!0,confirmButtonText:'Assign',preConfirm:()=>({studentId:document.getElementById('as').value,fieldSupervisorId:document.getElementById('afs').value,universitySupervisorId:document.getElementById('aus').value})});if(value&&value.studentId){const now=new Date().toISOString();await databases.createDocument(DATABASE_ID,COL.ASSIGNMENTS,Appwrite.ID.unique(),{...value,status:'active',createdAt:now,updatedAt:now});st('Created!');lp('assignments')}}catch(e){se(e)}}
async function rn(){return`<div class="cc"><h5>Analytics</h5><canvas id="acv" height="80"></canvas></div>`}
async function rc(){try{const[u,l]=await Promise.all([databases.listDocuments(DATABASE_ID,COL.USERS),databases.listDocuments(DATABASE_ID,COL.LOGBOOKS)]);const ctx=document.getElementById('acv');if(!ctx)return;new Chart(ctx.getContext('2d'),{type:'doughnut',data:{labels:['Students','Supervisors','Pending','Approved'],datasets:[{data:[u.documents.filter(x=>x.role==='student').length,u.documents.filter(x=>x.role.includes('supervisor')).length,l.documents.filter(x=>x.status!=='approved'&&x.status!=='rejected').length,l.documents.filter(x=>x.status==='approved').length]}]}})}catch(e){}}
async function rbd(){try{const logs=await databases.listDocuments(DATABASE_ID,COL.LOGBOOKS,[Appwrite.Query.limit(50)]);let h=`<div class="cc"><h5>Bulk Delete</h5><button class="bxsd btn-sm mb-2" id="bulkDeleteBtn" disabled onclick="executeBulkDelete()">Delete (<span id="bulkCount">0</span>)</button>`;for(const l of logs.documents){let sn=l.studentId;try{const su=await databases.getDocument(DATABASE_ID,COL.USERS,l.studentId);sn=su.fullName}catch(e){}h+=`<div class="border rounded p-2 mb-1 small"><input type="checkbox" class="bulk-del" value="${l.$id}" onchange="updateBulkCount()"> Week ${l.weekNumber} | ${sn}</div>`}return h+'</div>'}catch(e){return'<div class="cc">Error</div>'}}
function updateBulkCount(){const c=document.querySelectorAll('.bulk-del:checked').length;document.getElementById('bulkCount').textContent=c;document.getElementById('bulkDeleteBtn').disabled=c===0}
async function executeBulkDelete(){const sel=Array.from(document.querySelectorAll('.bulk-del:checked')).map(cb=>cb.value);if(!sel.length)return;const r=await Swal.fire({title:`Delete ${sel.length}?`,icon:'warning',showCancelButton:!0,confirmButtonColor:'#ef4444'});if(!r.isConfirmed)return;sl();let d=0;for(const id of sel){try{await databases.deleteDocument(DATABASE_ID,COL.LOGBOOKS,id);d++}catch(e){}}hl();st(`${d} deleted!`);lp('bulk_delete')}
async function red(){return`<div class="cc"><h5>Export</h5><div class="d-grid gap-2"><button class="bsc" onclick="exportAllCSV('logbooks')">Logbooks (CSV)</button><button class="bsc" onclick="exportAllCSV('users')">Users (CSV)</button></div></div>`}
async function exportAllCSV(type){sl();try{let data=[],fn='export.csv';if(type==='logbooks'){const docs=await databases.listDocuments(DATABASE_ID,COL.LOGBOOKS,[Appwrite.Query.limit(500)]);data=docs.documents.map(d=>({Week:d.weekNumber,Student:d.studentId,Status:d.status}));fn='logbooks.csv'}else if(type==='users'){const docs=await databases.listDocuments(DATABASE_ID,COL.USERS,[Appwrite.Query.limit(500)]);data=docs.documents.map(d=>({Name:d.fullName,Email:d.email,Role:d.role}));fn='users.csv'}if(!data.length){hl();return st('No data','warning')}let csv=Object.keys(data[0]).join(',')+'\n';data.forEach(r=>{csv+=Object.values(r).map(v=>`"${String(v||'')}"`).join(',')+'\n'});const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click();hl();st('Exported!')}catch(e){hl();se(e)}}
async function rvs(){try{const users=await databases.listDocuments(DATABASE_ID,COL.USERS);const sups=users.documents.filter(u=>u.role==='field_supervisor'||u.role==='university_supervisor');if(!sups.length)return'<div class="cc"><h5>No supervisors</h5></div>';let h=`<div class="cc"><h5>Supervisors</h5>`;for(const s of sups)h+=`<div class="border rounded p-2 mb-1"><strong>${s.fullName}</strong> | ${s.role} | ${s.region||'-'}</div>`;return h+'</div>'}catch(e){return'<div class="cc">Error</div>'}}
document.addEventListener('DOMContentLoaded',()=>{AOS.init({duration:500,once:!0});populateRegions();document.getElementById('lb').addEventListener('click',function(){this.disabled=!0;login().finally(()=>{setTimeout(()=>this.disabled=!1,300)})});document.getElementById('rb').addEventListener('click',function(){this.disabled=!0;reg().finally(()=>{setTimeout(()=>this.disabled=!1,300)})});document.getElementById('srl').addEventListener('click',()=>{clearAllForms();document.getElementById('lf').style.display='none';document.getElementById('rf').style.display='block';populateRegions()});document.getElementById('btl').addEventListener('click',()=>{clearAllForms();document.getElementById('rf').style.display='none';document.getElementById('lf').style.display='block'});document.getElementById('menuLogout').addEventListener('click',logout);document.getElementById('hamburgerBtn').addEventListener('click',toggleSideMenu);document.getElementById('sideMenuOverlay').addEventListener('click',closeSideMenu);document.getElementById('menuDarkMode').addEventListener('click',()=>{document.body.classList.toggle('dark-mode');closeSideMenu()});document.getElementById('menuContact').addEventListener('click',showContact);document.querySelectorAll('.side-menu-item[data-action]').forEach(item=>{item.addEventListener('click',function(){lp(this.dataset.action)})});document.addEventListener('click',e=>{const p=document.getElementById('notifPopup'),b=document.getElementById('notifBell');if(p&&b&&!p.contains(e.target)&&!b.contains(e.target))p.classList.remove('show')});cs()});
window.lp=lp;window.clb=clb;window.rvl=rvl;window.vl=vl;window.ep=ep;window.caa=caa;window.deleteLogbook=deleteLogbook;window.toggleNotifPopup=toggleNotifPopup;window.clearStudentSig=clearStudentSig;window.clearReviewSig=clearReviewSig;window.createFA=createFA;window.editFA=editFA;window.approveAssessment=approveAssessment;window.editMyProfile=editMyProfile;window.approveSupervisors=approveSupervisors;window.editUser=editUser;window.deleteUser=deleteUser;window.performSearch=performSearch;window.executeBulkDelete=executeBulkDelete;window.updateBulkCount=updateBulkCount;window.exportAllCSV=exportAllCSV;window.exportComprehensivePDF=exportComprehensivePDF;window.exportComprehensiveCSV=exportComprehensiveCSV;window.updateDistricts=updateDistricts;window.populateRegions=populateRegions;window.rfa=rfa;window.rprofile=rprofile;window.rs=rs;window.rbd=rbd;window.red=red;window.rcr=rcr;window.raction=raction;window.togglePassword=togglePassword;window.checkAndShowActionPopup=checkAndShowActionPopup;
