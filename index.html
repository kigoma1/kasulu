<!DOCTYPE html>
<html lang="sw" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>VACCINATION SYSTEM</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-gradient: linear-gradient(135deg, #2563eb, #3b82f6, #6366f1);
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --info: #06b6d4;
            --info-light: #cffafe;
            --bg: #f0f4f8;
            --bg-secondary: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            --transition: 0.25s ease;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --banner-bg: #fef3c7;
            --banner-text: #92400e;
            --banner-border: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #0a0f1e;
            --bg-secondary: #111827;
            --surface: #1a2332;
            --surface-hover: #243044;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #2d3a4a;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow: 0 4px 8px rgba(0,0,0,0.4);
            --shadow-md: 0 8px 16px rgba(0,0,0,0.5);
            --primary-light: #1e3a5f;
            --success-light: #064e3b;
            --warning-light: #78350f;
            --danger-light: #7f1d1d;
            --info-light: #164e63;
            --banner-bg: #78350f;
            --banner-text: #fef3c7;
            --banner-border: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--text-secondary); border-radius: 10px; }

        /* TOP BAR - INAONEKANA TU KWENYE APP */
        .top-bar-container {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: var(--surface);
        }

        /* BANNER */
        .announcement-banner-wrapper {
            background: var(--banner-bg);
            overflow: hidden;
            height: 44px;
            display: none;
            align-items: center;
            border-bottom: 2px solid var(--banner-border);
        }
        .announcement-banner-wrapper.visible { display: flex; }
        .announcement-banner {
            color: var(--banner-text);
            padding: 0 16px;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .banner-scroll-container { overflow: hidden; flex: 1; display: flex; align-items: center; }
        .banner-scroll-text {
            white-space: nowrap;
            animation: scrollBanner 15s linear infinite;
            padding-left: 100%;
            font-weight: 600;
        }
        @keyframes scrollBanner {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        .banner-close {
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--banner-text);
            font-weight: bold;
            padding: 4px 10px;
            margin-left: 8px;
            font-size: 1.1rem;
        }

        /* HEADER */
        .app-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .app-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
        }
        .header-actions { display: flex; align-items: center; gap: 10px; }

        .theme-toggle-btn {
            width: 44px;
            height: 26px;
            border-radius: 30px;
            background: var(--border);
            border: none;
            cursor: pointer;
            position: relative;
        }
        .toggle-circle {
            position: absolute;
            top: 2px; left: 2px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--surface);
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }
        [data-theme="dark"] .theme-toggle-btn { background: var(--primary); }
        [data-theme="dark"] .toggle-circle { left: 20px; }

        /* NAVIGATION */
        .nav-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 6px 24px;
        }
        .nav-container { display: flex; gap: 4px; flex-wrap: wrap; }
        .nav-link {
            padding: 8px 16px;
            border-radius: 30px;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
        }
        .nav-link:hover { background: var(--bg-secondary); color: var(--text); }
        .nav-link.active { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

        /* MAIN CONTENT */
        .main-content { padding-top: 104px; }
        .main-content.has-banner { padding-top: 148px; }

        /* LOADING */
        .loading-screen {
            position: fixed; inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-screen.hidden { display: none; }
        .loader-ring {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* TOAST */
        .toast-container {
            position: fixed;
            top: 24px; right: 24px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
        }
        .toast {
            padding: 14px 18px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn 0.4s ease;
            font-weight: 500;
            font-size: 0.9rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }
        .toast.success { background: rgba(16,185,129,0.15); color: #065f46; border-left: 4px solid #10b981; }
        .toast.error { background: rgba(239,68,68,0.15); color: #991b1b; border-left: 4px solid #ef4444; }
        .toast.warning { background: rgba(245,158,11,0.15); color: #92400e; border-left: 4px solid #f59e0b; }
        .toast.info { background: rgba(6,182,212,0.15); color: #155e75; border-left: 4px solid #06b6d4; }
        [data-theme="dark"] .toast.success { color: #6ee7b7; }
        [data-theme="dark"] .toast.error { color: #fca5a5; }
        [data-theme="dark"] .toast.warning { color: #fcd34d; }
        [data-theme="dark"] .toast.info { color: #67e8f9; }
        @keyframes toastIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-close {
            background: none;
            border: none;
            cursor: pointer;
            color: inherit;
            opacity: 0.5;
            font-size: 1rem;
            padding: 4px;
        }

        /* BUTTONS */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary-gradient); color: white; }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary { background: var(--surface); color: var(--text); border: 2px solid var(--border); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; border-radius: 20px; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }

        /* FORMS */
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; color: var(--text-secondary); }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            background: var(--bg-secondary);
            color: var(--text);
            font-family: var(--font);
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.08);
            background: var(--surface);
        }

        /* CARDS */
        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: var(--transition);
        }
        .stat-card:hover { transform: translateY(-2px); border-color: var(--primary); }
        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }
        .stat-value { font-size: 2rem; font-weight: 800; }
        .stat-label { font-size: 0.8rem; color: var(--text-secondary); }

        /* TABLES */
        .table-container {
            overflow-x: auto;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
        }
        table { width: 100%; border-collapse: collapse; background: var(--surface); }
        th {
            background: var(--bg-secondary);
            padding: 14px 16px;
            text-align: left;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            border-bottom: 2px solid var(--border);
        }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        tbody tr:hover { background: var(--bg-secondary); }

        /* BADGES */
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-success { background: var(--success-light); color: #065f46; }
        .badge-danger { background: var(--danger-light); color: #991b1b; }
        .badge-warning { background: var(--warning-light); color: #92400e; }
        .badge-info { background: var(--info-light); color: #155e75; }
        .badge-primary { background: var(--primary-light); color: var(--primary); }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(4px);
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 30px;
            max-width: 580px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 { font-size: 1.3rem; font-weight: 700; }
        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn:hover { background: var(--danger); color: white; border-color: var(--danger); }

        /* TABS */
        .tabs {
            display: flex;
            gap: 6px;
            background: var(--bg-secondary);
            padding: 6px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .tab {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            background: transparent;
            color: var(--text-secondary);
        }
        .tab.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow); }

        /* MISC */
        .search-box { display: flex; gap: 10px; margin-bottom: 16px; }
        .search-box .form-input { flex: 1; min-width: 200px; border-radius: 30px; }
        .welcome-section {
            background: var(--primary-gradient);
            color: white;
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            margin-bottom: 24px;
        }
        .welcome-section h2 { font-size: 1.4rem; }
        .page-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 20px; }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 20px;
        }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .empty-icon { font-size: 3.5rem; margin-bottom: 12px; }
        .error-box {
            background: var(--danger-light);
            color: #991b1b;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            margin-bottom: 18px;
            border: 1px solid var(--danger);
        }
        .success-box {
            background: var(--success-light);
            color: #065f46;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            margin-bottom: 18px;
            border: 1px solid var(--success);
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .stat-card { padding: 14px; }
            .stat-value { font-size: 1.5rem; }
            .app-header { padding: 0 14px; height: 52px; }
            .nav-bar { padding: 4px 14px; }
            .nav-link { padding: 6px 12px; font-size: 0.78rem; }
            .announcement-banner-wrapper { height: 38px; }
            .main-content { padding-top: 92px; }
            .main-content.has-banner { padding-top: 130px; }
        }
        @media (max-width: 480px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- LOADING -->
    <div class="loading-screen" id="loadingScreen">
        <div style="text-align:center;">
            <div class="loader-ring"></div>
            <p style="color:var(--text-secondary);">Inapakia mfumo...</p>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ==================== APP CONTAINER (INAONEKANA TU BAADA YA LOGIN) ==================== -->
    <div id="appContainer" style="display:none;">

        <!-- TOP BAR -->
        <div class="top-bar-container" id="topBarContainer">
            <!-- BANNER -->
            <div class="announcement-banner-wrapper" id="announcementBannerWrapper">
                <div class="announcement-banner">
                    <span style="margin-right:10px;">📢</span>
                    <div class="banner-scroll-container">
                        <span class="banner-scroll-text" id="bannerScrollText"></span>
                    </div>
                    <button class="banner-close" onclick="dismissBanner()">×</button>
                </div>
            </div>

            <!-- HEADER -->
            <header class="app-header">
                <div class="app-logo">
                    <div class="logo-icon">💉</div>
                    VACCINATION SYSTEM
                </div>
                <div class="header-actions">
                    <button class="theme-toggle-btn" onclick="toggleTheme()">
                        <span class="toggle-circle" id="toggleCircle">☀️</span>
                    </button>
                    <span id="userDisplayName" style="font-weight:600;font-size:0.9rem;"></span>
                    <button class="btn btn-sm btn-outline" onclick="logout()">🚪 Toka</button>
                </div>
            </header>

            <!-- NAVIGATION -->
            <div class="nav-bar">
                <nav class="nav-container" id="mainNav">
                    <a class="nav-link active" data-page="dashboard">📊 Dashboard</a>
                    <a class="nav-link" data-page="children">👶 Watoto</a>
                    <a class="nav-link" data-page="vaccinations">💉 Chanjo</a>
                    <a class="nav-link" data-page="schedule">📅 Ratiba</a>
                    <a class="nav-link" data-page="reports">📈 Ripoti</a>
                    <a class="nav-link admin-only" data-page="admin" style="display:none;">🛡️ Admin</a>
                </nav>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content" id="mainContent">
            <div style="padding:24px;max-width:1400px;margin:0 auto;" id="pageContent"></div>
        </div>
    </div>

    <!-- ==================== AUTH CONTAINER (INAONEKANA MWANZO) ==================== -->
    <div id="authContainer" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);">
        <div class="card" style="max-width:480px;width:100%;padding:36px 28px;">
            <div id="statusMessage"></div>
            
            <!-- LOGIN FORM -->
            <div id="loginForm">
                <div style="text-align:center;margin-bottom:28px;">
                    <div style="width:64px;height:64px;border-radius:var(--radius);background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 14px;color:white;">💉</div>
                    <h2 style="color:var(--text);">VACCINATION SYSTEM</h2>
                    <p style="color:var(--text-secondary);font-size:0.9rem;">Mfumo wa Kisasa wa Chanjo</p>
                </div>
                <div class="form-group"><label>📧 Email</label><input type="email" class="form-input" id="loginEmail" placeholder="example@email.com"></div>
                <div class="form-group"><label>🔐 Nywila</label><input type="password" class="form-input" id="loginPassword" placeholder="••••••••"></div>
                <button class="btn btn-primary" style="width:100%;padding:14px;" onclick="login()">🚀 Ingia</button>
                <div style="text-align:center;margin-top:18px;">
                    <p style="color:var(--text-secondary);font-size:0.85rem;">Huna akaunti? <a href="#" onclick="showAuthForm('register')" style="color:var(--primary);font-weight:700;">✨ Sajili hapa</a></p>
                </div>
            </div>

            <!-- REGISTER FORM -->
            <div id="registerForm" style="display:none;">
                <div style="text-align:center;margin-bottom:24px;">
                    <h2 style="color:var(--primary);">✨ Sajili Akaunti</h2>
                    <p style="color:var(--text-secondary);font-size:0.85rem;">Jaza taarifa za kituo cha afya</p>
                </div>
                <div class="form-group"><label>👤 Jina Kamili *</label><input type="text" class="form-input" id="regFullName" placeholder="Jina lako kamili"></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div class="form-group"><label>⚧ Jinsia *</label><select class="form-select" id="regGender"><option value="">Chagua</option><option>Me</option><option>Ke</option></select></div>
                    <div class="form-group"><label>📱 Simu *</label><input type="tel" class="form-input" id="regPhone" placeholder="07XXXXXXXX"></div>
                </div>
                <div class="form-group"><label>📧 Email *</label><input type="email" class="form-input" id="regEmail" placeholder="example@email.com"></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div class="form-group"><label>📍 Mkoa *</label><input type="text" class="form-input" id="regRegion" placeholder="Mkoa"></div>
                    <div class="form-group"><label>📍 Wilaya *</label><input type="text" class="form-input" id="regDistrict" placeholder="Wilaya"></div>
                </div>
                <div class="form-group"><label>🏥 Kituo cha Afya *</label><input type="text" class="form-input" id="regFacility" placeholder="Jina la kituo"></div>
                <div class="form-group"><label>🔐 Nywila * (8+ herufi)</label><input type="password" class="form-input" id="regPassword" placeholder="••••••••"></div>
                <button class="btn btn-primary" style="width:100%;padding:14px;" onclick="register()">✨ Sajili</button>
                <div style="text-align:center;margin-top:18px;">
                    <p style="color:var(--text-secondary);font-size:0.85rem;">Tayari una akaunti? <a href="#" onclick="showAuthForm('login')" style="color:var(--primary);font-weight:700;">🚀 Ingia</a></p>
                </div>
            </div>
        </div>
    </div>

<script>
const A={endpoint:'https://fra.cloud.appwrite.io/v1',projectId:'6a21b1440038c361fabb',databaseId:'6a21b1f8000e608360bb',collections:{users:'users',children:'children',vaccinations:'vaccinations',systemSettings:'system_settings',announcements:'announcements'}};
const {Client,Account,Databases,ID,Query}=Appwrite;
const client=new Client().setEndpoint(A.endpoint).setProject(A.projectId);
const account=new Account(client),databases=new Databases(client);
let currentUser=null,isAdmin=false,activeAnnouncement=null;
const VACCINES=['BCG','OPV','Pentavalent','PCV','Rotavirus','IPV','Measles','Rubella','Vitamin A'];

// ==================== THEME ====================
function toggleTheme(){const h=document.documentElement,t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);document.getElementById('toggleCircle').textContent=t==='dark'?'🌙':'☀️';}
function initTheme(){const t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);document.getElementById('toggleCircle').textContent=t==='dark'?'🌙':'☀️';}

// ==================== BANNER ====================
async function loadAnnouncement(){try{const d=await databases.listDocuments(A.databaseId,A.collections.announcements,[Query.equal('isActive',true),Query.orderDesc('$createdAt'),Query.limit(1)]);if(d.documents.length>0){activeAnnouncement=d.documents[0];showBanner(activeAnnouncement.message);}else{hideBanner();}}catch(e){hideBanner();}}
function showBanner(m){const w=document.getElementById('announcementBannerWrapper'),t=document.getElementById('bannerScrollText'),mc=document.getElementById('mainContent');if(w&&t&&m){t.textContent=m;w.classList.add('visible');if(mc)mc.classList.add('has-banner');}}
function hideBanner(){const w=document.getElementById('announcementBannerWrapper'),mc=document.getElementById('mainContent');if(w)w.classList.remove('visible');if(mc)mc.classList.remove('has-banner');activeAnnouncement=null;}
function dismissBanner(){hideBanner();}
async function saveAnnouncement(msg){try{try{const d=await databases.listDocuments(A.databaseId,A.collections.announcements,[Query.equal('isActive',true)]);for(const x of d.documents)await databases.updateDocument(A.databaseId,A.collections.announcements,x.$id,{isActive:false});}catch(e){}const n=await databases.createDocument(A.databaseId,A.collections.announcements,ID.unique(),{announcementId:ID.unique(),message:msg,isActive:true,createdBy:currentUser.userId,createdAt:new Date().toISOString()});activeAnnouncement=n;showBanner(msg);return true;}catch(e){return false;}}

// ==================== UTILS ====================
function showToast(msg,type){type=type||'info';const icons={success:'✓',error:'✗',warning:'⚠',info:'ℹ'};const c=document.getElementById('toastContainer'),t=document.createElement('div');t.className='toast '+type;t.innerHTML='<span style="font-size:1.3rem;">'+(icons[type]||icons.info)+'</span><span style="flex:1;">'+escapeHtml(msg)+'</span><button class="toast-close" onclick="this.parentElement.remove()">×</button>';c.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(120%)';t.style.transition='0.3s';setTimeout(function(){t.remove();},300);},5000);}
function showLoading(s){document.getElementById('loadingScreen').classList.toggle('hidden',!s);}
function escapeHtml(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function formatDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('sw-TZ',{year:'numeric',month:'short',day:'numeric'});}
function getDaysRemaining(d){if(!d)return null;return Math.ceil((new Date(d)-new Date())/(1000*60*60*24));}
function setStatus(msg,type){type=type||'error';var d=document.getElementById('statusMessage');if(msg)d.innerHTML='<div class="'+(type==='error'?'error-box':'success-box')+'">'+msg+'</div>';else d.innerHTML='';}

// ==================== AUTH ====================
function showAuthForm(f){
    document.getElementById('loginForm').style.display=f==='login'?'block':'none';
    document.getElementById('registerForm').style.display=f==='register'?'block':'none';
    setStatus('');
    if(f==='login')document.getElementById('loginPassword').value='';
    if(f==='register'){
        document.getElementById('regFullName').value='';document.getElementById('regGender').value='';
        document.getElementById('regPhone').value='';document.getElementById('regEmail').value='';
        document.getElementById('regRegion').value='';document.getElementById('regDistrict').value='';
        document.getElementById('regFacility').value='';document.getElementById('regPassword').value='';
    }
}

async function register(){
    var fn=document.getElementById('regFullName').value.trim(),g=document.getElementById('regGender').value,
    ph=document.getElementById('regPhone').value.trim(),em=document.getElementById('regEmail').value.trim(),
    r=document.getElementById('regRegion').value.trim(),d=document.getElementById('regDistrict').value.trim(),
    f=document.getElementById('regFacility').value.trim(),pw=document.getElementById('regPassword').value;
    setStatus('');
    if(!fn||!em||!pw||!ph||!r||!d||!f||!g){setStatus('⚠ Jaza taarifa zote zenye *','error');return;}
    if(pw.length<8){setStatus('⚠ Nywila iwe na angalau herufi 8','error');return;}
    setStatus('⏳ Inasajili...','success');showLoading(true);
    try{
        var ua=await account.create(ID.unique(),em,pw,fn);
        await databases.createDocument(A.databaseId,A.collections.users,ID.unique(),{userId:ua.$id,fullName:fn,gender:g,phone:ph,email:em,region:r,district:d,facility:f,role:'health_worker',status:'active',createdAt:new Date().toISOString()});
        await account.createEmailSession(em,pw);
        document.getElementById('regFullName').value='';document.getElementById('regGender').value='';
        document.getElementById('regPhone').value='';document.getElementById('regEmail').value='';
        document.getElementById('regRegion').value='';document.getElementById('regDistrict').value='';
        document.getElementById('regFacility').value='';document.getElementById('regPassword').value='';
        await loadUserAndEnter(ua.$id);
        showLoading(false);setStatus('');showToast('✓ Akaunti imesajiliwa!','success');
    }catch(e){showLoading(false);setStatus(e.message.includes('already exists')?'⚠ Email hii tayari imesajiliwa!':'✗ Imeshindwa: '+escapeHtml(e.message),'error');}
}

async function login(){
    var em=document.getElementById('loginEmail').value.trim(),pw=document.getElementById('loginPassword').value;
    setStatus('');
    if(!em||!pw){setStatus('⚠ Jaza email na nywila','error');return;}
    setStatus('⏳ Inakuingiza...','success');showLoading(true);
    try{
        await account.createEmailSession(em,pw);
        var ua=await account.get();
        await loadUserAndEnter(ua.$id);
        showLoading(false);setStatus('');showToast('✓ Umefanikiwa kuingia!','success');
    }catch(e){showLoading(false);setStatus(e.message.includes('Invalid credentials')?'✗ Email au Nywila si sahihi!':'✗ Imeshindwa: '+escapeHtml(e.message),'error');}
}

async function loadUserAndEnter(userId){
    var role='health_worker',userDoc;
    try{
        var ua=await account.get();
        try{var ud=await databases.listDocuments(A.databaseId,A.collections.users,[Query.equal('userId',userId)]);if(ud.documents.length>0){userDoc=ud.documents[0];role=userDoc.role||'health_worker';}}catch(e){}
        if(!userDoc){userDoc=await databases.createDocument(A.databaseId,A.collections.users,ID.unique(),{userId:userId,fullName:ua.name||'',email:ua.email||'',phone:'',gender:'',region:'',district:'',facility:'',role:'health_worker',status:'active',createdAt:new Date().toISOString()});}
    }catch(e){return;}
    currentUser=userDoc;isAdmin=(role==='admin');
    document.getElementById('userDisplayName').textContent=currentUser.fullName||currentUser.email||'Mtoa Huduma';
    
    // FICHA AUTH, ONYESHA APP
    document.getElementById('authContainer').style.display='none';
    document.getElementById('appContainer').style.display='block';
    
    if(isAdmin){
        var adminLinks=document.querySelectorAll('.admin-only');
        for(var i=0;i<adminLinks.length;i++){adminLinks[i].style.display='inline';}
    }
    await loadAnnouncement();
    navigateTo('dashboard');
}

async function logout(){
    try{await account.deleteSession('current');}catch(e){}
    currentUser=null;isAdmin=false;
    
    // FICHA APP, ONYESHA AUTH
    document.getElementById('appContainer').style.display='none';
    document.getElementById('authContainer').style.display='flex';
    
    var adminLinks=document.querySelectorAll('.admin-only');
    for(var i=0;i<adminLinks.length;i++){adminLinks[i].style.display='none';}
    hideBanner();
    document.getElementById('loginEmail').value='';document.getElementById('loginPassword').value='';
    setStatus('');showAuthForm('login');showToast('🚪 Umetoka kwenye mfumo.','info');
}

// ==================== NAVIGATION ====================
function navigateTo(page){
    var links=document.querySelectorAll('.nav-link');
    for(var i=0;i<links.length;i++){links[i].classList.toggle('active',links[i].dataset.page===page);}
    loadPage(page);
}

async function loadPage(page){
    var c=document.getElementById('pageContent');showLoading(true);
    try{
        if(page==='dashboard')c.innerHTML=await renderDashboard();
        else if(page==='children')c.innerHTML=await renderChildrenPage();
        else if(page==='vaccinations')c.innerHTML=await renderVaccinationsPage();
        else if(page==='schedule')c.innerHTML=await renderSchedulePage();
        else if(page==='reports')c.innerHTML=await renderReportsPage();
        else if(page==='admin')c.innerHTML=isAdmin?await renderAdminPage():'<div class="card empty-state"><div class="empty-icon">🛡️</div><h3>Hauna Ruhusa</h3></div>';
        var links=document.querySelectorAll('.nav-link');
        for(var i=0;i<links.length;i++){
            links[i].onclick=function(e){e.preventDefault();navigateTo(this.dataset.page);};
        }
    }catch(e){c.innerHTML='<div class="card empty-state"><div class="empty-icon">✗</div><h3>Imeshindwa</h3><p>'+escapeHtml(e.message)+'</p><button class="btn btn-primary" onclick="navigateTo(\'dashboard\')">Rudi Dashboard</button></div>';}
    showLoading(false);
}

// ==================== DASHBOARD ====================
async function renderDashboard(){
    if(!currentUser)return'<div class="card">Inapakia...</div>';
    var cd=await databases.listDocuments(A.databaseId,A.collections.children,[Query.equal('createdBy',currentUser.userId)]);
    var cids=cd.documents.map(function(c){return c.childId;}),av=[];
    for(var i=0;i<cids.length;i++){var v=await databases.listDocuments(A.databaseId,A.collections.vaccinations,[Query.equal('childId',cids[i]),Query.orderDesc('vaccinationDate')]);av=av.concat(v.documents);}
    var today=new Date().toISOString().split('T')[0];
    var tv=av.filter(function(v){return v.vaccinationDate===today;});
    var up=av.filter(function(v){return v.nextVaccinationDate&&v.nextVaccinationDate>today;});
    var od=av.filter(function(v){return v.nextVaccinationDate&&v.nextVaccinationDate<today;});
    window._dashData={children:cd.documents,allVax:av};

    var html='<div class="welcome-section"><h2>👋 Karibu, '+escapeHtml(currentUser.fullName||currentUser.email)+'!</h2><p>🏥 '+escapeHtml(currentUser.facility||'Kituo chako')+' • '+(currentUser.role==='admin'?'🛡️ Admin':'👨‍⚕️ Mtoa Huduma')+'</p></div>';
    
    html+='<div class="card" style="border:2px solid var(--primary);background:var(--primary-light);margin-bottom:24px;"><h3 style="color:var(--primary);">⚡ Rekodi Chanjo kwa Haraka</h3><div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;"><select class="form-select" id="quickChild" style="background:var(--surface);"><option value="">— Chagua Mtoto —</option>';
    for(var i=0;i<cd.documents.length;i++){html+='<option value="'+cd.documents[i].childId+'">'+escapeHtml(cd.documents[i].fullName)+'</option>';}
    html+='</select><select class="form-select" id="quickVaccine" style="background:var(--surface);"><option value="">— Chagua Chanjo —</option>';
    for(var i=0;i<VACCINES.length;i++){html+='<option value="'+VACCINES[i]+'">'+VACCINES[i]+'</option>';}
    html+='</select><input type="date" class="form-input" id="quickDate" value="'+today+'" style="background:var(--surface);"><button class="btn btn-primary" onclick="quickVaccinate()">⚡ Rekodi</button></div><div id="quickVaxResult" style="margin-top:10px;"></div></div>';

    html+='<div class="stats-grid">';
    html+='<div class="stat-card" onclick="navigateTo(\'children\')"><div class="stat-icon" style="background:var(--primary-light);color:var(--primary);">👶</div><div><div class="stat-value">'+cd.total+'</div><div class="stat-label">Watoto</div></div></div>';
    html+='<div class="stat-card" onclick="navigateTo(\'vaccinations\')"><div class="stat-icon" style="background:var(--success-light);color:var(--success);">💉</div><div><div class="stat-value">'+av.length+'</div><div class="stat-label">Chanjo</div></div></div>';
    html+='<div class="stat-card"><div class="stat-icon" style="background:var(--warning-light);color:var(--warning);">📅</div><div><div class="stat-value">'+tv.length+'</div><div class="stat-label">Leo</div></div></div>';
    html+='<div class="stat-card" onclick="navigateTo(\'schedule\')"><div class="stat-icon" style="background:var(--danger-light);color:var(--danger);">⚠</div><div><div class="stat-value">'+od.length+'</div><div class="stat-label">Zimechelewa</div></div></div>';
    html+='</div>';

    if(tv.length>0){
        html+='<div class="card" style="border-left:4px solid var(--success);"><h3 style="color:var(--success);">✓ Chanjo za Leo ('+tv.length+')</h3><div class="table-container"><table><thead><tr><th>👶 Mtoto</th><th>💉 Chanjo</th><th>📊 Dozi</th></tr></thead><tbody>';
        for(var i=0;i<tv.length;i++){var c=cd.documents.find(function(x){return x.childId===tv[i].childId;});html+='<tr><td><strong>'+escapeHtml(c?c.fullName:'?')+'</strong></td><td><span class="badge badge-success">'+tv[i].vaccineName+'</span></td><td>'+tv[i].dose+'</td></tr>';}
        html+='</tbody></table></div></div>';
    }

    if(od.length>0){
        html+='<div class="card" style="border-left:4px solid var(--danger);"><h3 style="color:var(--danger);">⚠ Zilizochelewa ('+od.length+')</h3><div class="table-container"><table><thead><tr><th>👶 Mtoto</th><th>💉 Chanjo</th><th>📅 Ilitakiwa</th><th>⏰ Siku</th></tr></thead><tbody>';
        for(var i=0;i<Math.min(od.length,5);i++){var c=cd.documents.find(function(x){return x.childId===od[i].childId;}),days=Math.abs(getDaysRemaining(od[i].nextVaccinationDate));html+='<tr><td><strong>'+escapeHtml(c?c.fullName:'?')+'</strong></td><td>'+od[i].vaccineName+' D'+od[i].dose+'</td><td>'+formatDate(od[i].nextVaccinationDate)+'</td><td><span class="badge badge-danger">'+days+'siku</span></td></tr>';}
        html+='</tbody></table></div></div>';
    }

    html+='<div class="card"><h3>📅 Chanjo Zinazofuata</h3><div class="table-container"><table><thead><tr><th>👶 Mtoto</th><th>💉 Chanjo</th><th>📅 Tarehe</th><th>⏰ Siku</th></tr></thead><tbody>';
    up.sort(function(a,b){return(a.nextVaccinationDate||'').localeCompare(b.nextVaccinationDate||'');});
    var showUp=up.slice(0,10);
    if(showUp.length>0){
        for(var i=0;i<showUp.length;i++){var c=cd.documents.find(function(x){return x.childId===showUp[i].childId;}),days=getDaysRemaining(showUp[i].nextVaccinationDate);html+='<tr><td><strong>'+escapeHtml(c?c.fullName:'?')+'</strong></td><td>'+showUp[i].vaccineName+' D'+showUp[i].dose+'</td><td>'+formatDate(showUp[i].nextVaccinationDate)+'</td><td><span class="badge '+(days<7?'badge-warning':'badge-info')+'">'+days+'siku</span></td></tr>';}
    }else{html+='<tr><td colspan="4"><div class="empty-state"><div class="empty-icon">✓</div><p>Hakuna chanjo zinazofuata</p></div></td></tr>';}
    html+='</tbody></table></div></div><div id="modalContainer"></div>';
    return html;
}

async function quickVaccinate(){
    var ci=document.getElementById('quickChild').value,vn=document.getElementById('quickVaccine').value,dt=document.getElementById('quickDate').value,rd=document.getElementById('quickVaxResult');
    if(!ci||!vn||!dt){rd.innerHTML='<p style="color:var(--danger);">⚠ Chagua mtoto, chanjo na tarehe.</p>';return;}
    rd.innerHTML='<p style="color:var(--primary);">⏳ Inarekodi...</p>';
    try{
        var n=new Date(dt),iv={BCG:0,OPV:28,Pentavalent:28,PCV:28,Rotavirus:28,IPV:28,Measles:0,Rubella:0,'Vitamin A':180};
        n.setDate(n.getDate()+(iv[vn]||28));var nd=iv[vn]===0?'':n.toISOString().split('T')[0];
        await databases.createDocument(A.databaseId,A.collections.vaccinations,ID.unique(),{vaccinationId:ID.unique(),childId:ci,vaccineName:vn,dose:1,vaccinationDate:dt,nextVaccinationDate:nd,providerId:currentUser.userId,notes:'',createdAt:new Date().toISOString()});
        rd.innerHTML='<p style="color:var(--success);">✓ Chanjo ya <strong>'+vn+'</strong> imerekodiwa!</p>';
        setTimeout(function(){navigateTo('dashboard');},1000);showToast('💉 Chanjo imerekodiwa!','success');
    }catch(e){rd.innerHTML='<p style="color:var(--danger);">✗ Imeshindwa: '+escapeHtml(e.message)+'</p>';}
}

// ==================== CHILDREN ====================
async function renderChildrenPage(){
    var d=await databases.listDocuments(A.databaseId,A.collections.children,[Query.equal('createdBy',currentUser.userId),Query.orderDesc('$createdAt')]);window._children=d.documents;
    var html='<div class="page-header"><h2 class="page-title">👶 Watoto ('+d.total+')</h2><button class="btn btn-primary" onclick="openChildModal()">+ Sajili Mtoto</button></div>';
    html+='<div class="search-box"><input type="text" class="form-input" id="childSearch" placeholder="🔍 Tafuta..." oninput="filterChildren()"></div>';
    html+='<div class="table-container card" style="padding:0;"><table><thead><tr><th>👶 Jina</th><th>⚧ Jinsia</th><th>👤 Mzazi</th><th>📱 Simu</th><th>🏥 Kituo</th><th>⚡ Vitendo</th></tr></thead><tbody id="childrenTable">';
    if(d.documents.length>0){
        for(var i=0;i<d.documents.length;i++){html+='<tr><td><strong>'+escapeHtml(d.documents[i].fullName)+'</strong></td><td>'+(d.documents[i].gender==='Me'?'👦 Me':'👧 Ke')+'</td><td>'+escapeHtml(d.documents[i].parentName)+'</td><td>'+escapeHtml(d.documents[i].parentPhone)+'</td><td>'+escapeHtml(d.documents[i].facility)+'</td><td><button class="btn btn-sm btn-primary" onclick="vaccinateChild(\''+d.documents[i].childId+'\')">💉 Chanjo</button></td></tr>';}
    }else{html+='<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📭</div><h3>Hakuna Watoto</h3></div></td></tr>';}
    html+='</tbody></table></div><div id="modalContainer"></div>';
    return html;
}

async function filterChildren(){
    var s=(document.getElementById('childSearch')?document.getElementById('childSearch').value:'').toLowerCase();
    var f=window._children.filter(function(c){return c.fullName.toLowerCase().includes(s)||c.parentPhone.includes(s)||c.parentName.toLowerCase().includes(s);});
    var html='';
    if(f.length>0){for(var i=0;i<f.length;i++){html+='<tr><td><strong>'+escapeHtml(f[i].fullName)+'</strong></td><td>'+(f[i].gender==='Me'?'👦 Me':'👧 Ke')+'</td><td>'+escapeHtml(f[i].parentName)+'</td><td>'+escapeHtml(f[i].parentPhone)+'</td><td>'+escapeHtml(f[i].facility)+'</td><td><button class="btn btn-sm btn-primary" onclick="vaccinateChild(\''+f[i].childId+'\')">💉 Chanjo</button></td></tr>';}}
    else{html='<tr><td colspan="6"><div class="empty-state"><h3>🔍 Hakuna matokeo</h3></div></td></tr>';}
    document.getElementById('childrenTable').innerHTML=html;
}

function openChildModal(){
    document.getElementById('modalContainer').innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-header"><h3>+ Sajili Mtoto</h3><button class="close-btn" onclick="closeModal()">×</button></div><div class="form-group"><label>👶 Jina Kamili *</label><input type="text" class="form-input" id="cfn" placeholder="Jina la mtoto"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><div class="form-group"><label>📅 Tarehe ya Kuzaliwa *</label><input type="date" class="form-input" id="cdob"></div><div class="form-group"><label>⚧ Jinsia *</label><select class="form-select" id="cgen"><option>Me</option><option>Ke</option></select></div></div><div class="form-group"><label>👤 Mzazi/Mlezi *</label><input type="text" class="form-input" id="cpn" placeholder="Jina la mzazi"></div><div class="form-group"><label>📱 Simu *</label><input type="tel" class="form-input" id="cph" placeholder="07XXXXXXXX"></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;"><div class="form-group"><label>📍 Mkoa</label><input type="text" class="form-input" id="creg" value="'+escapeHtml(currentUser.region||'')+'"></div><div class="form-group"><label>📍 Wilaya</label><input type="text" class="form-input" id="cdis" value="'+escapeHtml(currentUser.district||'')+'"></div><div class="form-group"><label>🏥 Kituo</label><input type="text" class="form-input" id="cfac" value="'+escapeHtml(currentUser.facility||'')+'"></div></div><button class="btn btn-primary" style="width:100%;padding:14px;" onclick="saveChild()">💾 Hifadhi</button></div></div>';
}
function closeModal(){document.getElementById('modalContainer').innerHTML='';}
async function saveChild(){
    var fn=document.getElementById('cfn').value.trim(),dob=document.getElementById('cdob').value,gen=document.getElementById('cgen').value,pn=document.getElementById('cpn').value.trim(),ph=document.getElementById('cph').value.trim();
    if(!fn||!dob||!pn||!ph)return showToast('⚠ Jaza taarifa zenye *','warning');
    try{await databases.createDocument(A.databaseId,A.collections.children,ID.unique(),{childId:ID.unique(),fullName:fn,gender:gen,birthDate:dob,parentName:pn,parentPhone:ph,region:document.getElementById('creg').value.trim(),district:document.getElementById('cdis').value.trim(),facility:document.getElementById('cfac').value.trim(),address:'',notes:'',createdBy:currentUser.userId,createdAt:new Date().toISOString()});closeModal();navigateTo('children');showToast('✓ Mtoto amesajiliwa!','success');}
    catch(e){showToast('✗ Imeshindwa: '+e.message,'error');}
}
function vaccinateChild(childId){
    var opts='';for(var i=0;i<VACCINES.length;i++){opts+='<option>'+VACCINES[i]+'</option>';}
    document.getElementById('modalContainer').innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-header"><h3>💉 Rekodi Chanjo</h3><button class="close-btn" onclick="closeModal()">×</button></div><div class="form-group"><label>💉 Chanjo *</label><select class="form-select" id="vxn">'+opts+'</select></div><div class="form-group"><label>📊 Dozi *</label><input type="number" class="form-input" id="vxd" value="1" min="1" max="10"></div><div class="form-group"><label>📅 Tarehe *</label><input type="date" class="form-input" id="vxdt" value="'+new Date().toISOString().split('T')[0]+'"></div><div class="form-group"><label>📝 Maelezo</label><textarea class="form-textarea" id="vxnotes" placeholder="Maelezo..."></textarea></div><button class="btn btn-primary" style="width:100%;padding:14px;" onclick="saveVaccination(\''+childId+'\')">💾 Hifadhi</button></div></div>';
}
async function saveVaccination(childId){
    var vn=document.getElementById('vxn').value,dose=parseInt(document.getElementById('vxd').value),dt=document.getElementById('vxdt').value,notes=document.getElementById('vxnotes')?document.getElementById('vxnotes').value.trim():'';
    if(!vn||!dose||!dt)return showToast('⚠ Jaza taarifa zenye *','warning');
    var next=new Date(dt),iv={BCG:0,OPV:28,Pentavalent:28,PCV:28,Rotavirus:28,IPV:28,Measles:0,Rubella:0,'Vitamin A':180};next.setDate(next.getDate()+(iv[vn]||28));var nd=iv[vn]===0?'':next.toISOString().split('T')[0];
    try{await databases.createDocument(A.databaseId,A.collections.vaccinations,ID.unique(),{vaccinationId:ID.unique(),childId:childId,vaccineName:vn,dose:dose,vaccinationDate:dt,nextVaccinationDate:nd,providerId:currentUser.userId,notes:notes,createdAt:new Date().toISOString()});closeModal();navigateTo('vaccinations');showToast('✓ Chanjo imerekodiwa!','success');}
    catch(e){showToast('✗ Imeshindwa: '+e.message,'error');}
}

async function renderSchedulePage(){
    var cd=await databases.listDocuments(A.databaseId,A.collections.children,[Query.equal('createdBy',currentUser.userId)]),cids=cd.documents.map(function(c){return c.childId;}),av=[];
    for(var i=0;i<cids.length;i++){var v=await databases.listDocuments(A.databaseId,A.collections.vaccinations,[Query.equal('childId',cids[i])]);av=av.concat(v.documents);}
    var today=new Date().toISOString().split('T')[0],od=av.filter(function(v){return v.nextVaccinationDate&&v.nextVaccinationDate<today;});

    if(od.length>0){for(var i=0;i<od.length;i++){var c=cd.documents.find(function(x){return x.childId===od[i].childId;}),days=Math.abs(getDaysRemaining(od[i].nextVaccinationDate));html+='<tr><td><strong>'+escapeHtml(c?c.fullName:'?')+'</strong></td><td>'+od[i].vaccineName+' D'+od[i].dose+'</td><td>'+formatDate(od[i].nextVaccinationDate)+'</td><td><span class="badge badge-danger">'+days+'siku</span></td></tr>';}}
    else{html+='<tr><td colspan="4">✓ Hakuna zilizochelewa</td></tr>';}
    html+='</tbody></table></div></div>';return html;
}
async function renderReportsPage(){
    var cd=await databases.listDocuments(A.databaseId,A.collections.children,[Query.equal('createdBy',currentUser.userId)]),cids=cd.documents.map(function(c){return c.childId;}),av=[];
    for(var i=0;i<cids.length;i++){var v=await databases.listDocuments(A.databaseId,A.collections.vaccinations,[Query.equal('childId',cids[i])]);av=av.concat(v.documents);}
    window._reports={childrenDocs:cd,allVax:av};var bv={};
    for(var i=0;i<av.length;i++){bv[av[i].vaccineName]=(bv[av[i].vaccineName]||0)+1;}
    var html='<h2 class="page-title">📈 Ripoti</h2><div class="stats-grid"><div class="stat-card"><div class="stat-icon" style="background:var(--primary-light);color:var(--primary);">👶</div><div><div class="stat-value">'+cd.total+'</div><div class="stat-label">Watoto</div></div></div><div class="stat-card"><div class="stat-icon" style="background:var(--success-light);color:var(--success);">💉</div><div><div class="stat-value">'+av.length+'</div><div class="stat-label">Chanjo</div></div></div></div><div class="card"><h4>💉 Chanjo kwa Aina</h4><table><thead><tr><th>Chanjo</th><th>Idadi</th></tr></thead><tbody>';
    var keys=Object.keys(bv).sort(function(a,b){return bv[b]-bv[a];});
    for(var i=0;i<keys.length;i++){html+='<tr><td><strong>'+keys[i]+'</strong></td><td><span class="badge badge-primary">'+bv[keys[i]]+'</span></td></tr>';}
    html+='</tbody></table></div><button class="btn btn-primary" style="margin-top:16px;" onclick="exportCSV()">📥 Pakua CSV</button>';
    return html;
}
function exportCSV(){
    var d=window._reports,csv='Mtoto,Jinsia,Mzazi,Simu,Kituo,Chanjo,Dozi,Tarehe\n';
    for(var i=0;i<d.childrenDocs.documents.length;i++){
        var c=d.childrenDocs.documents[i],cv=d.allVax.filter(function(v){return v.childId===c.childId;});
        if(cv.length===0)csv+='"'+c.fullName+'","'+c.gender+'","'+c.parentName+'","'+c.parentPhone+'","'+c.facility+'","—","—","—"\n';
        else for(var j=0;j<cv.length;j++){csv+='"'+c.fullName+'","'+c.gender+'","'+c.parentName+'","'+c.parentPhone+'","'+c.facility+'","'+cv[j].vaccineName+'","'+cv[j].dose+'","'+cv[j].vaccinationDate+'"\n';}
    }
    var blob=new Blob(['\uFEFF'+csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vaccination_ripoti.csv';a.click();showToast('✓ Ripoti imepakuliwa!','success');
}

// ==================== ADMIN ====================
async function renderAdminPage(){
    if(!isAdmin)return'<div class="card empty-state"><div class="empty-icon">🛡️</div><h3>Hauna Ruhusa</h3></div>';
    var ud=await databases.listDocuments(A.databaseId,A.collections.users,[Query.orderDesc('$createdAt')]),cd=await databases.listDocuments(A.databaseId,A.collections.children,[Query.orderDesc('$createdAt')]),vd=await databases.listDocuments(A.databaseId,A.collections.vaccinations,[Query.orderDesc('vaccinationDate')]),ca='';
    try{var ad=await databases.listDocuments(A.databaseId,A.collections.announcements,[Query.equal('isActive',true),Query.limit(1)]);if(ad.documents.length>0)ca=ad.documents[0].message;}catch(e){}
    window._admin={users:ud.documents,children:cd.documents,vax:vd.documents};
    var html='<div class="welcome-section"><h2>🛡️ Admin Panel</h2><p>👑 Admin pekee anaweza kusimamia.</p></div>';
    html+='<div class="card" style="border:2px solid var(--warning);background:var(--warning-light);margin-bottom:24px;"><h3 style="color:#92400e;">📢 Tangazo kwa Watoa Huduma</h3><div class="form-group"><label style="color:#92400e;">✏️ Ujumbe</label><textarea class="form-textarea" id="announcementMessage" style="background:var(--surface);" placeholder="Andika tangazo...">'+escapeHtml(ca)+'</textarea></div><div style="display:flex;gap:10px;"><button class="btn btn-primary" onclick="postAnnouncement()" style="background:var(--warning);">📢 Toa Tangazo</button><button class="btn btn-danger" onclick="clearAnnouncement()">🗑️ Futa</button></div><div id="announcementStatus" style="margin-top:10px;"></div></div>';
    html+='<div class="stats-grid"><div class="stat-card"><div class="stat-icon" style="background:var(--primary-light);color:var(--primary);">👨‍⚕️</div><div><div class="stat-value">'+ud.total+'</div><div class="stat-label">Watoa Huduma</div></div></div><div class="stat-card"><div class="stat-icon" style="background:var(--success-light);color:var(--success);">👶</div><div><div class="stat-value">'+cd.total+'</div><div class="stat-label">Watoto</div></div></div><div class="stat-card"><div class="stat-icon" style="background:var(--warning-light);color:var(--warning);">💉</div><div><div class="stat-value">'+vd.total+'</div><div class="stat-label">Chanjo</div></div></div></div>';
    html+='<div class="tabs"><button class="tab active" onclick="showAdminTab(\'users\',this)">👨‍⚕️ Watoa Huduma</button><button class="tab" onclick="showAdminTab(\'children\',this)">👶 Watoto</button><button class="tab" onclick="showAdminTab(\'vax\',this)">💉 Chanjo</button></div><div id="adminContent">'+renderAdminUsers()+'</div>';
    return html;
}
async function postAnnouncement(){var m=document.getElementById('announcementMessage').value.trim(),sd=document.getElementById('announcementStatus');if(!m){sd.innerHTML='<p style="color:var(--danger);">⚠ Andika ujumbe.</p>';return;}sd.innerHTML='<p style="color:var(--primary);">⏳ Inatoa...</p>';var ok=await saveAnnouncement(m);if(ok){sd.innerHTML='<p style="color:var(--success);">✓ Tangazo limetolewa!</p>';showToast('✓ Tangazo limetolewa!','success');}else{sd.innerHTML='<p style="color:var(--danger);">✗ Imeshindwa.</p>';}}
async function clearAnnouncement(){var sd=document.getElementById('announcementStatus');sd.innerHTML='<p style="color:var(--primary);">⏳ Inafuta...</p>';try{if(activeAnnouncement)await databases.updateDocument(A.databaseId,A.collections.announcements,activeAnnouncement.$id,{isActive:false});var d=await databases.listDocuments(A.databaseId,A.collections.announcements,[Query.equal('isActive',true)]);for(var i=0;i<d.documents.length;i++){await databases.updateDocument(A.databaseId,A.collections.announcements,d.documents[i].$id,{isActive:false});}hideBanner();document.getElementById('announcementMessage').value='';sd.innerHTML='<p style="color:var(--success);">✓ Tangazo limefutwa.</p>';showToast('✓ Tangazo limefutwa!','success');}catch(e){sd.innerHTML='<p style="color:var(--danger);">✗ Imeshindwa.</p>';}}
function renderAdminUsers(){var u=window._admin.users,html='<div class="card" style="padding:0;"><div class="table-container"><table><thead><tr><th>👤 Jina</th><th>📧 Email</th><th>📱 Simu</th><th>🏥 Kituo</th><th>🏷️ Role</th><th>📊 Status</th><th>⚡ Vitendo</th></tr></thead><tbody>';for(var i=0;i<u.length;i++){html+='<tr><td><strong>'+escapeHtml(u[i].fullName)+'</strong> '+(u[i].role==='admin'?'👑':'')+'</td><td>'+u[i].email+'</td><td>'+(u[i].phone||'—')+'</td><td>'+escapeHtml(u[i].facility||'—')+'</td><td><span class="badge '+(u[i].role==='admin'?'badge-warning':'badge-info')+'">'+u[i].role+'</span></td><td><span class="badge '+(u[i].status==='active'?'badge-success':'badge-danger')+'">'+u[i].status+'</span></td><td>'+(u[i].role!=='admin'?'<button class="btn btn-sm '+(u[i].status==='active'?'btn-danger':'btn-success')+'" onclick="toggleUserStatus(\''+u[i].userId+'\')">'+(u[i].status==='active'?'🔒 Zima':'🔓 Wezesha')+'</button>':'<span class="badge badge-primary">👑 Admin</span>')+'</td></tr>';}html+='</tbody></table></div></div>';return html;}
function showAdminTab(type,btn){
    var tabs=document.querySelectorAll('.tabs .tab');for(var i=0;i<tabs.length;i++){tabs[i].classList.remove('active');}btn.classList.add('active');
    var d=window._admin;
    if(type==='users')document.getElementById('adminContent').innerHTML=renderAdminUsers();
    else if(type==='children'){var html='<div class="card" style="padding:0;"><div class="table-container"><table><thead><tr><th>👶 Mtoto</th><th>👤 Mzazi</th><th>📱 Simu</th><th>🏥 Kituo</th></tr></thead><tbody>';for(var i=0;i<d.children.length;i++){html+='<tr><td><strong>'+escapeHtml(d.children[i].fullName)+'</strong></td><td>'+escapeHtml(d.children[i].parentName)+'</td><td>'+d.children[i].parentPhone+'</td><td>'+escapeHtml(d.children[i].facility)+'</td></tr>';}html+='</tbody></table></div></div>';document.getElementById('adminContent').innerHTML=html;}
    else{var html='<div class="card" style="padding:0;"><div class="table-container"><table><thead><tr><th>💉 Chanjo</th><th>📊 Dozi</th><th>📅 Tarehe</th></tr></thead><tbody>';for(var i=0;i<d.vax.length;i++){html+='<tr><td><strong>'+d.vax[i].vaccineName+'</strong></td><td>'+d.vax[i].dose+'</td><td>'+formatDate(d.vax[i].vaccinationDate)+'</td></tr>';}html+='</tbody></table></div></div>';document.getElementById('adminContent').innerHTML=html;}
}
async function toggleUserStatus(userId){var d=await databases.listDocuments(A.databaseId,A.collections.users,[Query.equal('userId',userId)]);if(d.documents.length===0)return;var u=d.documents[0];if(u.role==='admin')return showToast('⚠ Huwezi kumzuia admin!','warning');await databases.updateDocument(A.databaseId,A.collections.users,u.$id,{status:u.status==='active'?'disabled':'active'});navigateTo('admin');showToast('✓ Status imebadilishwa!','success');}

async function init(){
    initTheme();
    showLoading(true);
    try{
        var u=await account.get();
        await loadUserAndEnter(u.$id);
    }catch(e){
        // App imefichwa, Auth inaonekana
        document.getElementById('appContainer').style.display='none';
        document.getElementById('authContainer').style.display='flex';
        showAuthForm('login');
    }
    showLoading(false);
}
document.addEventListener('DOMContentLoaded',init);
</script>
