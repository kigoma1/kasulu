function getWeekDates(){const d=new Date();const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);const monday=new Date(d.setDate(diff));const dates={};['Monday','Tuesday','Wednesday','Thursday','Friday'].forEach((dn,i)=>{const dt=new Date(monday);dt.setDate(monday.getDate()+i);dates[dn]=dt.toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'})});return dates}

async function approveAllPT(){if(!window._actionItems)return;const ptItems=window._actionItems.filter(i=>i.type==='pt');if(ptItems.length===0){st('No PT items to approve','warning');return}const result=await Swal.fire({title:`Approve ALL ${ptItems.length} PT items?`,text:'This will approve all pending PT checklist items',icon:'question',showCancelButton:!0,confirmButtonText:'Yes, Approve All',confirmButtonColor:'#27ae60'});if(!result.isConfirmed)return;sl();let done=0;for(const item of ptItems){try{await databases.updateDocument(DATABASE_ID,COL.PT,item.id,{status:currentUser.role==='field_supervisor'?'verified_by_field':'approved_final',updatedAt:new Date().toISOString(),fieldSupervisorApproval:currentUser.role==='field_supervisor',fieldSupervisorApprovalDate:currentUser.role==='field_supervisor'?new Date().toISOString():undefined,universitySupervisorApproval:currentUser.role==='university_supervisor',universitySupervisorApprovalDate:currentUser.role==='university_supervisor'?new Date().toISOString():undefined});done++}catch(e){console.error('Batch approve error:',e)}}hl();st(`${done} PT items approved! ✅`);lp('action_reviews');updateActionBadge()}
async function approveAllLogbooks(){if(!window._actionItems)return;const logItems=window._actionItems.filter(i=>i.type==='logbook');if(logItems.length===0){st('No logbooks to approve','warning');return}const result=await Swal.fire({title:`Approve ALL ${logItems.length} Logbooks?`,text:'This will approve all pending logbook reviews',icon:'question',showCancelButton:!0,confirmButtonText:'Yes, Approve All',confirmButtonColor:'#27ae60'});if(!result.isConfirmed)return;sl();let done=0;for(const item of logItems){try{await databases.updateDocument(DATABASE_ID,COL.LOGBOOKS,item.id,{status:currentUser.role==='field_supervisor'?'reviewed_by_field':'approved',updatedAt:new Date().toISOString()});ca('batch_approve',currentUser.userId,item.studentId,'Logbook batch approved');done++}catch(e){console.error('Batch logbook error:',e)}}hl();st(`${done} Logbooks approved! 📝`);lp('action_reviews');updateActionBadge()}
async function approveSelected(){if(!window._actionItems)return;const selected=window._actionItems.filter(i=>i.checked);if(selected.length===0){st('No items selected','warning');return}const result=await Swal.fire({title:`Approve ${selected.length} selected items?`,icon:'question',showCancelButton:!0,confirmButtonText:'Yes, Approve',confirmButtonColor:'#27ae60'});if(!result.isConfirmed)return;sl();let done=0;for(const item of selected){try{if(item.type==='pt'){await databases.updateDocument(DATABASE_ID,COL.PT,item.id,{status:currentUser.role==='field_supervisor'?'verified_by_field':'approved_final',updatedAt:new Date().toISOString()})}else{await databases.updateDocument(DATABASE_ID,COL.LOGBOOKS,item.id,{status:currentUser.role==='field_supervisor'?'reviewed_by_field':'approved',updatedAt:new Date().toISOString()})}done++}catch(e){console.error('Selected approve error:',e)}}hl();st(`${done} items approved! ✅`);lp('action_reviews');updateActionBadge()}
async function approveSinglePT(id){const result=await Swal.fire({title:'Approve PT Activity?',text:'This will approve this checklist item',icon:'question',showCancelButton:!0,confirmButtonText:'Approve',confirmButtonColor:'#27ae60'});if(!result.isConfirmed)return;try{await databases.updateDocument(DATABASE_ID,COL.PT,id,{status:currentUser.role==='field_supervisor'?'verified_by_field':'approved_final',updatedAt:new Date().toISOString()});st('Approved! ✅');lp('action_reviews');updateActionBadge()}catch(e){se(e,'Approval failed')}}
async function rejectSinglePT(id){const result=await Swal.fire({title:'Reject PT Activity?',text:'This will reject this checklist item',icon:'warning',showCancelButton:!0,confirmButtonText:'Reject',confirmButtonColor:'#e74c3c'});if(!result.isConfirmed)return;try{await databases.updateDocument(DATABASE_ID,COL.PT,id,{status:'rejected',updatedAt:new Date().toISOString()});st('Rejected! ❌');lp('action_reviews');updateActionBadge()}catch(e){se(e,'Rejection failed')}}
async function rpt(){if(currentUser.role==='student')return await rptStudent();if(currentUser.role==='field_supervisor'||currentUser.role==='university_supervisor')return await rptSupervisor();if(currentUser.role==='admin')return await rptAdmin();return'<div class="cc"><p>Access denied</p></div>'}
async function rptStudent(){try{let existing=await databases.listDocuments(DATABASE_ID,COL.PT,[Appwrite.Query.equal('studentId',currentUser.userId),Appwrite.Query.limit(500)]);let h=`<div class="cc"><div class="d-flex justify-content-between mb-3 flex-wrap gap-2"><h4><i class="bi bi-check2-square me-2"></i>PT Checklist</h4><button class="bsc" onclick="exportPTChecklistPDF()"><i class="bi bi-file-pdf me-1"></i>Export PDF</button></div>`;let totalActs=0,completedActs=0;for(const[cat,acts]of Object.entries(PT_CATEGORIES)){let catDone=0;let catHTML='';acts.forEach(act=>{totalActs++;const found=existing.documents.find(d=>d.activityName===act&&d.category===cat);const isDone=found&&found.completed;if(isDone){completedActs++;catDone++}catHTML+=`<div class="pt-item"><input type="checkbox" class="pt-check" ${isDone?'checked':''} onchange="togglePTActivity('${cat.replace(/'/g,"\\'")}','${act.replace(/'/g,"\\'")}',this.checked)"><span style="flex:1;font-size:.85rem;${isDone?'text-decoration:line-through;opacity:.7':''}">${act}</span>${isDone?`<small class="text-success">✅ ${found.status||''}</small>`:`<small class="text-muted">Pending</small>`}</div>`});h+=`<div class="pt-cat-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">${cat} <span class="badge bg-primary">${catDone}/${acts.length}</span></div><div>${catHTML}</div>`}const pct=totalActs>0?Math.round((completedActs/totalActs)*100):0;h+=`<div class="mt-3"><strong>Overall Progress:</strong> ${pct}% (${completedActs}/${totalActs})<div class="pt-progress"><div class="pt-progress-bar" style="width:${pct}%"></div></div></div></div>`;return h}catch(e){return'<div class="cc">Error loading checklist</div>'}}
async function togglePTActivity(cat,act,checked){try{const existing=await databases.listDocuments(DATABASE_ID,COL.PT,[Appwrite.Query.equal('studentId',currentUser.userId),Appwrite.Query.equal('activityName',act),Appwrite.Query.equal('category',cat)]);if(existing.total>0){const doc=existing.documents[0];await databases.updateDocument(DATABASE_ID,COL.PT,doc.$id,{completed:checked,completedDate:checked?new Date().toISOString():'',status:checked?'completed_by_student':'pending',updatedAt:new Date().toISOString()})}else if(checked){await databases.createDocument(DATABASE_ID,COL.PT,Appwrite.ID.unique(),{studentId:currentUser.userId,activityName:act,category:cat,completed:!0,completedDate:new Date().toISOString(),studentComment:'',evidenceFiles:'',fieldSupervisorComment:'',fieldSupervisorSignature:'',fieldSupervisorApproval:!1,fieldSupervisorApprovalDate:'',universitySupervisorComment:'',universitySupervisorSignature:'',universitySupervisorApproval:!1,universitySupervisorApprovalDate:'',status:'completed_by_student',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()})}st(checked?'Activity completed! ✅':'Activity unmarked');lp('pt_checklist')}catch(e){console.error('PT toggle error:',e)}}
async function rptSupervisor(){try{const asgn=await databases.listDocuments(DATABASE_ID,COL.ASSIGNMENTS,[currentUser.role==='field_supervisor'?Appwrite.Query.equal('fieldSupervisorId',currentUser.userId):Appwrite.Query.equal('universitySupervisorId',currentUser.userId)]);let sids=asgn.documents.map(a=>a.studentId);let filterStatus=currentUser.role==='field_supervisor'?'completed_by_student':'verified_by_field';let docs=await databases.listDocuments(DATABASE_ID,COL.PT,[Appwrite.Query.equal('status',filterStatus),Appwrite.Query.limit(200)]);let items=docs.documents.filter(d=>sids.includes(d.studentId));let h=`<div class="cc"><h4><i class="bi bi-check2-square me-2"></i>PT Checklist Review</h4><p class="text-muted">${items.length} activities pending</p>`;for(const item of items){let sname=item.studentId;try{const su=await databases.getDocument(DATABASE_ID,COL.USERS,item.studentId);sname=su.fullName}catch(e){}h+=`<div class="border rounded p-2 mb-2"><strong>${item.activityName}</strong> (${item.category})<br><small>Student: ${sname}</small><div class="mt-2"><button class="bsc btn-sm" onclick="reviewPTActivity('${item.$id}','approve')">✅ Approve</button> <button class="bxsd btn-sm" onclick="reviewPTActivity('${item.$id}','reject')">❌ Reject</button></div></div>`}return h+'</div>'}catch(e){return'<div class="cc">Error loading checklist</div>'}}
async function reviewPTActivity(id,decision){const doc=await databases.getDocument(DATABASE_ID,COL.PT,id);const result=await Swal.fire({title:`${decision==='approve'?'Approve':'Reject'} Activity`,html:`<p><strong>${doc.activityName}</strong></p><textarea id="ptRevComment" class="form-control mb-2" rows="2" placeholder="Comment..."></textarea><label class="form-label fw-bold small">Digital Signature</label><canvas id="ptSigCanvas" class="sp-sm mb-2"></canvas>`,didOpen:()=>{const cv=document.getElementById('ptSigCanvas');if(cv){window.ptSigPad=new SignaturePad(cv,{penColor:'#1a5276'})}},showCancelButton:!0,confirmButtonText:decision==='approve'?'Approve':'Reject',preConfirm:()=>{const cm=document.getElementById('ptRevComment')?.value||'';const sig=window.ptSigPad?.toDataURL()||'';return{comment:cm,signature:sig}}});if(!result)return;const rd=result.value;const isField=currentUser.role==='field_supervisor';const ns=decision==='approve'?(isField?'verified_by_field':'approved_final'):'rejected';const updateData={status:ns,updatedAt:new Date().toISOString()};if(isField){updateData.fieldSupervisorComment=rd.comment;updateData.fieldSupervisorSignature=rd.signature;updateData.fieldSupervisorApproval=decision==='approve';updateData.fieldSupervisorApprovalDate=new Date().toISOString()}else{updateData.universitySupervisorComment=rd.comment;updateData.universitySupervisorSignature=rd.signature;updateData.universitySupervisorApproval=decision==='approve';updateData.universitySupervisorApprovalDate=new Date().toISOString()}await databases.updateDocument(DATABASE_ID,COL.PT,id,updateData);st(`Activity ${decision==='approve'?'approved':'rejected'}!`);lp('pt_checklist');updateActionBadge()}
async function rptAdmin(){try{const docs=await databases.listDocuments(DATABASE_ID,COL.PT,[Appwrite.Query.orderDesc('updatedAt'),Appwrite.Query.limit(100)]);let h=`<div class="cc"><h4><i class="bi bi-check2-square me-2"></i>PT Checklist - All Records</h4><p class="text-muted">Total: ${docs.total} records</p><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Student</th><th>Activity</th><th>Category</th><th>Status</th></tr></thead><tbody>`;for(const d of docs.documents){let sname=d.studentId;try{const su=await databases.getDocument(DATABASE_ID,COL.USERS,d.studentId);sname=su.fullName}catch(e){}h+=`<tr><td>${sname}</td><td>${d.activityName}</td><td>${d.category}</td><td><span class="badge bg-${d.status==='approved_final'?'success':d.status==='rejected'?'danger':'warning'}">${d.status}</span></td></tr>`}return h+'</tbody></table></div></div>'}catch(e){return'<div class="cc">Error loading records</div>'}}
function exportPTChecklistPDF(){try{const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFontSize(14);doc.text('RUCU BEHSIT Field Activities Checklist',20,20);doc.setFontSize(11);doc.text(`Student: ${currentUser.fullName}`,20,30);doc.text(`Reg No: ${currentUser.registrationNumber||'N/A'}`,20,38);let y=50;for(const[cat,acts]of Object.entries(PT_CATEGORIES)){doc.setFontSize(12);doc.text(cat,20,y);y+=8;doc.setFontSize(10);acts.forEach(act=>{doc.text(`- ${act}`,25,y);y+=6;if(y>280){doc.addPage();y=20}});y+=4}doc.save('PT_Checklist.pdf');st('PDF exported!')}catch(e){se(e,'Export failed')}}
async function rvs(){try{const users=await databases.listDocuments(DATABASE_ID,COL.USERS);const supervisors=users.documents.filter(u=>u.role==='field_supervisor'||u.role==='university_supervisor');if(supervisors.length===0){return'<div class="cc text-center py-5"><h5>No supervisors registered yet</h5></div>'}let h=`<div class="cc"><h4><i class="bi bi-people me-2"></i>All Supervisors (${supervisors.length})</h4><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Region</th><th>Actions</th></tr></thead><tbody>`;supervisors.forEach(s=>{h+=`<tr><td><strong>${s.fullName}</strong></td><td>${s.email}</td><td><span class="badge bg-${s.role==='field_supervisor'?'info':'success'}">${s.role.replace(/_/g,' ')}</span></td><td>${s.region||'-'}</td><td><button class="bsc" onclick="openChatWith('${s.userId}','${s.fullName}')"><i class="bi bi-chat-dots"></i> Chat</button></td></tr>`});return h+'</tbody></table></div></div>'}catch(e){return'<div class="cc">Error loading supervisors</div>'}}
async function rvl(lid){try{const logbook=await databases.getDocument(DATABASE_ID,COL.LOGBOOKS,lid);const result=await Swal.fire({title:`Review - Week ${logbook.weekNumber}`,html:`<div class="text-start"><p><strong>Activities:</strong><br>${logbook.activities||'N/A'}</p><p><strong>Skills:</strong><br>${logbook.skills||'N/A'}</p>${logbook.studentSignature?`<p><strong>Student Signature:</strong><br><img src="${logbook.studentSignature}" width="200" class="mt-1 border rounded"></p>`:''}${logbook.attachmentUrl?`<p><strong>Attachment:</strong> <a href="${logbook.attachmentUrl}" target="_blank">View File</a></p>`:''}<hr><label class="form-label fw-bold">Comment *</label><textarea id="rvc" class="form-control mb-3" rows="3"></textarea><label class="form-label fw-bold">Digital Signature</label><canvas id="scv" class="sp mb-2"></canvas></div>`,didOpen:()=>{const cv=document.getElementById('scv');if(cv){window.tsp=new SignaturePad(cv,{penColor:'#1a5276'})}},showCancelButton:!0,showDenyButton:!0,confirmButtonText:'Approve',denyButtonText:'Reject',preConfirm:()=>{const cm=document.getElementById('rvc')?.value;if(!cm){Swal.showValidationMessage('Comment required');return!1}return{comment:cm,signature:window.tsp?.toDataURL()||'',decision:'approved'}},preDeny:()=>{const cm=document.getElementById('rvc')?.value;if(!cm){Swal.showValidationMessage('Comment required');return!1}return{comment:cm,signature:window.tsp?.toDataURL()||'',decision:'rejected'}}});if(!result)return;const rd=result.value||result;sl();const ns=rd.decision==='rejected'?'rejected':currentUser.role==='field_supervisor'?'reviewed_by_field':'approved';await databases.createDocument(DATABASE_ID,COL.REVIEWS,Appwrite.ID.unique(),{logbookId:lid,reviewerId:currentUser.userId,reviewerRole:currentUser.role,stage:currentUser.role==='field_supervisor'?'field_review':'university_review',comment:rd.comment,decision:rd.decision,signatureUrl:rd.signature||'',supervisorId:'',supervisorType:'',approvalStatus:ns,reviewedAt:new Date().toISOString()});await databases.updateDocument(DATABASE_ID,COL.LOGBOOKS,lid,{status:ns,updatedAt:new Date().toISOString()});ca('review',currentUser.userId,logbook.studentId,`Logbook ${ns}`);hl();st('Review submitted!');lp('dashboard');updateActionBadge()}catch(e){se(e,'Review failed')}}
async function gsa(sid){try{const as=await databases.listDocuments(DATABASE_ID,COL.ASSIGNMENTS,[Appwrite.Query.equal('studentId',sid)]);if(as.total>0){const a=as.documents[0];const[fs,us]=await Promise.all([databases.getDocument(DATABASE_ID,COL.USERS,a.fieldSupervisorId).catch(()=>null),databases.getDocument(DATABASE_ID,COL.USERS,a.universitySupervisorId).catch(()=>null)]);return{...a,fieldSupervisor:fs,universitySupervisor:us}}return null}catch(e){return null}}
async function rml(){try{const logs=await databases.listDocuments(DATABASE_ID,COL.LOGBOOKS,[Appwrite.Query.equal('studentId',currentUser.userId),Appwrite.Query.orderDesc('$createdAt')]);let h=`<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><h4 class="m-0"><i class="bi bi-journal-text me-2"></i>My Weekly Logbooks</h4><button class="bsc" onclick="clb()"><i class="bi bi-plus-circle me-2"></i>New Logbook</button></div>`;if(logs.total===0){return h+`<div class="cc text-center py-5"><img src="${LOGO_URL}" alt="Logo" style="width:60px;height:60px;border-radius:50%;object-fit:cover;margin-bottom:1rem;opacity:.5"><h5 class="mt-3">No logbooks yet</h5><button class="bsc mt-2" onclick="clb()">Create First Logbook</button></div>`}const sc={submitted_to_field:'warning',reviewed_by_field:'info',approved:'success',rejected:'danger'};logs.documents.forEach(log=>{const c=sc[log.status]||'secondary';let dayPreview='';try{const da=JSON.parse(log.dailyActivities||'{}');const filled=Object.entries(da).filter(([d,act])=>act);if(filled.length>0){dayPreview=filled.map(([d,act])=>`<span class="badge bg-light text-dark me-1">${d.split('(')[0].trim()}</span>`).join('')}}catch(e){}h+=`<div class="cc mb-3" data-aos="fade-up"><div class="d-flex justify-content-between align-items-start flex-wrap gap-2"><div><h5 class="mb-1">Week ${log.weekNumber}</h5><span class="badge bg-${c} bst">${(log.status||'draft').replace(/_/g,' ')}</span>${log.studentSignature?` <i class="bi bi-pen-fill text-success" title="Signed"></i>`:''}</div><div class="d-flex gap-2"><button class="bxsw" onclick="vl('${log.$id}')"><i class="bi bi-eye"></i></button><button class="bsc" onclick="ep('${log.$id}')"><i class="bi bi-file-pdf me-1"></i>PDF</button></div></div>${dayPreview?`<div class="mt-2 mb-1">${dayPreview}</div>`:''}<p class="mt-1 mb-1 text-muted small">${(log.activities||'').substring(0,100)}...</p>${log.attachmentUrl?`<small><i class="bi bi-paperclip"></i> <a href="${log.attachmentUrl}" target="_blank">Attachment</a></small>`:''}<br><small class="text-muted"><i class="bi bi-clock"></i> ${new Date(log.submittedAt||log.$createdAt).toLocaleString()}</small></div>`});return h}catch(e){return`<div class="cc">Error: ${e.message}</div>`}}
async function clb(){const weekDates=getWeekDates();const days=[{en:'Monday',sw:'Monday'},{en:'Tuesday',sw:'Tuesday'},{en:'Wednesday',sw:'Wednesday'},{en:'Thursday',sw:'Thursday'},{en:'Friday',sw:'Friday'}];let daysHTML=days.map(d=>`<div class="day-row"><div class="day-label">${d.sw}<span class="day-date">${weekDates[d.en]||''}</span></div><textarea id="day_${d.en}" class="fc" rows="2" placeholder="Activities on ${d.sw}..."></textarea></div>`).join('');const{value:form}=await Swal.fire({title:'New Weekly Logbook',html:`<div class="text-start"><div class="mb-3"><label class="form-label fw-bold">Week Number *</label><input id="sw" class="form-control" type="number" min="1" max="52"></div><div class="mb-3"><label class="form-label fw-bold">Daily Activities (Mon-Fri)</label>${daysHTML}</div><div class="mb-3"><label class="form-label fw-bold">Skills Learned</label><textarea id="ss" class="form-control" rows="2"></textarea></div><div class="mb-3"><label class="form-label fw-bold">Knowledge Gained</label><textarea id="sk" class="form-control" rows="2"></textarea></div><div class="mb-3"><label class="form-label fw-bold">Challenges</label><textarea id="sc" class="form-control" rows="2"></textarea></div><div class="mb-3"><label class="form-label fw-bold">Recommendations</label><textarea id="sr" class="form-control" rows="2"></textarea></div><div class="mb-3"><label class="form-label fw-bold text-danger">Your Signature *</label><canvas id="studentSigCanvas" class="sp-sm mb-1"></canvas></div><div class="mb-3"><label class="form-label fw-bold">Attach File (Optional)</label><div class="file-up" onclick="document.getElementById('fileInput').click()"><i class="bi bi-cloud-upload fs-3"></i><p class="mb-0 mt-2">Click to upload</p><small id="fileName" class="text-muted"></small></div><input type="file" id="fileInput" style="display:none" accept=".pdf,.docx,.doc,.jpg,.jpeg,.png" onchange="handleFileSelect(this)"></div></div>`,didOpen:()=>{const cv=document.getElementById('studentSigCanvas');if(cv){studentSigPad=new SignaturePad(cv,{penColor:'#1a5276'})}},confirmButtonText:'Submit',showCancelButton:!0,width:'850px',preConfirm:()=>{const w=document.getElementById('sw').value;let dailyActs={};let hasActivity=!1;days.forEach(d=>{const act=document.getElementById('day_'+d.en)?.value||'';dailyActs[`${d.sw} (${weekDates[d.en]})`]=act;if(act.trim())hasActivity=!0});const allActivities=days.map(d=>{const act=document.getElementById('day_'+d.en)?.value||'';return act.trim()?`${d.sw} (${weekDates[d.en]}): ${act}`:''}).filter(x=>x).join('\n');const studentSig=studentSigPad?.toDataURL()||'';if(!w||!hasActivity){Swal.showValidationMessage('Week number and at least one day activity required');return!1}if(studentSigPad?.isEmpty()){Swal.showValidationMessage('Your signature is required');return!1}return{weekNumber:parseInt(w),dailyActivities:JSON.stringify(dailyActs),activities:allActivities,skills:document.getElementById('ss').value||'',knowledge:document.getElementById('sk').value||'',challenges:document.getElementById('sc').value||'',recommendations:document.getElementById('sr').value||'',studentSignature:studentSig}}});if(!form)return;try{sl();const did=Appwrite.ID.unique();let attachmentUrl='';if(selectedFile){try{const uploaded=await storage.createFile(BUCKET_ID,Appwrite.ID.unique(),selectedFile);attachmentUrl=`${client.config.endpoint}/storage/buckets/${BUCKET_ID}/files/${uploaded.$id}/view?project=${client.config.project}`}catch(e){console.error('Upload error:',e)}}await databases.createDocument(DATABASE_ID,COL.LOGBOOKS,did,{logbookId:did,studentId:currentUser.userId,weekNumber:form.weekNumber,activities:form.activities,skills:form.skills,knowledge:form.knowledge,challenges:form.challenges,recommendations:form.recommendations,dailyActivities:form.dailyActivities,studentSignature:form.studentSignature||'',attachmentUrl:attachmentUrl,status:'submitted_to_field',submittedAt:new Date().toISOString(),updatedAt:new Date().toISOString()});ca('submit_logbook',currentUser.userId,currentUser.userId,'Logbook submitted');selectedFile=null;studentSigPad=null;hl();st('Logbook submitted!');lp('my_logbooks')}catch(e){se(e,'Failed to submit')}}
function handleFileSelect(input){if(input.files&&input.files[0]){selectedFile=input.files[0];document.getElementById('fileName').textContent=selectedFile.name}else{selectedFile=null;document.getElementById('fileName').textContent=''}}
async function vl(lid){try{const log=await databases.getDocument(DATABASE_ID,COL.LOGBOOKS,lid);let dailyHTML='';try{const da=JSON.parse(log.dailyActivities||'{}');Object.entries(da).forEach(([day,act])=>{if(act)dailyHTML+=`<div class="border rounded p-2 mb-1"><strong>${day}:</strong><br>${act}</div>`})}catch(e){}let rh='';try{const rvs=await databases.listDocuments(DATABASE_ID,COL.REVIEWS,[Appwrite.Query.equal('logbookId',lid)]);for(const rev of rvs.documents){let rname=rev.reviewerRole;try{const ru=await databases.getDocument(DATABASE_ID,COL.USERS,rev.reviewerId);rname=ru.fullName}catch(e){}rh+=`<div class="border rounded p-2 mb-2"><strong>${rname}:</strong> ${rev.comment}<br><small>${new Date(rev.reviewedAt).toLocaleString()}</small>${rev.signatureUrl?`<br><img src="${rev.signatureUrl}" width="120" class="mt-1">`:''}</div>`}}catch(e){}await Swal.fire({title:`Logbook - Week ${log.weekNumber}`,html:`<div class="text-start"><p><strong>Status:</strong> ${log.status}</p>${log.studentSignature?`<div class="text-center border rounded p-2 mb-2 bg-light"><strong>Your Signature:</strong><br><img src="${log.studentSignature}" width="250" class="mt-1"></div>`:''}${dailyHTML?`<h6>Daily Activities</h6>${dailyHTML}`:`<p><strong>Activities:</strong><br>${log.activities||'N/A'}</p>`}<p><strong>Skills:</strong><br>${log.skills||'N/A'}</p>${log.attachmentUrl?`<p><strong>Attachment:</strong> <a href="${log.attachmentUrl}" target="_blank">Download</a></p>`:''}<hr><h6>Reviews & Signatures</h6>${rh||'<p>No reviews yet</p>'}</div>`,width:'800px'})}catch(e){se(e,'Failed to load')}}
function ep(lid){databases.getDocument(DATABASE_ID,COL.LOGBOOKS,lid).then(log=>{const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFontSize(16);doc.text('Behsit Field System - Logbook',20,20);doc.setFontSize(12);doc.text(`Student: ${currentUser.fullName}`,20,30);doc.text(`Week: ${log.weekNumber} | Status: ${log.status}`,20,40);if(log.studentSignature){try{doc.addImage(log.studentSignature,'PNG',20,48,60,30)}catch(e){}}doc.setFontSize(11);let y=log.studentSignature?85:55;doc.text('Activities:',20,y);doc.text(log.activities||'N/A',20,y+10,{maxWidth:170});doc.save(`logbook_week_${log.weekNumber}.pdf`);st('PDF exported!')}).catch(e=>se(e,'Export failed'))}
async function ru(){try{const users=await databases.listDocuments(DATABASE_ID,COL.USERS);let h=`<div class="cc"><h4><i class="bi bi-people me-2"></i>User Management</h4><p class="text-muted">Total: ${users.total} users</p><div class="tr"><table class="table table-hover table-sm"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Region</th><th>Status</th><th>Actions</th></tr></thead><tbody>`;users.documents.forEach(u=>{h+=`<tr><td><strong>${u.fullName}</strong></td><td>${u.email}</td><td><span class="badge bg-info">${u.role}</span></td><td>${u.region||'-'}</td><td>${u.isActive?'Active':'Suspended'}</td><td><button class="bxsw" onclick="eu('${u.$id}')"><i class="bi bi-pencil"></i></button><button class="bxsd" onclick="du('${u.$id}')"><i class="bi bi-trash"></i></button></td></tr>`});return h+'</tbody></table></div></div>'}catch(e){return'<div class="cc">Error loading users</div>'}}
async function eu(uid){try{const user=await databases.getDocument(DATABASE_ID,COL.USERS,uid);let regionOpts='<option value="">Select Region</option>';Object.keys(TZ_REGIONS).sort().forEach(r=>{regionOpts+=`<option value="${r}" ${user.region===r?'selected':''}>${r}</option>`});const{value}=await Swal.fire({title:'Edit User',html:`<input id="en" class="form-control mb-2" value="${user.fullName}"><input id="ee" class="form-control mb-2" value="${user.email}"><select id="er" class="form-control mb-2"><option value="student" ${user.role==='student'?'selected':''}>Student</option><option value="field_supervisor" ${user.role==='field_supervisor'?'selected':''}>Field Supervisor</option><option value="university_supervisor" ${user.role==='university_supervisor'?'selected':''}>University Supervisor</option><option value="admin" ${user.role==='admin'?'selected':''}>Admin</option></select><select id="eReg" class="form-control mb-2">${regionOpts}</select>`,showCancelButton:!0,confirmButtonText:'Update',preConfirm:()=>({fullName:document.getElementById('en').value,email:document.getElementById('ee').value,role:document.getElementById('er').value,region:document.getElementById('eReg').value})});if(value){await databases.updateDocument(DATABASE_ID,COL.USERS,uid,{...value,updatedAt:new Date().toISOString()});st('User updated!');lp('users')}}catch(e){se(e,'Edit failed')}}
async function du(uid){const result=await Swal.fire({title:'Delete User?',text:'This action cannot be undone',icon:'warning',showCancelButton:!0,confirmButtonColor:'#e74c3c',confirmButtonText:'Delete'});if(result.isConfirmed){try{await databases.deleteDocument(DATABASE_ID,COL.USERS,uid);st('User deleted');lp('users')}catch(e){se(e,'Delete failed')}}}
async function ral(){try{const logs=await databases.listDocuments(DATABASE_ID,COL.LOGBOOKS,[Appwrite.Query.orderDesc('$createdAt'),Appwrite.Query.limit(50)]);let h=`<div class="cc"><h4><i class="bi bi-journals me-2"></i>All Logbooks</h4><p>Total: ${logs.total}</p>`;for(const log of logs.documents){let sname=log.studentId;try{const su=await databases.getDocument(DATABASE_ID,COL.USERS,log.studentId);sname=su.fullName}catch(e){}h+=`<div class="border rounded p-2 mb-2"><strong>Week ${log.weekNumber}</strong> | ${sname}<span class="badge bg-info ms-2">${log.status||'draft'}</span>${log.studentSignature?' <i class="bi bi-pen-fill text-success"></i>':''}<p class="mb-0 small text-muted">${(log.activities||'').substring(0,60)}...</p></div>`}return h+'</div>'}catch(e){return'<div class="cc">Error loading logbooks</div>'}}
async function ra(){try{const[as,us]=await Promise.all([databases.listDocuments(DATABASE_ID,COL.ASSIGNMENTS).catch(()=>({total:0,documents:[]})),databases.listDocuments(DATABASE_ID,COL.USERS).catch(()=>({total:0,documents:[]}))]);let h=`<div class="cc"><div class="d-flex justify-content-between mb-3 flex-wrap gap-2"><h4><i class="bi bi-link-45deg me-2"></i>Assignments</h4><button class="bsc" onclick="caa()"><i class="bi bi-plus-circle me-1"></i>New</button></div>`;if(as.total===0){return h+'<p class="text-center py-4 text-muted">No assignments yet</p></div>'}as.documents.forEach(a=>{const st=us.documents.find(u=>u.userId===a.studentId),fs=us.documents.find(u=>u.userId===a.fieldSupervisorId),us2=us.documents.find(u=>u.userId===a.universitySupervisorId);h+=`<div class="border rounded p-2 mb-2"><div class="row small"><div class="col-md-3"><strong>Student:</strong> ${st?.fullName||'Unknown'} (${st?.region||'-'})</div><div class="col-md-3"><strong>Field:</strong> ${fs?.fullName||'Unknown'} (${fs?.region||'-'})</div><div class="col-md-3"><strong>Uni:</strong> ${us2?.fullName||'Unknown'}</div><div class="col-md-3"><button class="bxsw" onclick="rea('${a.$id}')"><i class="bi bi-arrow-repeat"></i> Reassign</button></div></div></div>`});return h+'</div>'}catch(e){return'<div class="cc">Error: '+e.message+'</div>'}}
async function caa(){try{const users=await databases.listDocuments(DATABASE_ID,COL.USERS),sts=users.documents.filter(u=>u.role==='student'),fss=users.documents.filter(u=>u.role==='field_supervisor'),uss=users.documents.filter(u=>u.role==='university_supervisor');if(sts.length===0||fss.length===0||uss.length===0){st('Need all roles registered first','warning');return}const{value}=await Swal.fire({title:'New Assignment',html:`<select id="as" class="form-control mb-2"><option value="">Select Student</option>${sts.map(s=>`<option value="${s.userId}">${s.fullName} (${s.region||'No region'})</option>`).join('')}</select><select id="afs" class="form-control mb-2"><option value="">Select Field Supervisor</option>${fss.map(s=>`<option value="${s.userId}">${s.fullName} (${s.region||'No region'})</option>`).join('')}</select><select id="aus" class="form-control mb-2"><option value="">Select University Supervisor</option>${uss.map(s=>`<option value="${s.userId}">${s.fullName}</option>`).join('')}</select>`,showCancelButton:!0,confirmButtonText:'Assign',preConfirm:()=>({studentId:document.getElementById('as').value,fieldSupervisorId:document.getElementById('afs').value,universitySupervisorId:document.getElementById('aus').value})});if(value&&value.studentId&&value.fieldSupervisorId&&value.universitySupervisorId){await databases.createDocument(DATABASE_ID,COL.ASSIGNMENTS,Appwrite.ID.unique(),{studentId:value.studentId,fieldSupervisorId:value.fieldSupervisorId,universitySupervisorId:value.universitySupervisorId,region:sts.find(s=>s.userId===value.studentId)?.region||'',academicYear:'2025/2026',semester:'Semester 1',status:'active',assignedBy:currentUser.userId,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});st('Assignment created!');lp('assignments')}}catch(e){se(e,'Assignment failed')}}
async function rea(aid){try{const assignment=await databases.getDocument(DATABASE_ID,COL.ASSIGNMENTS,aid);const users=await databases.listDocuments(DATABASE_ID,COL.USERS);const fss=users.documents.filter(u=>u.role==='field_supervisor');const uss=users.documents.filter(u=>u.role==='university_supervisor');const student=users.documents.find(u=>u.userId===assignment.studentId);const cfs=users.documents.find(u=>u.userId===assignment.fieldSupervisorId);const cus=users.documents.find(u=>u.userId===assignment.universitySupervisorId);const{value}=await Swal.fire({title:`Reassign: ${student?.fullName||'Student'} (${student?.region||''})`,html:`<label class="form-label fw-bold small">Field Supervisor</label><select id="rfs" class="form-control mb-2"><option value="">Keep: ${cfs?.fullName||'Current'} (${cfs?.region||''})</option>${fss.map(s=>`<option value="${s.userId}">${s.fullName} (${s.region||''})</option>`).join('')}</select><label class="form-label fw-bold small">University Supervisor</label><select id="rus" class="form-control mb-2"><option value="">Keep: ${cus?.fullName||'Current'}</option>${uss.map(s=>`<option value="${s.userId}">${s.fullName}</option>`).join('')}</select>`,showCancelButton:!0,confirmButtonText:'Reassign',preConfirm:()=>({fieldSupervisorId:document.getElementById('rfs').value||assignment.fieldSupervisorId,universitySupervisorId:document.getElementById('rus').value||assignment.universitySupervisorId})});if(value){await databases.updateDocument(DATABASE_ID,COL.ASSIGNMENTS,aid,{fieldSupervisorId:value.fieldSupervisorId,universitySupervisorId:value.universitySupervisorId,updatedAt:new Date().toISOString()});ca('reassign',currentUser.userId,assignment.studentId,'Supervisors reassigned');st('Reassigned!');lp('assignments')}}catch(e){se(e,'Reassign failed')}}
async function rn(){return`<div class="cc"><h4><i class="bi bi-graph-up me-2"></i>Analytics Dashboard</h4><canvas id="acv" height="100"></canvas></div>`}
async function rc(){try{const[u,l]=await Promise.all([databases.listDocuments(DATABASE_ID,COL.USERS).catch(()=>({total:0,documents:[]})),databases.listDocuments(DATABASE_ID,COL.LOGBOOKS).catch(()=>({total:0,documents:[]}))]);const ctx=document.getElementById('acv');if(!ctx)return;new Chart(ctx.getContext('2d'),{type:'doughnut',data:{labels:['Students','Supervisors','Pending','Approved','Rejected'],datasets:[{data:[u.documents.filter(x=>x.role==='student').length,u.documents.filter(x=>x.role.includes('supervisor')).length,l.documents.filter(x=>x.status!=='approved'&&x.status!=='rejected').length,l.documents.filter(x=>x.status==='approved').length,l.documents.filter(x=>x.status==='rejected').length],backgroundColor:['#1a5276','#2e86c1','#f39c12','#27ae60','#e74c3c']}]}})}catch(e){console.error('Chart error:',e)}}
async function loadChatUsers(){try{const users=await databases.listDocuments(DATABASE_ID,COL.USERS);const others=users.documents.filter(u=>u.userId!==currentUser?.userId);const sel=document.getElementById('chatUserSelect');if(sel){sel.innerHTML='<option value="">Select person...</option>'+others.map(u=>`<option value="${u.userId}">${u.fullName} (${u.role.replace(/_/g,' ')})</option>`).join('')}}catch(e){}}
async function lcm(){if(!currentUser||!currentChatUser)return;try{const msgs=await databases.listDocuments(DATABASE_ID,COL.MESSAGES,[Appwrite.Query.orderAsc('createdAt'),Appwrite.Query.limit(200)]);const filtered=msgs.documents.filter(m=>(m.senderId===currentUser.userId&&m.receiverId===currentChatUser)||(m.senderId===currentChatUser&&m.receiverId===currentUser.userId));const body=document.getElementById('chatBody');if(body&&document.getElementById('chatPopup').classList.contains('show')){if(filtered.length===0){body.innerHTML='<p class="text-muted small text-center py-4">No messages yet. Say hello! 👋</p>'}else{body.innerHTML=filtered.map(m=>{let replyHTML='';if(m.replyTo){try{const rp=JSON.parse(m.replyTo);replyHTML=`<div class="reply-preview">↩ ${rp.message.substring(0,30)}...</div>`}catch(e){}}const isMine=m.senderId===currentUser.userId;const senderName=isMine?'You':(currentChatUserName||'Them');return`<div class="chat-msg ${isMine?'mine':''}">${replyHTML}<strong style="font-size:.7rem;color:#1a5276">${senderName}</strong><br>${m.message}<small>${new Date(m.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small><button class="reply-btn" onclick="event.stopPropagation();replyToMsg('${m.$id}','${m.message.replace(/'/g,"\\'")}','${m.senderId}')">↩ Reply</button></div>`}).join('');body.scrollTop=body.scrollHeight}}}catch(e){console.error('Chat load error:',e)}}
async function sendChat(){const msg=document.getElementById('chatInput')?.value?.trim();const receiver=currentChatUser||document.getElementById('chatUserSelect')?.value;if(!msg||!receiver)return;const btn=document.getElementById('chatSendBtn');btn.disabled=!0;try{let replyData=null;if(replyingTo){replyData={message:replyingTo.message,senderId:replyingTo.senderId};cancelReplyFn()}await databases.createDocument(DATABASE_ID,COL.MESSAGES,Appwrite.ID.unique(),{senderId:currentUser.userId,receiverId:receiver,message:msg,isRead:!1,replyTo:replyData?JSON.stringify(replyData):'',createdAt:new Date().toISOString()});document.getElementById('chatInput').value='';cn(receiver,'New message',`${currentUser.fullName}: ${msg}`,'chat',null);await lcm();setTimeout(()=>lcm(),300);setTimeout(()=>btn.disabled=!1,500)}catch(e){btn.disabled=!1;console.error('Chat error:',e)}}
function replyToMsg(msgId,msgText,senderId){replyingTo={id:msgId,message:msgText,senderId:senderId};const bar=document.getElementById('replyingBar');const text=document.getElementById('replyingText');if(bar&&text){bar.style.display='flex';text.innerHTML=`<strong>↩ Replying:</strong> ${msgText.substring(0,40)}...`}document.getElementById('chatInput')?.focus()}
function cancelReplyFn(){replyingTo=null;const bar=document.getElementById('replyingBar');if(bar)bar.style.display='none'}
function openChatWith(uid,name){currentChatUser=uid;currentChatUserName=name;document.getElementById('chatUserSelect').value=uid;document.getElementById('chatHeaderTitle').innerHTML=`<i class="bi bi-chat-dots me-2"></i>${name}`;document.getElementById('chatPopup').classList.add('show');closeSideMenu();lcm()}
document.addEventListener('DOMContentLoaded',()=>{AOS.init({duration:800,once:!0});populateRegions();document.getElementById('lb').onclick=function(){this.disabled=!0;setTimeout(()=>this.disabled=!1,1000);login()};document.getElementById('rb').onclick=function(){this.disabled=!0;setTimeout(()=>this.disabled=!1,1000);reg()};document.getElementById('srl').onclick=()=>{document.getElementById('lf').style.display='none';document.getElementById('rf').style.display='block';populateRegions()};document.getElementById('btl').onclick=()=>{document.getElementById('rf').style.display='none';document.getElementById('lf').style.display='block'};document.getElementById('menuLogout').onclick=logout;document.getElementById('hamburgerBtn').onclick=toggleSideMenu;document.getElementById('sideMenuOverlay').onclick=closeSideMenu;document.getElementById('menuDarkMode').onclick=()=>{document.body.classList.toggle('dark-mode');closeSideMenu()};document.getElementById('menuContact').onclick=showContact;document.getElementById('menuOpenChat').onclick=()=>{closeSideMenu();document.getElementById('chatPopup').classList.add('show');loadChatUsers();if(currentChatUser)lcm()};document.getElementById('chatCloseBtn').onclick=()=>document.getElementById('chatPopup').classList.remove('show');document.getElementById('cancelReply').onclick=cancelReplyFn;document.getElementById('chatSendBtn').onclick=sendChat;document.getElementById('chatInput').onkeypress=e=>{if(e.key==='Enter')sendChat()};document.querySelectorAll('.side-menu-item[data-action]').forEach(item=>{item.onclick=function(){const page=this.dataset.action;if(page)lp(page)}});document.addEventListener('click',e=>{const popup=document.getElementById('notifPopup'),bell=document.getElementById('notifBell');if(popup&&bell&&!popup.contains(e.target)&&!bell.contains(e.target)){popup.classList.remove('show');if(popupRefreshInterval)clearInterval(popupRefreshInterval)}});document.addEventListener('keypress',e=>{if(e.key==='Enter'&&document.getElementById('ac').style.display!=='none'){login()}});cs()});
window.lp=lp;window.clb=clb;window.rvl=rvl;window.vl=vl;window.ep=ep;window.eu=eu;window.du=du;window.caa=caa;window.rea=rea;window.mn=mn;window.toggleNotifPopup=toggleNotifPopup;window.handleFileSelect=handleFileSelect;window.toggleSideMenu=toggleSideMenu;window.closeSideMenu=closeSideMenu;window.showContact=showContact;window.openChatWith=openChatWith;window.lcm=lcm;window.sendChat=sendChat;window.loadChatUsers=loadChatUsers;window.replyToMsg=replyToMsg;window.cancelReplyFn=cancelReplyFn;window.togglePTActivity=togglePTActivity;window.reviewPTActivity=reviewPTActivity;window.exportPTChecklistPDF=exportPTChecklistPDF;window.updateDistricts=updateDistricts;window.populateRegions=populateRegions;window.updateActionBadge=updateActionBadge;window.raction=raction;window.toggleActionSelect=toggleActionSelect;window.updateSelectedCount=updateSelectedCount;window.approveAllPT=approveAllPT;window.approveAllLogbooks=approveAllLogbooks;window.approveSelected=approveSelected;window.approveSinglePT=approveSinglePT;window.rejectSinglePT=rejectSinglePT;window.showInstallPopup=showInstallPopup;
</script></body></html>
