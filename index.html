<style>
:root {
    --p: #0f172a;
    --s: #3b82f6;
    --g: #10b981;
    --w: #f59e0b;
    --d: #ef4444;
    --r: 20px;
    --rs: 14px;
    --card: #ffffff;
    --card-hover: #f8fafc;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --bg: #f8fafc;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow: 0 4px 6px rgba(0,0,0,0.05);
    --shadow-lg: 0 20px 60px rgba(0,0,0,0.1);
    --gradient: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #1a5276 100%);
    --glass: rgba(255,255,255,0.92);
}
body.dm {
    --card: #1e293b;
    --card-hover: #273548;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #334155;
    --bg: #0f172a;
    --glass: rgba(30,41,59,0.92);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--gradient);
    background-attachment:fixed;
    min-height:100vh;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
}
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#94a3b8; border-radius:10px; }
.aw { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
.ac { background:var(--card); border-radius:24px; box-shadow:var(--shadow-lg); width:100%; max-width:460px; overflow:hidden; transition:all 0.3s ease; border:1px solid var(--border); }
.ah { background:var(--gradient); padding:2.5rem 2rem; text-align:center; color:#fff; position:relative; overflow:hidden; }
.ah::after { content:''; position:absolute; bottom:-20px; left:-20px; right:-20px; height:40px; background:var(--card); border-radius:50% 50% 0 0; }
.ab { padding:2rem; }
.fc { border:2px solid var(--border); border-radius:var(--rs); padding:0.85rem 1rem; font-size:0.9rem; width:100%; background:var(--bg); transition:all 0.25s ease; color:var(--text); font-family:'Inter',sans-serif; }
.fc:focus { border-color:var(--s); box-shadow:0 0 0 4px rgba(59,130,246,0.1); outline:none; background:var(--card); }
.fc::placeholder { color:#94a3b8; }
.auto-expand { min-height:80px; max-height:300px; overflow-y:auto; resize:vertical; }
.bg { background:var(--gradient); color:#fff; border:none; border-radius:var(--rs); padding:0.9rem; font-weight:600; font-size:0.95rem; width:100%; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:0.6rem; transition:all 0.3s ease; position:relative; overflow:hidden; letter-spacing:0.3px; }
.bg::before { content:''; position:absolute; top:0; left:-100%; width:100%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent); transition:left 0.5s ease; }
.bg:hover::before { left:100%; }
.bg:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(15,23,42,0.4); }
.bg:disabled { opacity:0.6; pointer-events:none; transform:none; }
.bg:disabled::before { display:none; }
.bo { border:2px solid var(--s); color:var(--s); background:transparent; border-radius:var(--rs); padding:0.85rem; font-weight:600; width:100%; cursor:pointer; transition:all 0.3s ease; font-size:0.9rem; }
.bo:hover { background:var(--s); color:#fff; transform:translateY(-1px); }
.dc { display:none; min-height:100vh; }
.mc { padding:1rem; min-height:100vh; max-width:1200px; margin:0 auto; }
.tb { 
    background:var(--glass); 
    backdrop-filter:blur(20px); 
    -webkit-backdrop-filter:blur(20px); 
    border-radius:20px; 
    padding:0.8rem 1.5rem; 
    margin-bottom:1rem; 
    display:flex; 
    justify-content:space-between; 
    align-items:center; 
    gap:1.5rem; 
    box-shadow:var(--shadow); 
    position:sticky; 
    top:0.8rem; 
    z-index:100; 
    flex-wrap:wrap; 
    border:1px solid var(--border);
}
.tb-left {
    display:flex;
    align-items:center;
    gap:1rem;
    flex:1;
    min-width:200px;
}
.tb-center {
    display:flex;
    align-items:center;
    gap:0.8rem;
    flex-wrap:wrap;
}
.tb-right {
    display:flex;
    align-items:center;
    gap:1rem;
    flex-shrink:0;
}
.tb-logo {
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px solid var(--s);
    flex-shrink:0;
}
.tb-title {
    font-weight:700;
    font-size:0.88rem;
    letter-spacing:-0.2px;
    white-space:nowrap;
    color:var(--text);
}
.tb-role-badge {
    background:var(--s);
    color:#fff;
    padding:0.3rem 0.8rem;
    border-radius:20px;
    font-size:0.68rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    white-space:nowrap;
}
.tb-user-info {
    display:flex;
    align-items:center;
    gap:0.5rem;
    background:var(--bg);
    padding:0.4rem 1rem;
    border-radius:25px;
    border:1px solid var(--border);
}
.tb-user-name {
    font-weight:600;
    font-size:0.82rem;
    color:var(--text);
    max-width:200px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.tb-user-avatar {
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--gradient);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:0.75rem;
    flex-shrink:0;
}
.cc { background:var(--card); border-radius:20px; padding:1.8rem; box-shadow:var(--shadow); margin-bottom:1rem; animation:fi 0.4s cubic-bezier(0.4,0,0.2,1); border:1px solid var(--border); transition:all 0.3s ease; }
.cc:hover { box-shadow:var(--shadow-lg); }
@keyframes fi { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.bsc { background:var(--s); color:#fff; border:none; border-radius:12px; padding:0.55rem 1.1rem; font-size:0.82rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:0.5rem; transition:all 0.25s ease; letter-spacing:0.2px; white-space:nowrap; }
.bsc:hover { background:#2563eb; transform:translateY(-2px); box-shadow:0 4px 15px rgba(59,130,246,0.3); }
.bsc:disabled { opacity:0.5; pointer-events:none; }
.bsc-outline { background:transparent; color:var(--s); border:2px solid var(--s); border-radius:12px; padding:0.55rem 1.1rem; font-size:0.82rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:0.5rem; transition:all 0.25s ease; white-space:nowrap; }
.bsc-outline:hover { background:var(--s); color:#fff; transform:translateY(-2px); }
.bxsd { background:var(--d); color:#fff; border:none; border-radius:10px; padding:0.4rem 0.8rem; font-size:0.78rem; font-weight:600; cursor:pointer; transition:all 0.25s ease; }
.bxsd:hover { background:#dc2626; transform:translateY(-1px); }
.bxsw { background:var(--w); color:#1e293b; border:none; border-radius:10px; padding:0.4rem 0.8rem; font-size:0.78rem; font-weight:600; cursor:pointer; transition:all 0.25s ease; }
.bxsw:hover { background:#e5980b; transform:translateY(-1px); }
.bst { padding:0.25rem 0.7rem; border-radius:20px; font-weight:600; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.5px; }
.sg { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1rem; margin-bottom:1rem; }
.sc { background:var(--card); border-radius:20px; padding:1.8rem; text-align:center; box-shadow:var(--shadow); cursor:pointer; transition:all 0.3s ease; border:1px solid var(--border); }
.sc:hover { transform:translateY(-5px); box-shadow:0 15px 40px rgba(0,0,0,0.15); }
.sc h2 { font-size:2.2rem; font-weight:800; margin:0; color:var(--text); letter-spacing:-0.5px; }
.sc p { font-size:0.72rem; text-transform:uppercase; opacity:0.6; letter-spacing:0.8px; margin:0; font-weight:600; }
.sp-sm { border:2px dashed var(--border); border-radius:var(--rs); background:var(--bg); width:100%; height:100px; cursor:crosshair; }
.hamburger-btn { 
    background:var(--bg); 
    border:1px solid var(--border); 
    font-size:1.3rem; 
    cursor:pointer; 
    color:var(--text); 
    padding:0.5rem 0.7rem; 
    border-radius:12px; 
    transition:all 0.25s ease; 
    display:flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    flex-shrink:0;
}
.hamburger-btn:hover { background:var(--card-hover); }
.side-menu { position:fixed; top:0; left:-300px; width:285px; height:100vh; height:100dvh; background:var(--card); box-shadow:5px 0 40px rgba(0,0,0,0.2); z-index:1099; transition:left 0.35s cubic-bezier(0.4,0,0.2,1); padding:1.5rem 1rem; display:flex; flex-direction:column; overflow-y:auto; border-radius:0 24px 24px 0; border:1px solid var(--border); }
.side-menu.open { left:0; }
.side-menu-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1098; display:none; cursor:pointer; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
.side-menu-overlay.show { display:block; }
.smg { margin-bottom:0.5rem; }
.smgt { font-size:0.65rem; text-transform:uppercase; color:var(--muted); padding:0.6rem 0.9rem 0.3rem; font-weight:700; letter-spacing:1.2px; }
.smi { display:flex; align-items:center; gap:0.7rem; padding:0.7rem 0.9rem; border-radius:12px; cursor:pointer; color:var(--text); font-weight:500; margin:0.15rem 0; border:none; background:transparent; width:100%; text-align:left; font-size:0.84rem; transition:all 0.2s ease; }
.smi:hover { background:rgba(59,130,246,0.08); color:var(--s); transform:translateX(3px); }
.smi i { font-size:0.9rem; width:22px; text-align:center; }
.abg { background:var(--d); color:#fff; border-radius:20px; min-width:22px; height:20px; font-size:0.65rem; display:inline-flex; align-items:center; justify-content:center; font-weight:700; margin-left:auto; padding:0 7px; }
.sd { border-top:1px solid var(--border); margin:0.8rem 0; }
.act-card { border-left:4px solid var(--w); padding:1rem 1.2rem; margin-bottom:0.7rem; border-radius:14px; background:var(--card); display:flex; align-items:center; gap:1rem; font-size:0.82rem; transition:all 0.3s ease; box-shadow:var(--shadow-sm); border:1px solid var(--border); cursor:pointer; }
.act-card:hover { transform:translateX(4px); box-shadow:var(--shadow); border-left-color:var(--s); }
.pt-ch { font-weight:600; padding:0.85rem 1.2rem; background:var(--card); color:var(--text); border-radius:14px; cursor:pointer; margin:0.4rem 0; transition:all 0.3s ease; font-size:0.88rem; border:1px solid var(--border); display:flex; align-items:center; gap:0.5rem; }
.pt-ch:hover { background:var(--card-hover); transform:translateX(3px); border-color:var(--s); }
.pt-it { padding:0.55rem 1.5rem; border-bottom:1px solid var(--border); font-size:0.82rem; color:var(--text); }
.tag { display:inline-block; padding:0.25rem 0.8rem; border-radius:20px; font-size:0.7rem; font-weight:600; letter-spacing:0.3px; }
.badge-dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:7px; }
.empty-state { text-align:center; padding:3.5rem 1.5rem; }
.empty-state i { font-size:3.5rem; color:#cbd5e1; margin-bottom:1rem; display:block; }
body.dm .empty-state i { color:#475569; }
.report-section { border-radius:var(--rs); margin-bottom:0.6rem; overflow:hidden; border:1px solid var(--border); }
.report-header { background:var(--bg); padding:0.9rem 1.2rem; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:0.88rem; transition:all 0.25s ease; }
.report-header:hover { background:var(--card-hover); }
.report-body { padding:1.2rem; background:var(--card); }
.review-actions { display:flex; gap:0.6rem; margin-top:1.2rem; }
.review-actions button { flex:1; }
.alert-info-custom { background:rgba(59,130,246,0.06); border:1px solid rgba(59,130,246,0.15); border-radius:14px; padding:0.85rem 1rem; font-size:0.82rem; color:var(--s); }
.week-badge { display:inline-flex; align-items:center; gap:0.4rem; background:var(--gradient); color:#fff; padding:0.35rem 0.85rem; border-radius:20px; font-weight:700; font-size:0.78rem; }
.supervisor-card { cursor:pointer; transition:all 0.2s ease; }
.supervisor-card:hover { border-color:var(--s)!important; background:rgba(59,130,246,0.03)!important; }
.supervisor-card.selected { border-color:var(--s)!important; background:rgba(59,130,246,0.06)!important; }
@media (max-width:768px) { 
    .mc { padding:0.5rem; } 
    .cc { padding:1.2rem; } 
    .sg { grid-template-columns:repeat(2,1fr); } 
    .sc h2 { font-size:1.6rem; } 
    .tb { padding:0.6rem 1rem; gap:0.8rem; }
    .tb-user-name { max-width:120px; font-size:0.75rem; }
    .tb-title { font-size:0.78rem; }
    .tb-role-badge { font-size:0.62rem; padding:0.25rem 0.6rem; }
    .tb-user-info { padding:0.3rem 0.7rem; }
    .ah { padding:2rem 1.5rem; } 
    .ab { padding:1.5rem; } 
    .tb-center { order:3; width:100%; justify-content:center; }
}
@media (max-width:480px) {
    .tb { padding:0.5rem 0.8rem; }
    .tb-logo { width:30px; height:30px; }
    .tb-title { font-size:0.72rem; }
    .tb-user-name { max-width:80px; font-size:0.7rem; }
    .tb-user-avatar { width:24px; height:24px; font-size:0.65rem; }
}
</style>
</head>

async function pop(){
    if(!U||U.role!=='supervisor')return;
    
    // Zuia popup kurudia ndani ya dakika 1 (POPUP_COOLDOWN)
    const now=Date.now();
    if(now-lastPopupTime<POPUP_COOLDOWN){
        // Badala ya popup, update badge tu kwenye menu
        try{
            const asgn=await db.listDocuments(D,C.A,[Appwrite.Query.equal('supervisorId',U.userId)]);
            const sids=asgn.documents.map(a=>a.studentId);
            const logs=await db.listDocuments(D,C.L,[Appwrite.Query.equal('status','pending'),Appwrite.Query.limit(100)]);
            const my=logs.documents.filter(l=>sids.includes(l.studentId));
            const total=my.length;
            const badge=document.getElementById('actBadge');
            if(badge){
                badge.style.display=total>0?'inline-flex':'none';
                badge.textContent=total>99?'99+':total;
            }
        }catch(e){}
        return;
    }
    
    try{
        const asgn=await db.listDocuments(D,C.A,[Appwrite.Query.equal('supervisorId',U.userId)]);
        const sids=asgn.documents.map(a=>a.studentId);
        const logs=await db.listDocuments(D,C.L,[Appwrite.Query.equal('status','pending'),Appwrite.Query.limit(100)]);
        const my=logs.documents.filter(l=>sids.includes(l.studentId));
        const total=my.length;
        const badge=document.getElementById('actBadge');
        if(badge){
            badge.style.display=total>0?'inline-flex':'none';
            badge.textContent=total>99?'99+':total;
        }
        
        // Onyesha popup mara moja tu kwa muda wa POPUP_COOLDOWN
        if(total>0){
            lastPopupTime=now; // Rekodi muda wa popup
            const names=[];
            for(const l of my.slice(0,5)){
                try{
                    const su=await db.getDocument(D,C.U,l.studentId);
                    names.push({name:su.fullName,week:l.weekNumber,id:l.$id});
                }catch(e){}
            }
            
            const nameList=names.map(n=>`
                <div class="border rounded p-2 mb-1 d-flex justify-content-between align-items-center" style="cursor:pointer" onclick="Swal.clickConfirm();Swal.getPopup().__selectedLog='${n.id}'">
                    <span>📝 <strong>${n.name}</strong> - Week ${n.week}</span>
                    <i class="bi bi-chevron-right text-muted"></i>
                </div>
            `).join('');
            
            const r=await Swal.fire({
                title:`📬 ${total} New Submission(s)`,
                html:`
                    <div class="text-start small">
                        ${nameList}
                        ${my.length>5?`<p class="text-muted text-center">+${my.length-5} more</p>`:''}

                    <p class="small text-muted mt-2 mb-0">Click any student to review, or go to Action Required</p>

                showCancelButton:!0,
                cancelButtonText:'Later',
                confirmButtonColor:'#1a5276',
                cancelButtonColor:'#6b7280'
            });

                const selectedLog=Swal.getPopup().__selectedLog;
                if(selectedLog){
                    await rvL(selectedLog);
                }else{
                    lp('action_reviews');
                }
            }
        }
    }catch(e){}
}

async function reg(){const d={fn:document.getElementById('rfn')?.value?.trim(),em:document.getElementById('re')?.value?.trim(),ph:document.getElementById('rp')?.value?.trim(),rn:document.getElementById('rrn')?.value?.trim()||'',ins:document.getElementById('ri')?.value?.trim()||'',dep:document.getElementById('rd')?.value?.trim()||'',rg:document.getElementById('regR')?.value,ds:document.getElementById('regD')?.value,pw:document.getElementById('rpw')?.value};if(!d.fn||!d.em||!d.ph||!d.rg||!d.pw)return st('Fill all required fields','warning');if(d.pw.length<8)return st('Password min 8 chars','warning');const btn=document.getElementById('rb');btn.disabled=!0;try{sl();const uid=Appwrite.ID.unique(),now=new Date().toISOString();await ac.create(uid,d.em,d.pw,d.fn);await db.createDocument(D,C.U,uid,{userId:uid,fullName:d.fn,email:d.em,regNum:d.rn,institution:d.ins,department:d.dep,role:'student',phone:d.ph,region:d.rg,district:d.ds||'',supStatus:ST.NS,isActive:!0,createdAt:now,updatedAt:now});hl();st('Account created successfully! 🎉');cF();document.getElementById('rf').style.display='none';document.getElementById('lf').style.display='block'}catch(e){hl();Swal.fire({icon:'error',title:'Registration Failed',text:e.message})}btn.disabled=!1}
async function login(){const em=document.getElementById('le')?.value?.trim(),pw=document.getElementById('lp')?.value;if(!em||!pw)return st('Enter email & password','warning');const btn=document.getElementById('lb');btn.disabled=!0;try{sl();try{await ac.deleteSession('current')}catch(x){}await ac.createEmailPasswordSession(em,pw);const acc=await ac.get();let ud;try{ud=await db.listDocuments(D,C.U,[Appwrite.Query.equal('userId',acc.$id)])}catch(x){ud={total:0,documents:[]}}if(ud.total>0)U=ud.documents[0];else{const now=new Date().toISOString();U={userId:acc.$id,fullName:acc.name||em,email:acc.email||em,role:'student',supStatus:ST.NS};try{await db.createDocument(D,C.U,acc.$id,{...U,createdAt:now,updatedAt:now})}catch(x){}}hl();if(U.role==='supervisor'&&U.isActive===!1){try{await ac.deleteSession('current')}catch(e){}U=null;Swal.fire({icon:'info',title:'⏳ Pending Approval',text:'Your account is pending admin approval.'});btn.disabled=!1;return}if(U.role==='supervisor'&&!U.pwChanged){const changed=await fPw();if(!changed){try{await ac.deleteSession('current')}catch(e){}U=null;btn.disabled=!1;return}try{await db.updateDocument(D,C.U,U.userId,{pwChanged:new Date().toISOString(),updatedAt:new Date().toISOString()})}catch(e){}}cF();st(`Welcome, ${U.fullName}! 👋`);sD()}catch(e){hl();Swal.fire({icon:'error',title:'Login Failed',text:'Invalid email or password'})}btn.disabled=!1}
async function fPw(){const{value}=await Swal.fire({title:'🔒 Change Password Required',html:`<div class="text-start"><div class="alert alert-warning small mb-3"><strong>Security Alert!</strong><br>The student who registered you knows your password. Change it now.</div><input id="op" class="form-control form-control-sm mb-2" type="password" placeholder="Current Password *"><input id="np" class="form-control form-control-sm mb-2" type="password" placeholder="New Password (min 8) *"><input id="cp" class="form-control form-control-sm mb-2" type="password" placeholder="Confirm New Password *"></div>`,showCancelButton:!1,allowOutsideClick:!1,allowEscapeKey:!1,confirmButtonText:'Change Password',confirmButtonColor:'#1a5276',preConfirm:()=>{const op=document.getElementById('op').value,np=document.getElementById('np').value,cp=document.getElementById('cp').value;if(!op||!np||!cp)return Swal.showValidationMessage('All fields required');if(np.length<8)return Swal.showValidationMessage('Min 8 characters');if(np!==cp)return Swal.showValidationMessage('Passwords do not match');if(op===np)return Swal.showValidationMessage('Must be different');return{op,np}}});if(!value)return!1;try{sl();await ac.updatePassword(value.np,value.op);hl();await Swal.fire({icon:'success',title:'✅ Password Changed!',text:'Your account is now secure.',confirmButtonColor:'#10b981'});return!0}catch(e){hl();if(e.message.includes('Invalid credentials')){await Swal.fire({icon:'error',title:'Wrong Password',text:'Try again.'});return await fPw()}Swal.fire({icon:'error',title:'Error',text:e.message});return!1}}

// ============ SUPERVISOR CHANGE PASSWORD KUTOKA PROFILE ============
async function changePasswordFromProfile(){
    const{value:formData}=await Swal.fire({
        title:'🔒 Change Password',
        html:`
            <div class="text-start">
                <div class="alert alert-info small py-2 mb-3">
                    <i class="bi bi-info-circle"></i> Change your account password
                </div>
                <div class="mb-3">
                    <label class="small fw-semibold text-muted mb-1">Current Password *</label>
                    <input id="cpop" class="fc" type="password" placeholder="Enter current password">
                </div>
                <div class="mb-3">
                    <label class="small fw-semibold text-muted mb-1">New Password *</label>
                    <input id="cpnp" class="fc" type="password" placeholder="Min 8 characters">
                </div>
                <div class="mb-3">
                    <label class="small fw-semibold text-muted mb-1">Confirm New Password *</label>
                    <input id="cpcp" class="fc" type="password" placeholder="Re-enter new password">
                </div>
            </div>
        `,
        showCancelButton:!0,
        confirmButtonText:'<i class="bi bi-check-circle"></i> Change Password',
        cancelButtonText:'Cancel',
        confirmButtonColor:'#1a5276',
        preConfirm:()=>{
            const op=document.getElementById('cpop')?.value;
            const np=document.getElementById('cpnp')?.value;
            const cp=document.getElementById('cpcp')?.value;
            if(!op||!np||!cp){Swal.showValidationMessage('All fields required');return!1}
            if(np.length<8){Swal.showValidationMessage('Min 8 characters');return!1}
            if(np!==cp){Swal.showValidationMessage('Passwords do not match');return!1}
            if(op===np){Swal.showValidationMessage('New password must be different');return!1}
            return{op,np};
        }
    });
    
    if(!formData)return;
    
    try{
        sl();
        await ac.updatePassword(formData.np,formData.op);
        
        // Update pwChanged field
        try{
            await db.updateDocument(D,C.U,U.userId,{
                pwChanged:new Date().toISOString(),
                updatedAt:new Date().toISOString()
            });
        }catch(e){}
        
        U.pwChanged=new Date().toISOString();
        hl();
        
        await Swal.fire({
            icon:'success',
            title:'✅ Password Changed!',
            text:'Your password has been updated successfully.',
            confirmButtonColor:'#10b981'
        });
        
        st('Password changed successfully! 🔒');
    }catch(e){
        hl();
        if(e.message.includes('Invalid credentials')){
            Swal.fire({
                icon:'error',
                title:'Wrong Password',
                text:'Current password is incorrect. Please try again.',
                confirmButtonColor:'#ef4444'
            });
        }else{
            Swal.fire({
                icon:'error',
                title:'Error',
                text:e.message||'Failed to change password. Try again.'
            });
        }
    }
}

async function ract(){
    if(U.role!=='supervisor')return'<div class="cc"><div class="empty-state"><i class="bi bi-lock"></i><p>Access denied</p></div></div>';
    try{
        const asgn=await db.listDocuments(D,C.A,[Appwrite.Query.equal('supervisorId',U.userId)]);
        const sids=asgn.documents.map(a=>a.studentId);
        const logs=await db.listDocuments(D,C.L,[Appwrite.Query.equal('status','pending'),Appwrite.Query.limit(100)]);
        const fl=logs.documents.filter(l=>sids.includes(l.studentId));
        
        let h=`<div class="cc">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-bold mb-0">📋 Action Required</h5>
                <span class="badge bg-warning bst">${fl.length} pending</span>
            </div>`;
        
        if(!fl.length)return h+'<div class="empty-state"><i class="bi bi-check-circle" style="color:#10b981;font-size:3rem"></i><p class="mt-3">No pending reviews 🎉</p></div></div>';
        
        // Group by student
        const studentGroups={};
        for(const log of fl){
            if(!studentGroups[log.studentId]){
                studentGroups[log.studentId]={name:log.studentId,logs:[]};
                try{
                    const su=await db.getDocument(D,C.U,log.studentId);
                    studentGroups[log.studentId].name=su.fullName;
                }catch(e){}
            }
            studentGroups[log.studentId].logs.push(log);
        }
        
        // Display grouped
        for(const[sid,group]of Object.entries(studentGroups)){
            h+=`<div class="border rounded-3 p-3 mb-3" style="background:var(--card)">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <div style="width:35px;height:35px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.8rem">${group.name.charAt(0).toUpperCase()}</div>
                    <strong>${group.name}</strong>
                    <span class="badge bg-warning bst ms-2">${group.logs.length} pending</span>
                </div>`;
            
            for(const log of group.logs){
                h+=`<div class="act-card mb-2" onclick="rvL('${log.$id}')">
                    <div style="flex:1">
                        <strong>📝 Week ${log.weekNumber}</strong>
                        <br><small class="text-muted">Submitted: ${new Date(log.submittedAt).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'})}</small>
                        <p class="small text-muted mb-0 mt-1">${(log.activities||'').substring(0,60)}...</p>
                    </div>
                    <div class="d-flex gap-1">
                        <button class="bsc btn-sm" onclick="event.stopPropagation();rvL('${log.$id}')">
                            <i class="bi bi-eye"></i> Review
                        </button>
                    </div>
                </div>`;
            }
            h+=`</div>`;
        }
        
        return h+'</div>';
    }catch(e){return'<div class="cc">Error</div>'}
}

async function cFA(sid){const r=await Swal.fire({title:'Final Assessment',html:`<div class="text-start"><input id="fm" class="form-control form-control-sm mb-2" type="number" min="0" max="100" placeholder="Marks (0-100) *"><textarea id="fc" class="form-control form-control-sm mb-2" rows="3" placeholder="Comments (Optional)"></textarea></div>`,showCancelButton:!0,confirmButtonText:'Submit',confirmButtonColor:'#1a5276',preConfirm:()=>{const m=document.getElementById('fm')?.value;if(!m||m<0||m>100)return Swal.showValidationMessage('Valid marks (0-100) required');return{marks:parseInt(m),comments:document.getElementById('fc')?.value||''}}});if(!r)return;try{sl();const now=new Date().toISOString();await db.createDocument(D,C.F,Appwrite.ID.unique(),{studentId:sid,supervisorId:U.userId,marks:r.value.marks,comments:r.value.comments,status:'submitted',createdAt:now,updatedAt:now});await cn(sid,'📝 Assessment','Your supervisor assessed you: '+r.value.marks+'/100');hl();st('Submitted! ✅');lp('final_assessment')}catch(e){hl();Swal.fire({icon:'error',text:e.message})}}
async function rcr(){try{const logs=await db.listDocuments(D,C.L,[Appwrite.Query.equal('studentId',U.userId),Appwrite.Query.orderAsc('weekNumber'),Appwrite.Query.limit(52)]);if(logs.total===0)return`<div class="cc empty-state"><i class="bi bi-file-earmark-text" style="font-size:3rem"></i><h5 class="mt-2">No Reports Yet</h5><p class="text-muted small">Submit logbooks to see your full report</p></div>`;const approved=logs.documents.filter(l=>l.status==='approved').length;const pending=logs.documents.filter(l=>l.status==='pending').length;const rejected=logs.documents.filter(l=>l.status==='rejected').length;let faMarks='N/A';try{const fa=await db.listDocuments(D,C.F,[Appwrite.Query.equal('studentId',U.userId),Appwrite.Query.limit(1)]);if(fa.total>0)faMarks=fa.documents[0].marks+'/100'}catch(e){}let h=`<div class="cc"><h5 class="fw-bold mb-4">📊 Comprehensive Report</h5><div class="sg"><div class="sc"><h2>${logs.total}</h2><p>Total Weeks</p></div><div class="sc"><h2 style="color:#10b981">${approved}</h2><p>Approved</p></div><div class="sc"><h2 style="color:#f59e0b">${pending}</h2><p>Pending</p></div><div class="sc"><h2 style="color:#ef4444">${rejected}</h2><p>Rejected</p></div><div class="sc"><h2 style="color:#8b5cf6">${faMarks}</h2><p>Final Marks</p></div></div><h6 class="fw-bold mt-4 mb-3">📅 Weekly Activities</h6>`;logs.documents.forEach(log=>{const sc={pending:'warning',approved:'success',rejected:'danger'};h+=`<div class="border rounded-3 p-3 mb-2" style="border-left:4px solid ${log.status==='approved'?'#10b981':log.status==='rejected'?'#ef4444':'#f59e0b'}"><div class="d-flex justify-content-between"><strong>Week ${log.weekNumber}</strong><span class="badge bg-${sc[log.status]||'secondary'} bst">${log.status}</span></div><pre style="font-size:.75rem;background:#f8fafc;padding:.8rem;border-radius:8px;margin-top:.8rem;white-space:pre-wrap;max-height:200px;overflow-y:auto">${log.activities||'No activities'}</pre>${log.recommendations?`<p class="small mt-2 mb-0"><strong>📝 Summary:</strong> ${log.recommendations}</p>`:''}<small class="text-muted">Submitted: ${log.submittedAt?new Date(log.submittedAt).toLocaleDateString():'N/A'}</small></div>`});h+=`<div class="d-flex gap-2 mt-4"><button class="bsc" onclick="exportFP()"><i class="bi bi-file-pdf"></i>Export PDF</button></div></div>`;return h}catch(e){return'<div class="cc">Error loading report</div>'}}
async function exportFP(){try{const logs=await db.listDocuments(D,C.L,[Appwrite.Query.equal('studentId',U.userId),Appwrite.Query.orderAsc('weekNumber'),Appwrite.Query.limit(52)]);const{jsPDF}=window.jspdf;const doc=new jsPDF();let y=15;doc.setFontSize(16);doc.text('BEHSIT FIELD SYSTEM - Full Report',20,y);y+=8;doc.setFontSize(10);doc.text(`Student: ${U.fullName} | Date: ${new Date().toLocaleDateString()}`,20,y);y+=8;logs.documents.forEach(log=>{if(y>270){doc.addPage();y=15}doc.setFontSize(8);doc.text(`Week ${log.weekNumber} - ${log.status}: ${(log.activities||'').substring(0,150)}`,22,y);y+=6});doc.save(`${U.fullName}_Full_Report.pdf`);st('PDF exported! 📄')}catch(e){Swal.fire({icon:'error',text:e.message})}}
async function rsr(){if(U.role!=='supervisor')return'<div class="cc">Access denied</div>';try{const asgn=await db.listDocuments(D,C.A,[Appwrite.Query.equal('supervisorId',U.userId)]);if(asgn.total===0)return`<div class="cc empty-state"><i class="bi bi-people" style="font-size:3rem"></i><h5 class="mt-2">No Students Assigned</h5><p class="text-muted small">You have no students assigned yet</p></div>`;let h=`<div class="cc"><h5 class="fw-bold mb-4">📊 Student Reports (${asgn.total})</h5>`;for(const a of asgn.documents){let sn=a.studentId;try{const su=await db.getDocument(D,C.U,a.studentId);sn=su.fullName}catch(e){}const logs=await db.listDocuments(D,C.L,[Appwrite.Query.equal('studentId',a.studentId),Appwrite.Query.orderAsc('weekNumber'),Appwrite.Query.limit(52)]);const approved=logs.documents.filter(l=>l.status==='approved').length;h+=`<div class="report-section"><div class="report-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'"><span>👤 ${sn}</span><span class="badge bg-success bst">${approved}/${logs.total} approved</span></div><div class="report-body" style="display:none">`;if(logs.total===0)h+='<p class="text-muted small">No logbooks submitted</p>';else{logs.documents.forEach(log=>{h+=`<div class="border rounded-3 p-2 mb-2 small"><strong>Week ${log.weekNumber}</strong> - <span class="badge bg-${log.status==='approved'?'success':log.status==='pending'?'warning':'danger'} bst">${log.status}</span><pre style="font-size:.7rem;background:#f8fafc;padding:.5rem;border-radius:6px;margin-top:.5rem;max-height:80px;overflow-y:auto">${(log.activities||'').substring(0,200)}</pre></div>`})}h+=`</div></div>`}return h+'</div>'}catch(e){return'<div class="cc">Error</div>'}}
function rs(){return`<div class="cc"><h5 class="fw-bold mb-4">🔍 Search</h5><input id="si" class="fc mb-3" placeholder="Search users..."><button class="bsc btn-sm" onclick="pS()"><i class="bi bi-search"></i>Search</button><div id="srr" class="mt-3"></div></div>`}
async function pS(){const q=document.getElementById('si')?.value?.trim()?.toLowerCase();if(!q||q.length<2)return st('Enter 2+ characters','warning');sl();let r=[];try{const users=await db.listDocuments(D,C.U,[Appwrite.Query.limit(100)]);for(const u of users.documents)if((u.fullName||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q))r.push({icon:'👤',title:u.fullName,sub:`${u.email} • ${u.role}`});hl();document.getElementById('srr').innerHTML=r.length?r.map(x=>`<div class="border rounded-3 p-3 mb-2 small"><strong>${x.icon} ${x.title}</strong><br><span class="text-muted">${x.sub}</span></div>`).join(''):'<p class="text-muted text-center py-4">No results found</p>'}catch(e){hl()}}
async function ru(){try{const users=await db.listDocuments(D,C.U,[Appwrite.Query.limit(200)]);let h=`<div class="cc"><h5 class="fw-bold mb-4">👥 Users (${users.total})</h5><div class="table-responsive"><table class="table table-sm small"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>`;for(const u of users.documents)h+=`<tr><td>${u.fullName}</td><td>${u.email}</td><td><span class="badge bg-${u.role==='admin'?'danger':u.role==='supervisor'?'warning':'primary'} bst">${u.role}</span></td><td>${u.isActive!==!1?'<span class="badge-dot bg-success d-inline-block"></span>Active':'<span class="badge-dot bg-danger d-inline-block"></span>Inactive'}</td></tr>`;return h+'</tbody></table></div></div>'}catch(e){return'<div class="cc">Error</div>'}}
async function rpa(){try{const sups=await db.listDocuments(D,C.U,[Appwrite.Query.equal('role','supervisor'),Appwrite.Query.equal('isActive',!1)]);let h=`<div class="cc"><h5 class="fw-bold mb-4">⏳ Pending Approvals (${sups.total})</h5>`;if(sups.total===0)return h+'<div class="empty-state"><i class="bi bi-check-circle" style="color:#10b981;font-size:3rem"></i><p class="mt-3">All supervisors approved 🎉</p></div></div>';for(const s of sups.documents){let sn='N/A';try{const st=await db.listDocuments(D,C.U,[Appwrite.Query.equal('supId',s.userId)]);if(st.total>0)sn=st.documents[0].fullName}catch(e){}h+=`<div class="border rounded-3 p-3 mb-3"><div class="d-flex justify-content-between"><strong>${s.fullName}</strong><span class="badge bg-warning bst">Pending</span></div><small class="text-muted">Email: ${s.email} | Region: ${s.region||'N/A'}</small><br><small class="text-muted">Registered by: ${sn}</small><div class="mt-3"><button class="bsc btn-sm" onclick="aSU('${s.$id}')"><i class="bi bi-check"></i>Approve</button><button class="bxsd btn-sm ms-2" onclick="rSU('${s.$id}')"><i class="bi bi-x"></i>Reject</button></div></div>`}return h+'</div>'}catch(e){return'<div class="cc">Error</div>'}}
async function aSU(uid){const r=await Swal.fire({title:'Approve Supervisor?',text:'This will activate the account.',icon:'question',showCancelButton:!0,confirmButtonColor:'#10b981',confirmButtonText:'Yes, Approve'});if(!r.isConfirmed)return;try{sl();const now=new Date().toISOString();await db.updateDocument(D,C.U,uid,{isActive:!0,updatedAt:now});const sts=await db.listDocuments(D,C.U,[Appwrite.Query.equal('supId',uid)]);if(sts.total>0){const st=sts.documents[0];const aid=Appwrite.ID.unique();await db.createDocument(D,C.A,aid,{assignmentId:aid,studentId:st.userId,supervisorId:uid,region:st.region||'',status:'active',createdAt:now,updatedAt:now});await db.updateDocument(D,C.U,st.userId,{supStatus:ST.A,updatedAt:now});await cn(st.userId,'✅ Supervisor Approved','Your supervisor has been approved!')}await cn(uid,'✅ Account Approved','Your account is now active.');hl();st('Approved! ✅');lp('pending_approvals');uB()}catch(e){hl();Swal.fire({icon:'error',text:e.message})}}
async function rSU(uid){const r=await Swal.fire({title:'Reject Supervisor?',text:'This will delete the supervisor account.',icon:'warning',showCancelButton:!0,confirmButtonColor:'#ef4444',confirmButtonText:'Yes, Reject'});if(!r.isConfirmed)return;try{sl();const now=new Date().toISOString();await db.deleteDocument(D,C.U,uid);const sts=await db.listDocuments(D,C.U,[Appwrite.Query.equal('supId',uid)]);if(sts.total>0){await db.updateDocument(D,C.U,sts.documents[0].userId,{supStatus:ST.R,supId:null,supName:null,supEmail:null,supRegion:null,updatedAt:now});await cn(sts.documents[0].userId,'❌ Supervisor Rejected','Please register a different supervisor.')}hl();st('Rejected');lp('pending_approvals');uB()}catch(e){hl();Swal.fire({icon:'error',text:e.message})}}
async function ral(){try{const logs=await db.listDocuments(D,C.L,[Appwrite.Query.limit(50)]);let h=`<div class="cc"><h5 class="fw-bold mb-4">All Logbooks</h5>`;for(const l of logs.documents){let sn=l.studentId;try{const su=await db.getDocument(D,C.U,l.studentId);sn=su.fullName}catch(e){}h+=`<div class="border rounded-3 p-2 mb-2 small">Week ${l.weekNumber} | ${sn} | <span class="badge bg-${l.status==='approved'?'success':l.status==='pending'?'warning':'danger'} bst">${l.status}</span></div>`}return h+'</div>'}catch(e){return'<div class="cc">Error</div>'}}
async function ras(){try{const as=await db.listDocuments(D,C.A,[Appwrite.Query.limit(100)]);let h=`<div class="cc"><h5 class="fw-bold mb-4">Assignments</h5>`;for(const a of as.documents){let sn=a.studentId,sp='N/A';try{const su=await db.getDocument(D,C.U,a.studentId);sn=su.fullName}catch(e){}try{if(a.supervisorId){const su=await db.getDocument(D,C.U,a.supervisorId);sp=su.fullName}}catch(e){}h+=`<div class="border rounded-3 p-2 mb-2 small">${sn} → ${sp} | <span class="badge bg-${a.status==='active'?'success':'secondary'} bst">${a.status}</span></div>`}return h+'</div>'}catch(e){return'<div class="cc">Error</div>'}}
async function rn(){return`<div class="cc"><h5 class="fw-bold mb-4">📊 Analytics</h5><canvas id="acv" height="80"></canvas></div>`}
async function rc(){try{const[u,l]=await Promise.all([db.listDocuments(D,C.U),db.listDocuments(D,C.L)]);const ctx=document.getElementById('acv');if(!ctx)return;new Chart(ctx.getContext('2d'),{type:'doughnut',data:{labels:['Students','Supervisors','Pending','Approved'],datasets:[{data:[u.documents.filter(x=>x.role==='student').length,u.documents.filter(x=>x.role==='supervisor').length,l.documents.filter(x=>x.status==='pending').length,l.documents.filter(x=>x.status==='approved').length],backgroundColor:['#3b82f6','#10b981','#f59e0b','#8b5cf6']}]},options:{responsive:!0,plugins:{legend:{position:'bottom'}}}})}catch(e){}}

function red(){return`<div class="cc empty-state"><i class="bi bi-download" style="font-size:3rem"></i><h5 class="mt-2">Export Data</h5><p class="text-muted small">Coming soon</p></div>`}
let dp;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;setTimeout(()=>{Swal.fire({title:'Install App',text:'Add to home screen for better experience',icon:'info',showCancelButton:!0,confirmButtonText:'Install',cancelButtonText:'Later',confirmButtonColor:'#1a5276'}).then(r=>{if(r.isConfirmed&&dp){dp.prompt();dp.userChoice.then(c=>{if(c.outcome==='accepted')st('✓ Installed!');dp=null})}})},1500)});
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
document.addEventListener('DOMContentLoaded',()=>{pR();document.getElementById('lb').addEventListener('click',function(){this.disabled=!0;login().finally(()=>{setTimeout(()=>this.disabled=!1,300)})});document.getElementById('rb').addEventListener('click',function(){this.disabled=!0;reg().finally(()=>{setTimeout(()=>this.disabled=!1,300)})});document.getElementById('srl').addEventListener('click',()=>{cF();document.getElementById('lf').style.display='none';document.getElementById('rf').style.display='block';pR()});document.getElementById('btl').addEventListener('click',()=>{cF();document.getElementById('rf').style.display='none';document.getElementById('lf').style.display='block'});document.getElementById('mLogout').addEventListener('click',logout);document.getElementById('hb').addEventListener('click',tS);document.getElementById('smo').addEventListener('click',cS);document.getElementById('mDark').addEventListener('click',()=>{document.body.classList.toggle('dm');cS()});document.getElementById('mContact').addEventListener('click',()=>{Swal.fire({title:'📞 Help & Support',html:'<h4 style="color:#3b82f6;font-weight:700">0624887209</h4><a href="https://wa.link/epddi1" target="_blank" class="btn btn-success btn-sm mt-3"><i class="bi bi-whatsapp"></i> WhatsApp</a>',confirmButtonColor:'#1a5276'});cS()});document.querySelectorAll('.smi[data-p]').forEach(item=>{item.addEventListener('click',function(){lp(this.dataset.p)})});ck()});
window.lp=lp;window.cLB=cLB;window.rvL=rvL;window.vL=vL;window.eP=eP;window.dL=dL;window.cFA=cFA;window.eMS=eMS;window.searchSupervisor=searchSupervisor;window.aSU=aSU;window.rSU=rSU;window.pS=pS;window.tP=tP;window.uD=uD;window.pR=pR;window.pop=pop;window.exportFP=exportFP;window.changePasswordFromProfile=changePasswordFromProfile;
